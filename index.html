// ──────────────────────────────────────────────────────────
// Joystick
// ──────────────────────────────────────────────────────────
class Joystick {
  constructor() {
    this.active = false;
    this.baseX = 0;
    this.baseY = 0;
    this.stickX = 0;
    this.stickY = 0;
    this.dx = 0;
    this.dy = 0;
    this.maxRadius = 50;
    this.touchId = null;
  }

  onTouchStart(e) {
    for (const t of e.changedTouches) {
      const pos = getTouchPos(t);
      if (pos.y > GAME_H / 2 && this.touchId === null) {
        this.touchId = t.identifier;
        this.active = true;
        this.baseX = pos.x;
        this.baseY = pos.y;
        this.stickX = pos.x;
        this.stickY = pos.y;
        this.dx = 0;
        this.dy = 0;
      }
    }
  }

  onTouchMove(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === this.touchId) {
        const pos = getTouchPos(t);
        const rawDx = pos.x - this.baseX;
        const rawDy = pos.y - this.baseY;
        const d = Math.hypot(rawDx, rawDy);
        if (d > this.maxRadius) {
          this.stickX = this.baseX + (rawDx / d) * this.maxRadius;
          this.stickY = this.baseY + (rawDy / d) * this.maxRadius;
          this.dx = rawDx / d;
          this.dy = rawDy / d;
        } else {
          this.stickX = pos.x;
          this.stickY = pos.y;
          this.dx = rawDx / this.maxRadius;
          this.dy = rawDy / this.maxRadius;
        }
      }
    }
  }

  onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === this.touchId) {
        this.active = false;
        this.touchId = null;
        this.dx = 0;
        this.dy = 0;
      }
    }
  }

  draw() {
    if (!this.active) return;
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.baseX, this.baseY, this.maxRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = COLORS.uiBorder;
    ctx.beginPath();
    ctx.arc(this.stickX, this.stickY, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// 🎮 메인 게임 클래스
// ============================================================
class Game {
  constructor() {
    this.state = GameState.TITLE;
    this.player = null;
    this.monsters = [];
    this.bosses = [];
    this.projectiles = [];
    this.droppedItems = [];
    this.spawnPads = [];
    this.skillSystem = null;
    this.ui = new UISystem(this);
    this.joystick = new Joystick();
    this.gameTimer = 0;
    this.killCount = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 2500;
    this.bgColor = COLORS.bg;
    this.bgTransitionTimer = 0;
    this.twitchEventDone = false;
    this.turkeyHarangTimer = 0;
    this.showTurkeyHarang = false;
    this.finalBossSpawned = false;
    this.clearStats = null;

    this._bindEvents();
    this._loop();
  }

  _bindEvents() {
    canvas.addEventListener('touchstart', e => { e.preventDefault(); this._onTouchStart(e); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); this._onTouchMove(e); }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); this._onTouchEnd(e); }, { passive: false });
    canvas.addEventListener('mousedown', e => { this._onMouseDown(e); });
    canvas.addEventListener('mousemove', e => { this._onMouseMove(e); });
    canvas.addEventListener('mouseup', e => { this._onMouseUp(e); });

    // ⌨️ WASD / 방향키 지원
    this._keys = {};
    window.addEventListener('keydown', e => {
      this._keys[e.code] = true;
      // ESC / P → 일시정지 토글
      if ((e.code === 'Escape' || e.code === 'KeyP') && this.state === GameState.PLAYING) {
        this.state = GameState.PAUSED;
        this.ui.pauseViewingItem = null;
      } else if ((e.code === 'Escape' || e.code === 'KeyP') && this.state === GameState.PAUSED) {
        this.state = GameState.PLAYING;
      }
      // Enter → 타이틀에서 시작
      if (e.code === 'Enter' && this.state === GameState.TITLE) {
        this.startGame();
      }
      // R → 결과화면에서 재시작
      if (e.code === 'KeyR' && (this.state === GameState.CLEAR || this.state === GameState.GAMEOVER)) {
        this.state = GameState.TITLE;
      }
    });
    window.addEventListener('keyup', e => { this._keys[e.code] = false; });
  }

  _updateKeyboardJoystick() {
    if (this.state !== GameState.PLAYING) return;
    // 마우스 조이스틱이 활성화 중이면 키보드 무시
    if (this.joystick.touchId !== null) return;

    const left  = this._keys['KeyA'] || this._keys['ArrowLeft'];
    const right = this._keys['KeyD'] || this._keys['ArrowRight'];
    const up    = this._keys['KeyW'] || this._keys['ArrowUp'];
    const down  = this._keys['KeyS'] || this._keys['ArrowDown'];

    let dx = 0, dy = 0;
    if (left)  dx -= 1;
    if (right) dx += 1;
    if (up)    dy -= 1;
    if (down)  dy += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      this.joystick.active = true;
      this.joystick.dx = dx / len;
      this.joystick.dy = dy / len;
    } else {
      if (this.joystick.touchId === null) {
        this.joystick.active = false;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
    }
  }

  _getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = GAME_W / rect.width;
    const scaleY = GAME_H / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  _onTouchStart(e) {
    for (const t of e.changedTouches) {
      const pos = this._getCanvasPos(t.clientX, t.clientY);
      this._handleTap(pos.x, pos.y, t.identifier);
    }
    // 조이스틱용 래핑
    const wrapped = { changedTouches: [...e.changedTouches].map(t => ({ ...t, ...this._getCanvasPos(t.clientX, t.clientY), identifier: t.identifier })) };
    // 직접 처리
    for (const t of e.changedTouches) {
      const pos = this._getCanvasPos(t.clientX, t.clientY);
      if (pos.y > GAME_H / 2 && this.joystick.touchId === null && this.state === GameState.PLAYING) {
        this.joystick.touchId = t.identifier;
        this.joystick.active = true;
        this.joystick.baseX = pos.x;
        this.joystick.baseY = pos.y;
        this.joystick.stickX = pos.x;
        this.joystick.stickY = pos.y;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
    }
  }

  _onTouchMove(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === this.joystick.touchId) {
        const pos = this._getCanvasPos(t.clientX, t.clientY);
        const rawDx = pos.x - this.joystick.baseX;
        const rawDy = pos.y - this.joystick.baseY;
        const d = Math.hypot(rawDx, rawDy);
        if (d > this.joystick.maxRadius) {
          this.joystick.stickX = this.joystick.baseX + (rawDx / d) * this.joystick.maxRadius;
          this.joystick.stickY = this.joystick.baseY + (rawDy / d) * this.joystick.maxRadius;
          this.joystick.dx = rawDx / d;
          this.joystick.dy = rawDy / d;
        } else {
          this.joystick.stickX = pos.x;
          this.joystick.stickY = pos.y;
          this.joystick.dx = rawDx / this.joystick.maxRadius;
          this.joystick.dy = rawDy / this.joystick.maxRadius;
        }
      }
    }
  }

  _onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === this.joystick.touchId) {
        this.joystick.active = false;
        this.joystick.touchId = null;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
    }
  }

  _onMouseDown(e) {
    const pos = this._getCanvasPos(e.clientX, e.clientY);
    this._handleTap(pos.x, pos.y, 'mouse');
    if (pos.y > GAME_H / 2 && this.state === GameState.PLAYING) {
      this.joystick.touchId = 'mouse';
      this.joystick.active = true;
      this.joystick.baseX = pos.x;
      this.joystick.baseY = pos.y;
      this.joystick.stickX = pos.x;
      this.joystick.stickY = pos.y;
      this.joystick.dx = 0;
      this.joystick.dy = 0;
    }
  }

  _onMouseMove(e) {
    if (this.joystick.touchId === 'mouse') {
      const pos = this._getCanvasPos(e.clientX, e.clientY);
      const rawDx = pos.x - this.joystick.baseX;
      const rawDy = pos.y - this.joystick.baseY;
      const d = Math.hypot(rawDx, rawDy);
      if (d > this.joystick.maxRadius) {
        this.joystick.stickX = this.joystick.baseX + (rawDx / d) * this.joystick.maxRadius;
        this.joystick.stickY = this.joystick.baseY + (rawDy / d) * this.joystick.maxRadius;
        this.joystick.dx = rawDx / d;
        this.joystick.dy = rawDy / d;
      } else {
        this.joystick.stickX = pos.x;
        this.joystick.stickY = pos.y;
        this.joystick.dx = rawDx / this.joystick.maxRadius;
        this.joystick.dy = rawDy / this.joystick.maxRadius;
      }
    }
  }

  _onMouseUp(e) {
    if (this.joystick.touchId === 'mouse') {
      this.joystick.active = false;
      this.joystick.touchId = null;
      this.joystick.dx = 0;
      this.joystick.dy = 0;
    }
  }

  _handleTap(x, y, touchId) {
    switch (this.state) {
      case GameState.TITLE:
        // 시작 버튼
        if (x > GAME_W / 2 - 80 && x < GAME_W / 2 + 80 && y > GAME_H * 0.7 && y < GAME_H * 0.7 + 46) {
          this.startGame();
        }
        break;

      case GameState.PLAYING:
        // 일시정지 버튼
        if (x > GAME_W - 38 && x < GAME_W && y > 5 && y < 55) {
          this.state = GameState.PAUSED;
          this.ui.pauseViewingItem = null;
          return;
        }
        // 스킬 탭 (상단 스킬바)
        if (y > 5 && y < 55 && x < GAME_W - 40) {
          const skillIds = Object.keys(SKILLS_DATA);
          const iconW = (GAME_W - 40) / skillIds.length;
          const idx = Math.floor(x / iconW);
          if (idx >= 0 && idx < skillIds.length) {
            const skillId = skillIds[idx];
            const skill = SKILLS_DATA[skillId];
            const p = this.player;
            // + 버튼 영역 (아이콘 우하단)
            const sx = idx * iconW + 2;
            const sy = 7;
            const sw = iconW - 4;
            const sh = 46;
            if (x > sx + sw - 12 && x < sx + sw && y > sy + sh - 12 && y < sy + sh) {
              p.upgradeSkill(skillId);
            } else {
              p.toggleSkill(skillId);
            }
          }
        }
        // 아이템 플래시 탭
        if (this.ui.itemFlashTimer > 0 && this.ui.itemFlashData && y > GAME_H - 90 && y < GAME_H - 15) {
          if (this.ui._pendingEquip) {
            // 교체 버튼 탭 → 장착
            this.player.equipItem(this.ui.itemFlashData);
            this.ui._pendingEquip = false;
            this.ui.itemFlashTimer = 0;
          } else {
            // 일반 플래시 탭 → 상세 보기
            this.state = GameState.PAUSED;
            this.ui.pauseViewingItem = this.ui.itemFlashData;
          }
          return;
        }
        break;

      case GameState.PAUSED:
        if (this.ui.pauseViewingItem) {
          // 뒤로가기
          if (x > GAME_W / 2 - 50 && x < GAME_W / 2 + 50 && y > GAME_H - 100 && y < GAME_H - 68) {
            this.ui.pauseViewingItem = null;
          }
        } else {
          // 장비 아이템 탭
          const slots = ['weapon', 'head', 'armor', 'boots'];
          slots.forEach((slot, i) => {
            const iy = 158 + i * 44;
            if (x > 30 && x < GAME_W - 30 && y > iy && y < iy + 38) {
              const item = this.player.equipment[slot];
              if (item) this.ui.pauseViewingItem = item;
            }
          });
          // 계속하기 버튼
          const btnY = GAME_H - 120;
          if (x > GAME_W / 2 - 70 && x < GAME_W / 2 + 70 && y > btnY && y < btnY + 38) {
            this.state = GameState.PLAYING;
          }
        }
        break;

      case GameState.CLEAR:
      case GameState.GAMEOVER:
        // 다시하기 버튼
        if (x > GAME_W / 2 - 70 && x < GAME_W / 2 + 70 && y > GAME_H - 120 && y < GAME_H - 80) {
          this.state = GameState.TITLE;
        }
        break;
    }
  }

  startGame() {
    this.player = new Player();
    this.monsters = [];
    this.bosses = [];
    this.projectiles = [];
    this.droppedItems = [];
    this.spawnPads = SPAWN_PADS.map(d => new SpawnPad(d));
    this.skillSystem = new SkillSystem(this.player, this.projectiles, this.monsters, this.bosses);
    this.gameTimer = 0;
    this.killCount = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 2500;
    this.bgColor = COLORS.bg;
    this.bgTransitionTimer = 0;
    this.twitchEventDone = false;
    this.turkeyHarangTimer = 0;
    this.showTurkeyHarang = false;
    this.finalBossSpawned = false;
    this.clearStats = null;
    this.state = GameState.PLAYING;
  }

  update(dt) {
    switch (this.state) {
      case GameState.PLAYING:
        this._updatePlaying(dt);
        break;
      case GameState.PAUSED:
        // 정지 중 UI만 업데이트
        this.ui.update(dt);
        break;
    }
  }

  _updatePlaying(dt) {
    this.gameTimer += dt;
    this.ui.update(dt);

    // 배경 전환 타이머
    if (this.bgTransitionTimer > 0) {
      this.bgTransitionTimer -= dt;
    }

    // 터키 해랑이 타이머
    if (this.showTurkeyHarang) {
      this.turkeyHarangTimer -= dt;
      if (this.turkeyHarangTimer <= 0) this.showTurkeyHarang = false;
    }

    // 트위치 이벤트 (90초)
    if (!this.twitchEventDone && this.gameTimer >= 90000) {
      this.twitchEventDone = true;
      this._spawnTwitchEvent();
    }

    // 최종 보스 (240초)
    if (!this.finalBossSpawned && this.gameTimer >= 240000) {
      this._spawnFinalBoss();
    }

    // 키보드 조이스틱 업데이트
    this._updateKeyboardJoystick();

    // 플레이어 업데이트
    this.player.update(dt, this.joystick);

    // 스킬 업데이트
    this.skillSystem.update(dt);

    // 몬스터 스폰 (시간에 따라 밀도 급격히 증가)
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer = 0;
      const elapsed = this.gameTimer / 1000;
      // 동시 스폰 수: 초반 1마리, 1분 후 2마리, 2분 후 3마리
      const batchCount = 1 + Math.floor(elapsed / 60);
      for (let i = 0; i < batchCount; i++) this._spawnMonster();
      // 스폰 간격: 초반 2.5초 → 후반 0.5초로 급격히 감소
      this.spawnInterval = Math.max(500, 2500 - elapsed * 16);
    }

    // 몬스터 업데이트
    this.monsters.forEach(m => m.update(dt, this.player));

    // 몬스터 간 겹침 방지 (소프트 분리)
    for (let i = 0; i < this.monsters.length; i++) {
      const a = this.monsters[i];
      if (a.isDead) continue;
      for (let j = i + 1; j < this.monsters.length; j++) {
        const b = this.monsters[j];
        if (b.isDead) continue;
        const minDist = (a.size + b.size) * 0.7;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minDist) {
          const push = (minDist - d) * 0.3;
          const nx = dx / d;
          const ny = dy / d;
          a.x -= nx * push * 0.5;
          a.y -= ny * push * 0.5;
          b.x += nx * push * 0.5;
          b.y += ny * push * 0.5;
          // 경계 재클램프
          a.x = clamp(a.x, a.size, GAME_W - a.size);
          a.y = clamp(a.y, 80 + a.size, GAME_H - a.size);
          b.x = clamp(b.x, b.size, GAME_W - b.size);
          b.y = clamp(b.y, 80 + b.size, GAME_H - b.size);
        }
      }
    }

    this.monsters = this.monsters.filter(m => {
      if (m.isDead && m.deathTimer > 400) {
        this.player.gainXP(m.data.xp);
        this.killCount++;
        return false;
      }
      return true;
    });

    // 보스-몬스터 간 겹침 방지 (소프트 분리)
    for (const boss of this.bosses) {
      if (boss.isDead) continue;
      for (const m of this.monsters) {
        if (m.isDead) continue;
        const minD = (boss.size + m.size) * 0.75;
        const dx = m.x - boss.x;
        const dy = m.y - boss.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minD) {
          const push = (minD - d) * 0.4;
          const nx = dx / d;
          const ny = dy / d;
          // 몬스터만 밀어냄 (보스는 고정)
          m.x += nx * push;
          m.y += ny * push;
          m.x = clamp(m.x, m.size, GAME_W - m.size);
          m.y = clamp(m.y, 80 + m.size, GAME_H - m.size);
        }
      }
      // 보스끼리도 분리
      for (const other of this.bosses) {
        if (other === boss || other.isDead) continue;
        const minD = (boss.size + other.size) * 0.8;
        const dx = other.x - boss.x;
        const dy = other.y - boss.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minD) {
          const push = (minD - d) * 0.25;
          const nx = dx / d;
          const ny = dy / d;
          boss.x -= nx * push * 0.5;
          boss.y -= ny * push * 0.5;
          other.x += nx * push * 0.5;
          other.y += ny * push * 0.5;
        }
      }
    }

    // 보스 업데이트
    this.bosses.forEach(b => b.update(dt, this.player));
    this.bosses = this.bosses.filter(b => {
      if (b.isDead && b.deathTimer > 600) {
        this.player.gainXP(b.data.xp);
        this.killCount++;
        this._dropBossLoot(b);
        // 발판 재활성화
        const pad = this.spawnPads.find(p => p.bossId === b.id);
        if (pad) { pad.isSummoned = false; pad.chargeTimer = 0; }
        // 최종보스 처치 = 클리어
        if (b.id === 'final_boss') this._triggerClear();
        return false;
      }
      return true;
    });

    // 투사체 업데이트 + 수명 만료 제거
    this.projectiles.forEach(p => p.update(dt));
    this.projectiles = this.projectiles.filter(p => !p.isDead);

    // 투사체 충돌
    this._checkProjectileCollisions();

    // 프로즌 오브 공전 파편 충돌
    this._checkOrbShardCollisions();

    // 에너지 실드 충돌
    this._checkShieldCollisions();

    // 플레이어-몬스터 충돌
    this._checkPlayerCollisions();

    // 발판 업데이트 & 보스 소환 체크
    this.spawnPads.forEach(pad => {
      pad.update(dt, this.player.x, this.player.y);
      if (pad.isCharged && !pad.isSummoned) {
        pad.isSummoned = true;
        pad.chargeTimer = 0;
        pad.isCharged = false;
        this._spawnBoss(pad.bossId, pad.x, pad.y);
      }
    });

    // 드롭 아이템 업데이트 & 습득
    this.droppedItems.forEach(item => item.update(dt));
    this.droppedItems = this.droppedItems.filter(item => {
      if (item.isPicked) return false;
      if (dist(this.player, item) < item.radius + this.player.radius - 4) {
        this._pickupItem(item.data);
        item.isPicked = true;
        return false;
      }
      return true;
    });

    // 게임오버 체크
    if (this.player.hp <= 0) this._triggerGameOver();
  }

  _spawnMonster() {
    const elapsed = this.gameTimer / 1000;
    const available = MONSTERS_DATA.filter(d => d.spawnFrom <= elapsed);
    if (!available.length) return;

    // 가중치 기반 랜덤 선택
    const totalWeight = available.reduce((s, d) => s + d.spawnWeight, 0);
    let rand = Math.random() * totalWeight;
    let chosen = available[0];
    for (const d of available) {
      rand -= d.spawnWeight;
      if (rand <= 0) { chosen = d; break; }
    }

    // 화면 가장자리에서 스폰
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 20;
    switch (edge) {
      case 0: x = randomRange(margin, GAME_W - margin); y = 80 + margin; break;
      case 1: x = GAME_W - margin; y = randomRange(80 + margin, GAME_H - margin); break;
      case 2: x = randomRange(margin, GAME_W - margin); y = GAME_H - margin; break;
      case 3: x = margin; y = randomRange(80 + margin, GAME_H - margin); break;
    }

    // 그룹 스폰 (슬라임)
    const count = chosen.behavior === 'group_charge' ? randomInt(2, 4) : 1;
    for (let i = 0; i < count; i++) {
      this.monsters.push(new Monster(chosen, x + randomRange(-20, 20), y + randomRange(-20, 20)));
    }
  }

  _spawnBoss(bossId, padX, padY) {
    const data = BOSSES_DATA[bossId];
    if (!data) return;
    const cx = clamp(padX, data.size + 10, GAME_W - data.size - 10);
    const cy = clamp(padY, 80 + data.size + 10, GAME_H - data.size - 10);

    // 플레이어 레벨에 따른 HP 스케일링
    // 기본 HP는 레벨 1 기준, 레벨당 8% 증가 (최대 3배)
    const level = this.player.level;
    const hpScale = Math.min(3.0, 1.0 + (level - 1) * 0.08);
    const scaledData = { ...data, hp: Math.floor(data.hp * hpScale) };

    this.bosses.push(new Boss(scaledData, cx, cy));
  }

  _spawnFinalBoss() {
    if (this.finalBossSpawned) return;
    this.finalBossSpawned = true;
    this.bosses.push(new Boss(BOSSES_DATA.final_boss, GAME_W / 2, GAME_H / 2 - 60));
  }

  _spawnTwitchEvent() {
    // 트위치 팝업 몬스터 (특수 ad_popup 변형)
    const twitchData = {
      ...MONSTERS_DATA.find(d => d.id === 'ad_popup'),
      id: 'twitch_popup',
      name: '트위치 서비스 종료',
      hp: 150,
      color: '#9147FF',
      lore: '트위치가 한국에서 철수합니다.',
    };
    this.monsters.push(new Monster(twitchData, GAME_W / 2, 100));

    // 처치 시 배경 전환은 _checkProjectileCollisions에서 처리
  }

  _checkProjectileCollisions() {
    const targets = [...this.monsters, ...this.bosses];
    this.projectiles.forEach(proj => {
      if (proj.isDead) return;
      targets.forEach(target => {
        if (target.isDead) return;
        if (proj.hitTargets.has(target)) return;
        if (dist(proj, target) < proj.size + target.size * 0.8) {
          target.takeDamage(proj.damage);
          this.skillSystem.hitEffects.push({
            x: target.x, y: target.y, r: 3, timer: 200, color: proj.color
          });
          // 라이트닝 퓨리 onHit
          if (proj.onHit) {
            proj.onHit(target);
            proj.isDead = true;
            return;
          }
          if (!proj.pierce) {
            proj.isDead = true;
          } else {
            proj.hitTargets.add(target);
          }
          // 트위치 팝업 처치 시 배경 전환
          if (target.isDead && target.id === 'twitch_popup') {
            this._triggerBgTransition();
          }
        }
      });
    });
    this.projectiles = this.projectiles.filter(p => !p.isDead);
  }

  _checkOrbShardCollisions() {
    // 프로즌 오브 공전 파편 충돌 처리
    const targets = [...this.monsters, ...this.bosses];
    this.projectiles.forEach(proj => {
      if (proj.skillId !== 'frozen_orb' || proj.isDead || proj._exploded) return;
      if (!proj._getOrbitPositions) return;
      const positions = proj._getOrbitPositions();
      positions.forEach(pos => {
        targets.forEach(target => {
          if (target.isDead) return;
          if (dist(pos, target) < 6 + target.size * 0.6) {
            target.takeDamage(proj.damage * 0.3);
            this.skillSystem.hitEffects.push({
              x: target.x, y: target.y, r: 3, timer: 150, color: '#87CEEB'
            });
          }
        });
      });
    });
  }

  _checkShieldCollisions() {
    if (!this.player.activeSkillQueue.includes('energy_shield')) return;
    const orbPositions = this.player.getShieldOrbPositions();
    const targets = [...this.monsters, ...this.bosses];
    const skillLevel = this.player.skillLevels['energy_shield'];
    const dmg = SKILLS_DATA.energy_shield.damage[Math.max(0, skillLevel - 1)];

    orbPositions.forEach(orb => {
      targets.forEach(target => {
        if (target.isDead) return;
        if (dist(orb, target) < 12 + target.size * 0.7) {
          // 넉백
          const dx = target.x - this.player.x;
          const dy = target.y - this.player.y;
          const d = Math.hypot(dx, dy) || 1;
          target.x += (dx / d) * 30;
          target.y += (dy / d) * 30;
          target.takeDamage(dmg * 0.1); // 지속 데미지 (낮게)
        }
      });
    });
  }

  _checkPlayerCollisions() {
    const targets = [...this.monsters, ...this.bosses];
    targets.forEach(target => {
      if (target.isDead) return;
      if (dist(this.player, target) < this.player.radius + target.size * 0.7) {
        this.player.takeDamage(target.damage * 0.016); // 프레임당 데미지
      }
    });
  }

  _pickupItem(itemData) {
    // 강제 장착 대신 플래시로 보여주고 플레이어가 선택
    // 같은 슬롯에 아무것도 없으면 자동 장착, 있으면 선택 대기
    const currentItem = this.player.equipment[itemData.slot];
    if (!currentItem) {
      // 빈 슬롯이면 자동 장착
      this.player.equipItem(itemData);
      this.ui.showItemFlash(itemData);
    } else {
      // 이미 장착 중이면 플래시로 보여주고 탭하면 교체
      this.ui.showItemFlash(itemData, true); // pendingEquip 모드
    }
  }

  _dropBossLoot(boss) {
    const table = boss.data.dropTable;
    if (!table || !table.length) return;

    // 2개 드롭
    const dropCount = 2;
    const shuffled = [...table].sort(() => Math.random() - 0.5);
    for (let i = 0; i < Math.min(dropCount, shuffled.length); i++) {
      const itemId = shuffled[i];
      // 모든 슬롯에서 아이템 찾기
      let itemData = null;
      for (const slot of Object.values(ITEMS_DATA)) {
        const found = slot.find(item => item.id === itemId);
        if (found) { itemData = found; break; }
      }
      if (itemData) {
        const angle = (Math.PI * 2 / dropCount) * i;
        const r = 40;
        this.droppedItems.push(new DroppedItem(
          itemData,
          boss.x + Math.cos(angle) * r,
          boss.y + Math.sin(angle) * r
        ));
      }
    }
  }

  _triggerBgTransition() {
    this.bgTransitionTimer = 3000;
    // 터키 해랑이 등장
    this.showTurkeyHarang = true;
    this.turkeyHarangTimer = 3500;
  }

  _triggerClear() {
    const elapsed = Math.floor(this.gameTimer / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    const eq = this.player.equipment;
    this.clearStats = {
      time: `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      kills: this.killCount,
      level: this.player.level,
      equipment: [eq.weapon, eq.head, eq.armor, eq.boots].filter(Boolean),
    };
    this.state = GameState.CLEAR;
  }

  _triggerGameOver() {
    const elapsed = Math.floor(this.gameTimer / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    this.clearStats = {
      time: `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      kills: this.killCount,
    };
    this.state = GameState.GAMEOVER;
  }

  draw() {
    ctx.clearRect(0, 0, GAME_W, GAME_H);

    switch (this.state) {
      case GameState.TITLE:
        this.ui.drawTitleScreen();
        break;
      case GameState.PLAYING:
      case GameState.PAUSED:
        this._drawWorld();
        this.ui.drawHUD();
        if (this.state === GameState.PAUSED) {
          this.ui.drawPauseScreen();
        }
        break;
      case GameState.CLEAR:
        this._drawWorld();
        this.ui.drawClearScreen(this.clearStats);
        break;
      case GameState.GAMEOVER:
        this._drawWorld();
        this.ui.drawGameOverScreen(this.clearStats);
        break;
    }
  }

  _drawWorld() {
    // 배경
    let bg = COLORS.bg;
    if (this.bgTransitionTimer > 0) {
      const t = this.bgTransitionTimer / 3000;
      if (t > 0.5) {
        // 트위치 보라
        bg = COLORS.bgTwitch;
      } else {
        // 치지직 초록으로 전환
        bg = COLORS.bgChzzk;
      }
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // 배경 격자 (픽셀 느낌)
    ctx.strokeStyle = 'rgba(200,185,170,0.25)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < GAME_W; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, 55); ctx.lineTo(x, GAME_H); ctx.stroke();
    }
    for (let y = 55; y < GAME_H; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_W, y); ctx.stroke();
    }

    // 배경 전환 텍스트
    if (this.bgTransitionTimer > 0) {
      const t = this.bgTransitionTimer / 3000;
      ctx.globalAlpha = Math.min(1, t > 0.7 ? (t - 0.7) / 0.3 : t < 0.2 ? t / 0.2 : 1) * 0.85;
      if (t > 0.5) {
        Draw.textOutline('트위치 서비스가 종료됩니다...', GAME_W / 2, GAME_H / 2 - 20, 12, '#FFFFFF', '#6441A4');
      } else {
        Draw.textOutline('치지직으로 이전합니다! 🌿', GAME_W / 2, GAME_H / 2 - 20, 12, '#2D8C3E', '#FFFFFF');
      }
      ctx.globalAlpha = 1;
    }

    // 터키 해랑이
    if (this.showTurkeyHarang) {
      const t = this.turkeyHarangTimer / 3500;
      const ty = GAME_H * 0.6;
      const tx = t > 0.5 ? GAME_W * 0.75 : GAME_W * 0.75 + (0.5 - t) / 0.5 * 60;
      ctx.globalAlpha = Math.min(1, t > 0.8 ? (t - 0.8) / 0.2 : t < 0.15 ? t / 0.15 : 1);
      Draw.harang(tx, ty, 18);
      // 말풍선
      if (t > 0.2 && t < 0.8) {
        ctx.fillStyle = COLORS.white;
        ctx.beginPath();
        ctx.roundRect(tx - 55, ty - 50, 110, 30, 8);
        ctx.fill();
        ctx.strokeStyle = COLORS.harangYellow;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(tx - 55, ty - 50, 110, 30, 8);
        ctx.stroke();
        ctx.font = '8px Courier New';
        ctx.fillStyle = COLORS.black;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('드디어 볼 수 있어요! 🌍', tx, ty - 35);
      }
      ctx.globalAlpha = 1;
    }

    // 발판 (배경 레이어)
    this.spawnPads.forEach(pad => pad.draw());

    // 드롭 아이템
    this.droppedItems.forEach(item => item.draw());

    // 스킬 이펙트 (하단)
    this.skillSystem.drawEffects();

    // 투사체
    this.projectiles.forEach(p => p.draw());

    // 몬스터
    this.monsters.forEach(m => m.draw());

    // 보스
    this.bosses.forEach(b => b.draw());

    // 히트 이펙트 (몬스터/보스 위에 표시)
    this.skillSystem.drawHitEffectsOnly();

    // 플레이어
    this.player.draw();

    // 조이스틱
    this.joystick.draw();
  }

  _loop() {
    let lastTime = 0;
    const tick = (timestamp) => {
      const dt = Math.min(timestamp - lastTime, 50); // 최대 50ms (탭 전환 등 대응)
      lastTime = timestamp;
      this.update(dt);
      this.draw();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

// ============================================================
// 🔧 터치 포지션 헬퍼
// ============================================================
function getTouchPos(touch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = GAME_W / rect.width;
  const scaleY = GAME_H / rect.height;
  return {
    x: (touch.clientX - rect.left) * scaleX,
    y: (touch.clientY - rect.top) * scaleY,
    identifier: touch.identifier,
  };
}

// ============================================================
// 🚀 게임 시작
// ============================================================
const game = new Game();
</script>
