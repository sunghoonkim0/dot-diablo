  canvas.height = GAME_H;
  canvas.style.width = GAME_W * scale + 'px';

// ============================================================
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}
function normalize(dx, dy) {
  const len = Math.hypot(dx, dy);
  if (len === 0) return { x: 0, y: 0 };
  return { x: dx / len, y: dy / len };
}
function randomRange(min, max) {
  return Math.random() * (max - min) + min;
}
function randomInt(min, max) {
  return Math.floor(randomRange(min, max + 1));
}
function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

const Draw = {
  pixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
  },
  pixelCircle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(Math.floor(x), Math.floor(y), r, 0, Math.PI * 2);
    ctx.fill();
  },
  pixelOutlineCircle(x, y, r, color, lineWidth = 2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.arc(Math.floor(x), Math.floor(y), r, 0, Math.PI * 2);
    ctx.stroke();
  },
  text(str, x, y, size, color, align = 'left', font = 'Courier New') {
    ctx.font = `bold ${size}px '${font}'`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  },
  textOutline(str, x, y, size, fillColor, strokeColor, align = 'center') {
    ctx.font = `bold ${size}px 'Courier New'`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fillColor;
    ctx.fillText(str, x, y);
  },

  // 요랑 픽셀 캐릭터 (24x24 기반)
  yorang(x, y, facingLeft, equippedHead) {
    const bx = Math.floor(x - 12);
    const by = Math.floor(y - 20);

    // 꼬리
    ctx.fillStyle = COLORS.yorangHair;
    ctx.beginPath();
    ctx.ellipse(bx + (facingLeft ? 20 : 4), by + 20, 7, 5, facingLeft ? 0.5 : -0.5, 0, Math.PI * 2);
    ctx.fill();

    // 몸통
    ctx.fillStyle = '#B8D4E8';
    Draw.pixelRect(bx + 4, by + 12, 16, 12, '#B8D4E8');

    // 팔
    ctx.fillStyle = COLORS.yorangSkin;
    Draw.pixelRect(bx + 1, by + 13, 4, 8, COLORS.yorangSkin);
    Draw.pixelRect(bx + 19, by + 13, 4, 8, COLORS.yorangSkin);

    // 다리
    Draw.pixelRect(bx + 5, by + 22, 5, 5, '#404060');
    Draw.pixelRect(bx + 14, by + 22, 5, 5, '#404060');

    // 얼굴
    Draw.pixelRect(bx + 4, by + 4, 16, 10, COLORS.yorangSkin);

    // 눈
    Draw.pixelCircle(bx + 8, by + 8, 2, COLORS.yorangEye);
    Draw.pixelCircle(bx + 16, by + 8, 2, COLORS.yorangEye);
    Draw.pixelCircle(bx + 8, by + 7, 1, COLORS.white);
    Draw.pixelCircle(bx + 16, by + 7, 1, COLORS.white);

    // 볼터치
    ctx.fillStyle = 'rgba(255,182,193,0.6)';
    Draw.pixelCircle(bx + 6, by + 10, 2, 'rgba(255,182,193,0.6)');
    Draw.pixelCircle(bx + 18, by + 10, 2, 'rgba(255,182,193,0.6)');

    // 머리카락
    ctx.fillStyle = COLORS.yorangHair;
    Draw.pixelRect(bx + 3, by + 2, 18, 6, COLORS.yorangHair);
    Draw.pixelRect(bx + 2, by + 6, 4, 6, COLORS.yorangHair);
    Draw.pixelRect(bx + 18, by + 6, 4, 6, COLORS.yorangHair);

    // 여우귀 (기본)
    this._drawFoxEars(bx, by);

    // 머리 장비 오버레이
    if (equippedHead) this._drawHeadEquip(bx, by, equippedHead);
  },

  _drawFoxEars(bx, by) {
    ctx.fillStyle = COLORS.yorangHair;
    // 왼쪽 귀
    ctx.beginPath();
    ctx.moveTo(bx + 4, by + 4);
    ctx.lineTo(bx + 1, by - 5);
    ctx.lineTo(bx + 9, by + 1);
    ctx.fill();
    // 오른쪽 귀
    ctx.beginPath();
    ctx.moveTo(bx + 20, by + 4);
    ctx.lineTo(bx + 23, by - 5);
    ctx.lineTo(bx + 15, by + 1);
    ctx.fill();
    // 귀 안쪽 흰털
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(bx + 5, by + 2);
    ctx.lineTo(bx + 3, by - 3);
    ctx.lineTo(bx + 9, by + 1);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + 19, by + 2);
    ctx.lineTo(bx + 21, by - 3);
    ctx.lineTo(bx + 15, by + 1);
    ctx.fill();
  },

  _drawHeadEquip(bx, by, headId) {
    switch (headId) {
      case 'babu_postit':
        ctx.fillStyle = '#FFE566';
        Draw.pixelRect(bx + 7, by + 3, 10, 8, '#FFE566');
        ctx.fillStyle = '#FF69B4';
        Draw.pixelRect(bx + 9, by + 5, 6, 1, '#FF69B4');
        Draw.pixelRect(bx + 9, by + 7, 4, 1, '#FF69B4');
        break;
      case 'harang_hat':
        ctx.fillStyle = COLORS.harangYellow;
        Draw.pixelCircle(bx + 12, by - 2, 8, COLORS.harangYellow);
        ctx.fillStyle = '#FF8C00';
        Draw.pixelRect(bx + 10, by + 2, 4, 3, '#FF8C00');
        break;
      case 'bunny_tiara':
        ctx.fillStyle = '#FFB6C1';
        Draw.pixelRect(bx + 5, by - 8, 3, 8, '#FFB6C1');
        Draw.pixelRect(bx + 16, by - 8, 3, 8, '#FFB6C1');
        ctx.fillStyle = '#FFD0DC';
        Draw.pixelRect(bx + 6, by - 7, 1, 6, '#FFD0DC');
        Draw.pixelRect(bx + 17, by - 7, 1, 6, '#FFD0DC');
        break;
      case 'cup_crown':
        ctx.fillStyle = '#DDA0DD';
        Draw.pixelRect(bx + 4, by - 4, 16, 5, '#DDA0DD');
        ctx.fillStyle = '#B87CC4';
        for (let i = 0; i < 3; i++) {
          Draw.pixelRect(bx + 5 + i * 5, by - 7, 3, 4, '#B87CC4');
        }
        ctx.fillStyle = '#87CEEB';
        Draw.pixelCircle(bx + 12, by - 3, 2, '#87CEEB');
        break;
      case 'yr_crown':
        ctx.fillStyle = '#FFD700';
        Draw.pixelRect(bx + 4, by - 4, 16, 5, '#FFD700');
        ctx.fillStyle = '#FFA500';
        for (let i = 0; i < 3; i++) {
          Draw.pixelRect(bx + 5 + i * 5, by - 8, 3, 5, '#FFA500');
        }
        ctx.fillStyle = '#FF4500';
        Draw.pixelCircle(bx + 7, by - 6, 1.5, '#FF4500');
        Draw.pixelCircle(bx + 12, by - 7, 1.5, '#FF4500');
        Draw.pixelCircle(bx + 17, by - 6, 1.5, '#FF4500');
        break;
    }
  },

  // 해랑이 픽셀 (12x12 기반)
  harang(x, y, size = 12) {
    const bx = Math.floor(x - size / 2);
    const by = Math.floor(y - size / 2);
    ctx.fillStyle = COLORS.harangYellow;
    Draw.pixelCircle(x, y + 1, size * 0.55, COLORS.harangYellow);
    ctx.fillStyle = '#FF8C00';
    Draw.pixelRect(bx + size * 0.35, by + size * 0.55, size * 0.3, size * 0.2, '#FF8C00');
    ctx.fillStyle = COLORS.black;
    Draw.pixelCircle(x - size * 0.2, y - size * 0.05, size * 0.12, COLORS.black);
    Draw.pixelCircle(x + size * 0.2, y - size * 0.05, size * 0.12, COLORS.black);
    // 볼
    ctx.fillStyle = 'rgba(255,182,193,0.5)';
    Draw.pixelCircle(x - size * 0.3, y + size * 0.1, size * 0.1, 'rgba(255,182,193,0.5)');
    Draw.pixelCircle(x + size * 0.3, y + size * 0.1, size * 0.1, 'rgba(255,182,193,0.5)');
  },

  // 버퍼링 유령
  bufferingGhost(x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#B0C4DE';
    Draw.pixelCircle(x, y - size * 0.2, size * 0.7, '#B0C4DE');
    Draw.pixelRect(x - size * 0.7, y - size * 0.2, size * 1.4, size * 0.8, '#B0C4DE');
    // 물결 하단
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = COLORS.bg;
      Draw.pixelCircle(x - size * 0.4 + i * size * 0.4, y + size * 0.5, size * 0.22, COLORS.bg);
    }
    ctx.fillStyle = COLORS.black;
    Draw.pixelCircle(x - size * 0.3, y - size * 0.15, size * 0.15, COLORS.black);
    Draw.pixelCircle(x + size * 0.3, y - size * 0.15, size * 0.15, COLORS.black);
    // 로딩 표시
    ctx.fillStyle = '#4169E1';
    ctx.font = `bold ${size * 0.6}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('...', x, y + size * 0.1);
    ctx.globalAlpha = 1;
  },

  // 악성댓글 슬라임
  badCommentSlime(x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#9370DB';
    Draw.pixelCircle(x, y, size * 0.65, '#9370DB');
    ctx.fillStyle = '#7B52AB';
    Draw.pixelCircle(x - size * 0.2, y + size * 0.3, size * 0.3, '#7B52AB');
    Draw.pixelCircle(x + size * 0.2, y + size * 0.3, size * 0.3, '#7B52AB');
    ctx.fillStyle = COLORS.white;
    ctx.font = `bold ${size * 0.45}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ㅋ', x, y);
    ctx.globalAlpha = 1;
  },

  // 광고팝업
  adPopup(x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FF6347';
    Draw.pixelRect(x - size, y - size * 0.7, size * 2, size * 1.4, '#FF6347');
    ctx.strokeStyle = '#CC3300';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - size, y - size * 0.7, size * 2, size * 1.4);
    ctx.fillStyle = COLORS.white;
    ctx.font = `bold ${size * 0.5}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('광고', x, y - size * 0.1);
    ctx.font = `${size * 0.35}px Courier New`;
    ctx.fillText('[닫기]', x, y + size * 0.4);
    ctx.globalAlpha = 1;
  },

  // 전신거울 보스
  mirrorBoss(x, y, size, hp, maxHp) {
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.ellipse(x, y + size * 0.9, size * 0.7, size * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // 거울 프레임
    ctx.fillStyle = '#C8B89A';
    Draw.pixelRect(x - size * 0.55, y - size * 1.1, size * 1.1, size * 2, '#C8B89A');

    // 거울 면 (반사 효과)
    const grad = ctx.createLinearGradient(x - size * 0.45, y - size, x + size * 0.45, y + size * 0.8);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.3, 'rgba(200,220,255,0.7)');
    grad.addColorStop(0.7, 'rgba(180,200,240,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0.6)');
    ctx.fillStyle = grad;
    Draw.pixelRect(x - size * 0.45, y - size * 0.95, size * 0.9, size * 1.7, '#E0E8FF');
    ctx.fillStyle = grad;
    Draw.pixelRect(x - size * 0.45, y - size * 0.95, size * 0.9, size * 1.7, grad);

    // 반사된 요랑 실루엣 (흐릿하게)
    ctx.globalAlpha = 0.3;
    Draw.pixelCircle(x, y - size * 0.3, size * 0.25, COLORS.yorangHair);
    Draw.pixelRect(x - size * 0.15, y - size * 0.15, size * 0.3, size * 0.4, '#B8D4E8');
    ctx.globalAlpha = 1;

    // 균열 효과
    ctx.strokeStyle = 'rgba(100,120,180,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.2, y - size * 0.5);
    ctx.lineTo(x + size * 0.1, y + size * 0.2);
    ctx.lineTo(x + size * 0.3, y - size * 0.1);
    ctx.stroke();

    // HP바
    const barW = size * 1.4;
    const barH = 6;
    const barX = x - barW / 2;
    const barY = y - size * 1.3;
    ctx.fillStyle = '#FF6B6B';
    Draw.pixelRect(barX, barY, barW, barH, '#FFB3B3');
    Draw.pixelRect(barX, barY, barW * (hp / maxHp), barH, '#FF4444');
    ctx.strokeStyle = COLORS.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);

    // 이름 태그
    Draw.textOutline('전신거울', x, barY - 8, 9, COLORS.white, COLORS.black);
  },

  // 임시 보스
  tempBoss(x, y, size, hp, maxHp, bossData) {
    ctx.fillStyle = bossData.color;
    Draw.pixelCircle(x, y, size * 0.8, bossData.color);
    Draw.pixelCircle(x, y, size * 0.5, bossData.color + 'AA');
    ctx.fillStyle = COLORS.white;
    ctx.font = `bold ${size * 0.5}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x, y);

    const barW = size * 1.8;
    const barH = 6;
    const barX = x - barW / 2;
    const barY = y - size * 1.2;
    Draw.pixelRect(barX, barY, barW, barH, '#FFB3B3');
    Draw.pixelRect(barX, barY, barW * (hp / maxHp), barH, '#FF4444');
    ctx.strokeStyle = COLORS.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    Draw.textOutline(bossData.name, x, barY - 8, 9, COLORS.white, COLORS.black);
  },
};

// ──────────────────────────────────────────────────────────
// Player
// ──────────────────────────────────────────────────────────
class Player {
  constructor() {
    this.x = GAME_W / 2;
    this.y = GAME_H / 2;
    this.radius = 12;
    this.maxHp = 100;
    this.hp = 100;
    this.baseSpeed = 120;
    this.speed = 120;
    this.level = 1;
    this.xp = 0;
    this.xpToNext = 20;
    this.skillPoints = 0;
    this.facingLeft = false;
    this.invincibleTimer = 0;
    this.controlReversed = false;
    this.controlReverseTimer = 0;
    this.dashCooldown = 0;
    this.isDashing = false;
    this.dashTimer = 0;
    this.dashVx = 0;
    this.dashVy = 0;

    // 장비
    this.equipment = {
      weapon: ITEMS_DATA.weapon[0], // 맨손
      head: ITEMS_DATA.head[0],     // 기본 여우귀
      armor: null,
      boots: null,
    };

    // 스킬 상태
    this.skillLevels = {};
    this.activeSkillQueue = [];
    Object.keys(SKILLS_DATA).forEach(id => { this.skillLevels[id] = 0; });
    this.skillCooldowns = {};
    Object.keys(SKILLS_DATA).forEach(id => { this.skillCooldowns[id] = 0; });

    // 에너지 실드 위성
    this.shieldOrbs = [];

    this.calcStats();
  }

  get maxActiveSkills() {
    if (!this.equipment.head) return 1;
    return this.equipment.head.skillSlots || 1;
  }

  get weaponType() {
    if (!this.equipment.weapon) return 'fists';
    return this.equipment.weapon.weaponType || 'fists';
  }

  calcStats() {
    this.speed = this.baseSpeed;
    if (this.equipment.armor && this.equipment.armor.stats.moveSpeed) {
      this.speed += this.equipment.armor.stats.moveSpeed;
    }
    if (this.equipment.boots && this.equipment.boots.stats.moveSpeed) {
      this.speed += this.equipment.boots.stats.moveSpeed;
    }
    this.speed = Math.max(60, this.speed);
  }

  equipItem(item) {
    this.equipment[item.slot] = item;
    // 무기 바뀌면 장비 조건 안맞는 스킬 비활성화
    if (item.slot === 'weapon') {
      this.activeSkillQueue = this.activeSkillQueue.filter(id => {
        const s = SKILLS_DATA[id];
        return !s.requiredWeapon || s.requiredWeapon === item.weaponType;
      });
    }
    this.calcStats();
  }

  toggleSkill(skillId) {
    const skill = SKILLS_DATA[skillId];
    if (!skill) return;
    if (this.skillLevels[skillId] === 0) return;
    if (skill.requiredWeapon && skill.requiredWeapon !== this.weaponType) return;

    const idx = this.activeSkillQueue.indexOf(skillId);
    if (idx !== -1) {
      this.activeSkillQueue.splice(idx, 1);
      return;
    }
    if (this.activeSkillQueue.length >= this.maxActiveSkills) {
      this.activeSkillQueue.shift(); // 가장 오래된 것 제거
    }
    this.activeSkillQueue.push(skillId);
  }

  upgradeSkill(skillId) {
    const skill = SKILLS_DATA[skillId];
    if (!skill) return false;
    if (this.skillPoints <= 0) return false;
    if (this.skillLevels[skillId] >= skill.maxLevel) return false;
    this.skillPoints--;
    this.skillLevels[skillId]++;
    return true;
  }

  gainXP(amount) {
    this.xp += amount;
    while (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      this.skillPoints++;
      this.xpToNext = Math.floor(this.xpToNext * 1.3);
      this.maxHp += 10;
      this.hp = Math.min(this.hp + 15, this.maxHp);
    }
  }

  takeDamage(amount) {
    if (this.invincibleTimer > 0) return;
    this.hp -= amount;
    this.invincibleTimer = 800;
    if (this.hp < 0) this.hp = 0;
  }

  update(dt, joystick) {
    // 무적 타이머
    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;

    // 조작 반전 타이머
    if (this.controlReverseTimer > 0) {
      this.controlReverseTimer -= dt;
      if (this.controlReverseTimer <= 0) this.controlReversed = false;
    }

    // 대시 타이머
    if (this.dashCooldown > 0) this.dashCooldown -= dt;
    if (this.isDashing) {
      this.dashTimer -= dt;
      if (this.dashTimer <= 0) this.isDashing = false;
    }

    // 이동
    if (!this.isDashing && joystick.active) {
      let dx = joystick.dx;
      let dy = joystick.dy;
      if (this.controlReversed) { dx = -dx; dy = -dy; }
      const speed = this.speed * (dt / 1000);
      this.x += dx * speed;
      this.y += dy * speed;
      if (dx < 0) this.facingLeft = true;
      else if (dx > 0) this.facingLeft = false;
    } else if (this.isDashing) {
      this.x += this.dashVx * 250 * (dt / 1000);
      this.y += this.dashVy * 250 * (dt / 1000);
    }

    // 화면 경계
    this.x = clamp(this.x, this.radius, GAME_W - this.radius);
    this.y = clamp(this.y, 80 + this.radius, GAME_H - this.radius);

    // 스킬 쿨다운
    Object.keys(this.skillCooldowns).forEach(id => {
      if (this.skillCooldowns[id] > 0) this.skillCooldowns[id] -= dt;
    });

    // 에너지 실드 위성 업데이트
    this._updateShieldOrbs(dt);
  }

  tryDash() {
    if (!this.equipment.boots || !this.equipment.boots.stats.hasDash) return;
    if (this.dashCooldown > 0) return;
    this.isDashing = true;
    this.dashTimer = 150;
    this.dashCooldown = 2000;
    const jDx = game.joystick.dx || 1;
    const jDy = game.joystick.dy || 0;
    const n = normalize(jDx, jDy);
    this.dashVx = n.x;
    this.dashVy = n.y;
  }

  _updateShieldOrbs(dt) {
    if (!this.activeSkillQueue.includes('energy_shield') || this.skillLevels['energy_shield'] === 0) {
      this.shieldOrbs = [];
      return;
    }
    const count = 2 + this.skillLevels['energy_shield'];
    while (this.shieldOrbs.length < count) this.shieldOrbs.push({ angle: Math.random() * Math.PI * 2, timer: 0 });
    if (this.shieldOrbs.length > count) this.shieldOrbs = this.shieldOrbs.slice(0, count);
    const orbitRadius = 45;
    const rotSpeed = 2.5 * (dt / 1000);
    this.shieldOrbs.forEach(orb => { orb.angle += rotSpeed; });
  }

  getShieldOrbPositions() {
    const count = this.shieldOrbs.length;
    return this.shieldOrbs.map((orb, i) => ({
      x: this.x + Math.cos(orb.angle + (i * Math.PI * 2 / count)) * 45,
      y: this.y + Math.sin(orb.angle + (i * Math.PI * 2 / count)) * 45,
    }));
  }

  draw() {
    // 에너지 실드 오브
    if (this.activeSkillQueue.includes('energy_shield') && this.skillLevels['energy_shield'] > 0) {
      this.getShieldOrbPositions().forEach(pos => {
        ctx.globalAlpha = 0.85;
        Draw.harang(pos.x, pos.y, 10);
        ctx.globalAlpha = 1;
        Draw.pixelOutlineCircle(pos.x, pos.y, 6, '#98FB98', 1.5);
      });
    }

    // 무적 깜빡임
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 80) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    Draw.yorang(this.x, this.y, this.facingLeft, this.equipment.head?.visualKey);
    ctx.globalAlpha = 1;

    // 조작 반전 표시
    if (this.controlReversed) {
      Draw.textOutline('⚠️반전', this.x, this.y - 35, 10, '#FF4444', COLORS.black);
    }

    // HP 바 (머리 위)
    const barW = 36;
    const barH = 4;
    const barX = this.x - barW / 2;
    const barY = this.y - 34;
    Draw.pixelRect(barX, barY, barW, barH, COLORS.hpBg);
    Draw.pixelRect(barX, barY, barW * (this.hp / this.maxHp), barH, COLORS.hpRed);
    ctx.strokeStyle = COLORS.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
  }
}

// ──────────────────────────────────────────────────────────
// Monster
// ──────────────────────────────────────────────────────────
class Monster {
  constructor(data, x, y) {
    this.data = data;
    this.id = data.id;
    this.x = x;
    this.y = y;
    this.hp = data.hp;
    this.maxHp = data.hp;
    this.speed = data.speed;
    this.damage = data.damage;
    this.size = data.size;
    this.color = data.color;
    this.behavior = data.behavior;
    this.alpha = 1;
    this.teleportTimer = randomRange(3000, 6000);
    this.behaviorTimer = 0;
    this.isDead = false;
    this.deathTimer = 0;
    this.groupTarget = null;
    this.flashTimer = 0;
  }

  takeDamage(amount) {
    this.hp -= amount;
    this.flashTimer = 120;
    if (this.hp <= 0) { this.hp = 0; this.isDead = true; }
  }

  update(dt, player) {
    if (this.isDead) {
      this.deathTimer += dt;
      this.alpha = Math.max(0, 1 - this.deathTimer / 400);
      return;
    }
    if (this.flashTimer > 0) this.flashTimer -= dt;

    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.hypot(dx, dy);

    switch (this.behavior) {
      case 'teleport':
        // 평소엔 천천히 접근
        if (d > 5) {
          this.x += (dx / d) * this.speed * 0.4 * (dt / 1000);
          this.y += (dy / d) * this.speed * 0.4 * (dt / 1000);
        }
        // 순간이동 (8초마다, 플레이어 근처로)
        this.behaviorTimer += dt;
        if (this.behaviorTimer > 8000) {
          this.behaviorTimer = 0;
          const angle = Math.random() * Math.PI * 2;
          const r = randomRange(60, 100);
          const nx = clamp(player.x + Math.cos(angle) * r, this.size + 5, GAME_W - this.size - 5);
          const ny = clamp(player.y + Math.sin(angle) * r, 90 + this.size, GAME_H - this.size - 5);
          this.x = nx;
          this.y = ny;
        }
        break;
      case 'group_charge':
        if (d > 5) {
          this.x += (dx / d) * this.speed * (dt / 1000);
          this.y += (dy / d) * this.speed * (dt / 1000);
        }
        break;
      case 'block_path':
        // 플레이어 앞을 막는 방식 - 플레이어에게 닿을 때까지 이동
        if (d > 5) {
          this.x += (dx / d) * this.speed * 0.7 * (dt / 1000);
          this.y += (dy / d) * this.speed * 0.7 * (dt / 1000);
        }
        break;
      default:
        if (d > 5) {
          this.x += (dx / d) * this.speed * (dt / 1000);
          this.y += (dy / d) * this.speed * (dt / 1000);
        }
    }

    // 경계 클램프
    this.x = clamp(this.x, this.size, GAME_W - this.size);
    this.y = clamp(this.y, 80 + this.size, GAME_H - this.size);
  }

  draw() {
    ctx.globalAlpha = this.alpha;
    const flash = this.flashTimer > 0 && Math.floor(this.flashTimer / 40) % 2 === 0;
    if (flash) ctx.globalAlpha = Math.min(1, this.alpha * 1.5);

    switch (this.id) {
      case 'buffering_ghost':
        Draw.bufferingGhost(this.x, this.y, this.size, this.alpha);
        break;
      case 'bad_comment_slime':
        Draw.badCommentSlime(this.x, this.y, this.size, this.alpha);
        break;
      case 'ad_popup':
        Draw.adPopup(this.x, this.y, this.size, this.alpha);
        break;
      default:
        ctx.fillStyle = this.color;
        Draw.pixelCircle(this.x, this.y, this.size, this.color);
        ctx.globalAlpha = 1;
        return;
    }
    ctx.globalAlpha = 1;

    // HP바 (소형)
    if (!this.isDead && this.hp < this.maxHp) {
      const bw = this.size * 2;
      const bx = this.x - bw / 2;
      const by = this.y - this.size - 5;
      Draw.pixelRect(bx, by, bw, 3, '#FFB3B3');
      Draw.pixelRect(bx, by, bw * (this.hp / this.maxHp), 3, '#FF4444');
    }
  }
}

// ──────────────────────────────────────────────────────────
// Boss
// ──────────────────────────────────────────────────────────
class Boss {
  constructor(bossData, x, y) {
    this.data = bossData;
    this.id = bossData.id;
    this.x = x;
    this.y = y;
    this.hp = bossData.hp;
    this.maxHp = bossData.hp;
    this.speed = bossData.speed;
    this.damage = bossData.damage;
    this.size = bossData.size;
    this.isDead = false;
    this.deathTimer = 0;
    this.alpha = 1;
    this.flashTimer = 0;
    this.behaviorTimer = 0;
    this.spawnTimer = 0;
    this.minions = [];
  }

  takeDamage(amount) {
    this.hp -= amount;
    this.flashTimer = 100;
    if (this.hp <= 0) { this.hp = 0; this.isDead = true; }
  }

  update(dt, player) {
    if (this.isDead) {
      this.deathTimer += dt;
      this.alpha = Math.max(0, 1 - this.deathTimer / 600);
      return;
    }
    if (this.flashTimer > 0) this.flashTimer -= dt;
    this.behaviorTimer += dt;

    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.hypot(dx, dy);

    // 기본 이동 (플레이어 추적) - 플레이어와 겹칠 때까지 이동
    if (d > 5) {
      this.x += (dx / d) * this.speed * (dt / 1000);
      this.y += (dy / d) * this.speed * (dt / 1000);
    }

    this.x = clamp(this.x, this.size, GAME_W - this.size);
    this.y = clamp(this.y, 80 + this.size, GAME_H - this.size);
  }

  draw() {
    if (this.flashTimer > 0 && Math.floor(this.flashTimer / 40) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    } else {
      ctx.globalAlpha = this.alpha;
    }

    if (this.id === 'mirror') {
      Draw.mirrorBoss(this.x, this.y, this.size, this.hp, this.maxHp);
    } else {
      Draw.tempBoss(this.x, this.y, this.size, this.hp, this.maxHp, this.data);
    }

    ctx.globalAlpha = 1;
  }
}

// ──────────────────────────────────────────────────────────
// Projectile
// ──────────────────────────────────────────────────────────
class Projectile {
  constructor(x, y, vx, vy, damage, skillId, color, size = 7, pierce = false) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.skillId = skillId;
    this.color = color;
    this.size = size;
    this.pierce = pierce;
    this.isDead = false;
    this.lifeTimer = 0;
    this.maxLife = 3000;
    this.hitTargets = new Set();
    this.age = 0;
  }

  update(dt) {
    this.x += this.vx * (dt / 1000);
    this.y += this.vy * (dt / 1000);
    this.lifeTimer += dt;
    this.age += dt;
    if (this.lifeTimer > this.maxLife) this.isDead = true;
    if (this.x < -20 || this.x > GAME_W + 20 || this.y < 0 || this.y > GAME_H + 20) this.isDead = true;
  }

  draw() {
    const pulse = 1 + Math.sin(this.age / 80) * 0.15;
    switch (this.skillId) {
      case 'frozen_orb': {
        // 메인 구체 (핑크 주사위)
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.age / 300);
        ctx.fillStyle = '#FF9ECD';
        ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.strokeStyle = '#FF69B4';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.fillStyle = COLORS.white;
        const dots = [[0,0],[-3,-3],[3,-3],[-3,3],[3,3]];
        dots.forEach(([dx,dy]) => { ctx.fillRect(dx-1, dy-1, 2, 2); });
        ctx.restore();

        // 공전 파편 그리기 (spawnAge로 등장 애니메이션)
        if (this._orbitShards && !this._exploded) {
          const positions = this._getOrbitPositions ? this._getOrbitPositions() : [];
          positions.forEach((pos, idx) => {
            const shard = this._orbitShards[idx];
            if (!shard) return;
            const spawnScale = shard.spawnAge || 0; // 0→1 등장 애니메이션
            if (spawnScale <= 0) return;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this._orbitAngle * 2);
            ctx.scale(spawnScale, spawnScale); // 등장 시 크기 증가
            const orbFade = Math.max(0, 1 - this.lifeTimer / this.maxLife * 0.5);
            ctx.globalAlpha = orbFade * spawnScale * 0.9;
            ctx.fillStyle = '#87CEEB';
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(3.5, 0);
            ctx.lineTo(0, 5);
            ctx.lineTo(-3.5, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.restore();
          });
        }
        break;
      }
      case 'lightning_fury': {
        // 번개 노란 검기
        ctx.save();
        ctx.translate(this.x, this.y);
        const angle = Math.atan2(this.vy, this.vx);
        ctx.rotate(angle);
        ctx.fillStyle = '#FFE566';
        ctx.fillRect(-this.size * 1.5, -this.size * 0.4, this.size * 3, this.size * 0.8);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(-this.size * 0.8, -this.size * 0.25, this.size * 1.6, this.size * 0.5);
        ctx.restore();
        break;
      }
      case 'chain_lightning': {
        // 음표 전기
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = COLORS.white;
        ctx.font = `bold ${this.size * 1.5}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♪', 0, 0);
        ctx.restore();
        break;
      }
      case 'nova_shard': {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#FFB347';
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'orb_shard': {
        // 얼음 파편 - 하늘색 다이아몬드
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 4);
        const fade = Math.max(0, this.lifeTimer / this.maxLife);
        ctx.globalAlpha = (1 - fade) * 0.9;
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 1.2);
        ctx.lineTo(this.size * 0.7, 0);
        ctx.lineTo(0, this.size * 1.2);
        ctx.lineTo(-this.size * 0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'fist': {
        // 전완근 펀치
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = COLORS.yorangSkin;
        ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.strokeStyle = '#C8884A';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.fillStyle = '#C8884A';
        ctx.font = `bold ${this.size}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💪', 0, 0);
        ctx.restore();
        break;
      }
      case 'basic_sword': {
        // 검 기본 공격 - 노란 검기
        ctx.save();
        ctx.translate(this.x, this.y);
        const sAngle = Math.atan2(this.vy, this.vx);
        ctx.rotate(sAngle);
        ctx.fillStyle = '#FFE566';
        ctx.fillRect(-this.size * 1.8, -this.size * 0.35, this.size * 3.6, this.size * 0.7);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(-this.size * 0.6, -this.size * 0.2, this.size * 1.2, this.size * 0.4);
        // 검 끝 빛
        ctx.fillStyle = '#FFFFFF';
        ctx.globalAlpha = 0.7;
        ctx.fillRect(this.size * 1.2, -this.size * 0.15, this.size * 0.6, this.size * 0.3);
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'basic_mic': {
        // 마이크 기본 공격 - 음파 원
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#87CEEB';
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'basic_brush': {
        // 브러시 기본 공격 - 물감탄
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#FF9ECD';
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
        ctx.fill();
        // 물감 번짐 효과
        ctx.fillStyle = '#FFB6C1';
        ctx.beginPath();
        ctx.arc(this.size * 0.3, -this.size * 0.3, this.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      default:
        ctx.fillStyle = this.color;
        Draw.pixelCircle(this.x, this.y, this.size * pulse, this.color);
    }
  }
}

// ──────────────────────────────────────────────────────────
// Skill (발동 로직)
// ──────────────────────────────────────────────────────────
class SkillSystem {
  constructor(player, projectiles, monsters, bosses) {
    this.player = player;
    this.projectiles = projectiles;
    this.monsters = monsters;
    this.bosses = bosses;
    this.novaEffects = [];
    this.chainEffects = [];
    this.hitEffects = [];
    this._basicCooldown = 0; // ✅ 생성자에서 명시적 초기화
  }

update(dt) {
    const p = this.player;

    // ✅ 기본 공격 쿨다운 (별도 관리)
    this._basicCooldown -= dt;
    if (this._basicCooldown <= 0) {
      const atkSpeed = p.equipment.weapon?.stats?.atkSpeed || 0;
      const baseCd = p.weaponType === 'fists' ? 600 : 800;
      this._basicCooldown = Math.max(200, baseCd - atkSpeed * 5);
      this._fireBasic();
    }

    // ✅ 스킬 발동 (Player의 skillCooldowns 사용)
    p.activeSkillQueue.forEach(skillId => {
      if (p.skillCooldowns[skillId] > 0) return;
      const level = p.skillLevels[skillId];
      if (level === 0) return;
      const skill = SKILLS_DATA[skillId];
      const cd = skill.cooldown[level - 1];
      p.skillCooldowns[skillId] = cd;
      this._fire(skillId, level, skill);
    });

    // 프로즌 오브 파편 스폰
    this.projectiles.forEach(proj => {
      if (proj.skillId === 'frozen_orb' && proj._spawnShards) {
        if (proj._orbTimer === undefined) proj._orbTimer = 0;
        proj._orbTimer += dt;
        if (proj._orbTimer >= 600) {
          proj._orbTimer = 0;
          proj._spawnShards();
        }
      }
    });

    // 이펙트 업데이트
    this.novaEffects = this.novaEffects.filter(e => {
      e.r += 300 * (dt / 1000);
      e.alpha -= dt / 400;
      return e.alpha > 0;
    });
    this.chainEffects = this.chainEffects.filter(e => {
      e.timer -= dt;
      return e.timer > 0;
    });
    this.hitEffects = this.hitEffects.filter(e => {
      e.timer -= dt;
      e.r += 60 * (dt / 1000);
      return e.timer > 0;
    });
  }

  _fire(skillId, level, skill) {
    const p = this.player;
    switch (skillId) {
      case 'frozen_orb': {
        // 디아블로2 스타일: 구체 주변을 공전하는 파편들이 함께 전진 + 사거리 끝 전방위 폭발
        const target = this._nearestTarget();
        const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facingLeft ? Math.PI : 0);
        const speed = 85;
        const dmg = skill.damage[level - 1];
        const proj = new Projectile(p.x, p.y, Math.cos(angle) * speed, Math.sin(angle) * speed,
          dmg, 'frozen_orb', '#FF9ECD', 11, true);
        proj.maxLife = 2400;
        proj._exploded = false;
        proj._orbitAngle = 0;         // 공전 각도
        proj._orbitSpeed = 4.5;       // 공전 속도 (rad/s)
        proj._orbitRadius = 18;       // 공전 반경
        proj._orbitShards = [];       // 현재 활성화된 공전 파편
        proj._shardCount = 4 + level; // 최대 공전 파편 수
        proj._shardSpawnTimer = 0;
        proj._shardSpawnInterval = 180; // 180ms마다 파편 1개씩 등장

        const origUpdate = proj.update.bind(proj);
        proj.update = function(dt) {
          origUpdate(dt);
          if (this.isDead) return;

          // 공전 각도 업데이트
          this._orbitAngle += this._orbitSpeed * (dt / 1000);

          // 시간에 따라 파편 하나씩 등장 (나선 효과)
          if (this._orbitShards.length < this._shardCount) {
            this._shardSpawnTimer += dt;
            if (this._shardSpawnTimer >= this._shardSpawnInterval) {
              this._shardSpawnTimer = 0;
              const idx = this._orbitShards.length;
              this._orbitShards.push({
                angleOffset: (Math.PI * 2 / this._shardCount) * idx,
                spawnAge: 0, // 등장 애니메이션용
              });
            }
          }

          // 파편 등장 애니메이션 업데이트
          this._orbitShards.forEach(s => { s.spawnAge = Math.min(1, (s.spawnAge || 0) + dt / 200); });

          // 수명 끝 전방위 폭발 (공전 파편 수와 동일)
          if (!this._exploded && this.lifeTimer >= this.maxLife - 60) {
            this._exploded = true;
            const shardCount = this._shardCount;
            for (let i = 0; i < shardCount; i++) {
              const a = (Math.PI * 2 / shardCount) * i;
              const sp = new Projectile(
                this.x, this.y,
                Math.cos(a) * 150, Math.sin(a) * 150,
                Math.floor(dmg * 0.6), 'orb_shard', '#87CEEB', 5
              );
              sp.maxLife = 700;
              game.projectiles.push(sp);
            }
          }
        };

        // 공전 파편 충돌 체크는 draw 대신 별도 처리
        proj._getOrbitPositions = function() {
          return this._orbitShards.map(s => ({
            x: this.x + Math.cos(this._orbitAngle + s.angleOffset) * this._orbitRadius,
            y: this.y + Math.sin(this._orbitAngle + s.angleOffset) * this._orbitRadius,
          }));
        };

        game.projectiles.push(proj);
        break;
      }
      case 'nova': {
        // 전방위 충격파
        this.novaEffects.push({ x: p.x, y: p.y, r: 10, maxR: 100 + level * 20, alpha: 0.8 });
        const targets = [...this.monsters, ...this.bosses].filter(t => !t.isDead);
        targets.forEach(t => {
          const d = dist(p, t);
          const novaR = 100 + level * 20;
          if (d < novaR) {
            t.takeDamage(skill.damage[level - 1]);
            this.hitEffects.push({ x: t.x, y: t.y, r: 4, timer: 250, color: '#FFB347' });
          }
        });
        break;
      }
      case 'lightning_fury': {
        // 계단식 증식 번개 (거리 제한 방식)
        // 레벨 1~3: 1단계, 4~6: 2단계, 7~10: 3단계
        // 분열 사거리: 레벨에 따라 증가 (80~160px)
        // 단계당 데미지 감쇠: 55%
        const maxStages = level <= 3 ? 1 : level <= 6 ? 2 : 3;
        const splitCount = 2 + Math.floor(level / 2); // 레벨1=2, 3=3, 5=4, 7=5, 9=6
        const baseDmg = skill.damage[level - 1];
        const decay = 0.55;
        // 분열 사거리: 레벨 1=80px, 10=160px
        const splitRange = 80 + level * 8;

        const fireLightning = (fromX, fromY, dmg, stage, excludeSet) => {
          // 사거리 내 적만 대상
          const available = [...game.monsters, ...game.bosses].filter(t => {
            if (t.isDead || excludeSet.has(t)) return false;
            return Math.hypot(t.x - fromX, t.y - fromY) <= splitRange;
          });
          if (!available.length) return;

          // 가장 가까운 적
          const nearest = available.reduce((a, b) =>
            Math.hypot(a.x - fromX, a.y - fromY) < Math.hypot(b.x - fromX, b.y - fromY) ? a : b
          );

          const angle = Math.atan2(nearest.y - fromY, nearest.x - fromX);
          const d = Math.hypot(nearest.x - fromX, nearest.y - fromY);
          // 속도: 사거리 내 거리에 비례해서 빠르게 (최소 200, 최대 400)
          const spd = clamp(d * 3, 200, 400);
          const proj = new Projectile(fromX, fromY, Math.cos(angle) * spd, Math.sin(angle) * spd,
            Math.floor(dmg), 'lightning_fury', '#FFE566', 7);
          // 사거리 초과 시 소멸 (maxLife를 거리 기반으로 설정)
          proj.maxLife = (d / spd) * 1000 * 1.15; // 약간 여유

          proj.onHit = (hitTarget) => {
            this.chainEffects.push({ x1: fromX, y1: fromY, x2: hitTarget.x, y2: hitTarget.y, timer: 280, color: '#FFE566' });
            this.hitEffects.push({ x: hitTarget.x, y: hitTarget.y, r: 5, timer: 300, color: '#FFE566' });

            if (stage < maxStages) {
              const nextExclude = new Set(excludeSet);
              nextExclude.add(hitTarget);
              const nextDmg = Math.floor(dmg * decay);
              // 분열: 사거리 내 가까운 순으로 splitCount마리
              const splitTargets = [...game.monsters, ...game.bosses]
                .filter(t => {
                  if (t.isDead || nextExclude.has(t)) return false;
                  return Math.hypot(t.x - hitTarget.x, t.y - hitTarget.y) <= splitRange;
                })
                .sort((a, b) => Math.hypot(a.x - hitTarget.x, a.y - hitTarget.y) - Math.hypot(b.x - hitTarget.x, b.y - hitTarget.y))
                .slice(0, splitCount);

              splitTargets.forEach(t => {
                nextExclude.add(t);
                setTimeout(() => fireLightning(hitTarget.x, hitTarget.y, nextDmg, stage + 1, new Set(nextExclude)), 50);
              });
            }
          };

          game.projectiles.push(proj);
        };

        const target = this._nearestTarget();
        if (target) {
          fireLightning(p.x, p.y, baseDmg, 1, new Set());
        }
        break;
      }
      case 'chain_lightning': {
        const target = this._nearestTarget();
        if (!target) break;
        target.takeDamage(skill.damage[level - 1]);
        this.hitEffects.push({ x: target.x, y: target.y, r: 6, timer: 300, color: '#87CEEB' });
        let prev = target;
        const jumped = new Set([target]);
        // 연쇄 횟수: 레벨1=2, 레벨5=4, 레벨10=7
        const chainCount = 1 + Math.floor(level * 0.65);
        for (let i = 0; i < chainCount; i++) {
          const next = this._nearestTargetFrom(prev, jumped);
          if (!next) break;
          jumped.add(next);
          next.takeDamage(Math.floor(skill.damage[level - 1] * (0.7 ** (i + 1))));
          this.chainEffects.push({ x1: prev.x, y1: prev.y, x2: next.x, y2: next.y, timer: 300, color: '#87CEEB' });
          this.hitEffects.push({ x: next.x, y: next.y, r: 4, timer: 200, color: '#87CEEB' });
          prev = next;
        }
        break;
      }
      case 'energy_shield':
        // 위성 방어는 Player.update에서 처리
        break;
    }
  }

  _fireBasic() {
    const p = this.player;
    let dmg = 8;
    if (p.equipment.weapon && p.equipment.weapon.stats) dmg += (p.equipment.weapon.stats.damage || 0);

    if (p.weaponType === 'fists') {
      // 전완근: 근접 범위 공격 (반경 55px) - game 객체에서 직접 참조
      const punchRadius = 55;
      const targets = [...game.monsters, ...game.bosses].filter(t => !t.isDead);
      targets.forEach(t => {
        if (dist(p, t) < punchRadius + t.size * 0.5) {
          t.takeDamage(dmg);
          this.hitEffects.push({ x: t.x, y: t.y, r: 5, timer: 250, color: COLORS.yorangSkin });
        }
      });
      // 펀치 이펙트 (방향 표시)
      const target = this._nearestTarget();
      const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facingLeft ? Math.PI : 0);
      this.hitEffects.push({
        x: p.x + Math.cos(angle) * 35,
        y: p.y + Math.sin(angle) * 35,
        r: 10, timer: 180, color: '#C8884A'
      });
    } else {
      // 무기 장착: 투사체 발사 (game.projectiles 직접 참조)
      const target = this._nearestTarget();
      const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facingLeft ? Math.PI : 0);
      let skillId = 'basic_shot';
      let color = COLORS.yorangSkin;
      if (p.weaponType === 'sword') { skillId = 'basic_sword'; color = '#FFE566'; }
      else if (p.weaponType === 'mic') { skillId = 'basic_mic'; color = '#87CEEB'; }
      else if (p.weaponType === 'brush') { skillId = 'basic_brush'; color = '#FF9ECD'; }
      const proj = new Projectile(p.x, p.y, Math.cos(angle) * 240, Math.sin(angle) * 240, dmg, skillId, color, 7);
      game.projectiles.push(proj); // ✅ game 직접 참조
    }
  }

  _nearestTarget() {
    const all = [...game.monsters, ...game.bosses].filter(t => !t.isDead);
    if (!all.length) return null;
    return all.reduce((a, b) => dist(this.player, a) < dist(this.player, b) ? a : b);
  }

  _nearestTargetFrom(from, exclude) {
    const all = [...game.monsters, ...game.bosses].filter(t => !t.isDead && !exclude.has(t));
    if (!all.length) return null;
    return all.reduce((a, b) => dist(from, a) < dist(from, b) ? a : b);
  }

  drawHitEffectsOnly() {
    this.hitEffects.forEach(e => {
      ctx.globalAlpha = Math.max(0, e.timer / 300);
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  drawEffects() {
    // 노바 이펙트
    this.novaEffects.forEach(e => {
      ctx.strokeStyle = `rgba(255,179,71,${e.alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,230,100,${e.alpha * 0.5})`;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    });

    // 체인 이펙트
    this.chainEffects.forEach(e => {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = e.timer / 300;
      ctx.beginPath();
      ctx.moveTo(e.x1, e.y1);
      // 지그재그 번개
      const mx = (e.x1 + e.x2) / 2 + randomRange(-10, 10);
      const my = (e.y1 + e.y2) / 2 + randomRange(-10, 10);
      ctx.quadraticCurveTo(mx, my, e.x2, e.y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // 히트 이펙트
    this.hitEffects.forEach(e => {
      ctx.globalAlpha = e.timer / 300;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }
}

// ──────────────────────────────────────────────────────────
// Item (드롭 아이템)
// ──────────────────────────────────────────────────────────
class DroppedItem {
  constructor(itemData, x, y) {
    this.data = itemData;
    this.x = x;
    this.y = y;
    this.radius = 14;
    this.bobTimer = Math.random() * Math.PI * 2;
    this.glowTimer = 0;
    this.isPicked = false;
  }

  update(dt) {
    this.bobTimer += dt / 600;
    this.glowTimer += dt;
  }

  draw() {
    const bobY = Math.sin(this.bobTimer) * 3;
    const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
    const glowColor = rarityColors[this.data.rarity] || '#FFFFFF';

    // 발광 효과
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 8 + Math.sin(this.glowTimer / 300) * 4;

    // 아이템 배경
    ctx.fillStyle = glowColor;
    Draw.pixelCircle(this.x, this.y + bobY, this.radius, glowColor);
    ctx.fillStyle = COLORS.white;
    Draw.pixelCircle(this.x, this.y + bobY, this.radius - 3, COLORS.white);

    ctx.shadowBlur = 0;

    // 아이템 아이콘
    ctx.font = `${this.radius}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.data.icon, this.x, this.y + bobY);

    // 등급 테두리
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y + bobY, this.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ──────────────────────────────────────────────────────────
// SpawnPad (보스 소환 발판)
// ──────────────────────────────────────────────────────────
class SpawnPad {
  constructor(data) {
    this.data = data;
    this.x = data.x;
    this.y = data.y;
    this.bossId = data.bossId;
    this.chargeTimer = 0;
    this.chargeRequired = 2000;
    this.isCharged = false;
    this.isActive = true;
    this.pulseTimer = 0;
    this.radius = 22;
    this.isSummoned = false;
  }

  update(dt, playerX, playerY) {
    if (this.isSummoned || !this.isActive) return;
    this.pulseTimer += dt;
    const d = Math.hypot(playerX - this.x, playerY - this.y);
    if (d < this.radius) {
      this.chargeTimer += dt;
      if (this.chargeTimer >= this.chargeRequired) {
        this.isCharged = true;
      }
    } else {
      this.chargeTimer = Math.max(0, this.chargeTimer - dt * 1.5);
      this.isCharged = false;
    }
  }

  draw() {
    if (this.isSummoned) return;
    const pulse = 1 + Math.sin(this.pulseTimer / 400) * 0.1;
    const progress = this.chargeTimer / this.chargeRequired;

    // 발판 바닥
    ctx.fillStyle = this.data.color + '55';
    Draw.pixelCircle(this.x, this.y, this.radius * pulse, this.data.color + '55');
    ctx.strokeStyle = this.data.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
    ctx.stroke();

    // 게이지 (충전 중)
    if (progress > 0) {
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
      ctx.stroke();
    }

    // 보스 라벨
    ctx.font = `bold 14px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.data.color;
    ctx.fillText(this.data.label, this.x, this.y);

    // 방향 힌트
    ctx.font = `9px Courier New`;
    ctx.fillStyle = COLORS.black;
    ctx.fillText(this.data.id === 'north' ? '↑' : this.data.id === 'south' ? '↓' : this.data.id === 'east' ? '→' : '←',
      this.x, this.y + this.radius + 8);
  }
}

// ──────────────────────────────────────────────────────────
// UI
// ──────────────────────────────────────────────────────────
class UISystem {
  constructor(game) {
    this.game = game;
    this.itemFlashData = null;
    this.itemFlashTimer = 0;
    this.itemFlashDuration = 5000;
    this.pauseViewingItem = null;
  }

  showItemFlash(itemData, pendingEquip = false) {
    // 같은 아이템이 이미 표시 중이면 갱신하지 않음 (깜빡임 방지)
    if (this.itemFlashData && this.itemFlashData.id === itemData.id && this.itemFlashTimer > 500) return;
    this.itemFlashData = itemData;
    this.itemFlashTimer = this.itemFlashDuration;
    this._pendingEquip = pendingEquip;
  }

  update(dt) {
    if (this.itemFlashTimer > 0) this.itemFlashTimer -= dt;
  }

  drawHUD() {
    const g = this.game;
    const p = g.player;

    // EXP 바 (최상단)
    const expProgress = p.xp / p.xpToNext;
    Draw.pixelRect(0, 0, GAME_W, 5, COLORS.expBarBg);
    Draw.pixelRect(0, 0, GAME_W * expProgress, 5, COLORS.expBar);

    // 스킬바 배경
    ctx.fillStyle = 'rgba(255,245,228,0.92)';
    ctx.fillRect(0, 5, GAME_W - 40, 50);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 5, GAME_W - 40, 50);

    // 스킬 아이콘
    const skillIds = Object.keys(SKILLS_DATA);
    const iconW = (GAME_W - 40) / skillIds.length;
    skillIds.forEach((id, i) => {
      const skill = SKILLS_DATA[id];
      const level = p.skillLevels[id];
      const isActive = p.activeSkillQueue.includes(id);
      const isLocked = level === 0;
      const cdPercent = p.skillCooldowns[id] > 0 && level > 0 ?
        p.skillCooldowns[id] / skill.cooldown[Math.max(0, level - 1)] : 0;
      const weaponOk = !skill.requiredWeapon || skill.requiredWeapon === p.weaponType;

      const sx = i * iconW + 2;
      const sy = 7;
      const sw = iconW - 4;
      const sh = 46;

      // 배경
      let bgColor = isLocked ? '#D8D0C8' : (isActive ? '#FFF0A0' : '#F5EDE0');
      if (!weaponOk && !isLocked) bgColor = '#E0D5C8';
      ctx.fillStyle = bgColor;
      ctx.fillRect(sx, sy, sw, sh);

      if (isActive) {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, sy, sw, sh);
      }

      // 아이콘
      ctx.globalAlpha = isLocked || (!weaponOk && !isLocked) ? 0.4 : 1;
      ctx.font = '18px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(skill.icon, sx + sw / 2, sy + 14);
      ctx.globalAlpha = 1;

      // 레벨 표시
      if (level > 0) {
        ctx.fillStyle = '#8B5E3C';
        ctx.font = 'bold 8px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`Lv.${level}`, sx + sw / 2, sy + 27);
      } else {
        ctx.fillStyle = '#A09080';
        ctx.font = '7px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('LOCKED', sx + sw / 2, sy + 27);
      }

      // 쿨다운 오버레이
      if (cdPercent > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(sx, sy + sh * (1 - cdPercent), sw, sh * cdPercent);
      }

      // 장비 불일치
      if (!weaponOk && !isLocked) {
        ctx.fillStyle = 'rgba(80,80,80,0.5)';
        ctx.fillRect(sx, sy, sw, sh);
        ctx.font = '9px Courier New';
        ctx.fillStyle = '#FF6B6B';
        ctx.textAlign = 'center';
        ctx.fillText('⚔️필요', sx + sw / 2, sy + sh / 2);
      }

      // + 버튼 (포인트 있고 레벨업 가능할 때)
      if (p.skillPoints > 0 && level < skill.maxLevel && weaponOk) {
        ctx.fillStyle = '#7BC47F';
        ctx.fillRect(sx + sw - 12, sy + sh - 12, 11, 11);
        ctx.fillStyle = COLORS.white;
        ctx.font = 'bold 9px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', sx + sw - 6.5, sy + sh - 6.5);
      }
    });

    // 일시정지 버튼
    ctx.fillStyle = COLORS.uiBg;
    ctx.fillRect(GAME_W - 38, 5, 36, 50);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(GAME_W - 38, 5, 36, 50);
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸', GAME_W - 20, 30);

    // 스킬 포인트 뱃지
    if (p.skillPoints > 0) {
      ctx.fillStyle = '#FF6B6B';
      Draw.pixelCircle(GAME_W - 42, 8, 9, '#FF6B6B');
      ctx.fillStyle = COLORS.white;
      ctx.font = 'bold 9px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.skillPoints, GAME_W - 42, 8);
    }

    // 타이머
    const elapsed = Math.floor(g.gameTimer / 1000);
    const minutes = Math.floor(elapsed / 60);
    const seconds = elapsed % 60;
    const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    ctx.fillStyle = COLORS.uiBg;
    ctx.fillRect(GAME_W / 2 - 28, 57, 56, 18);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(GAME_W / 2 - 28, 57, 56, 18);
    Draw.textOutline(timeStr, GAME_W / 2, 66, 10, COLORS.black, COLORS.uiBg);

    // 킬 카운트
    ctx.fillStyle = 'rgba(255,245,228,0.85)';
    ctx.fillRect(5, 57, 55, 18);
    Draw.text(`💀 ${g.killCount}`, 10, 66, 9, COLORS.black);

    // 아이템 플래시
    if (this.itemFlashTimer > 0 && this.itemFlashData) {
      this._drawItemFlash();
    }
  }

  _drawItemFlash() {
    const d = this.itemFlashData;
    const progress = this.itemFlashTimer / this.itemFlashDuration;
    // progress: 1→0 (타이머 감소)
    // 등장: progress 0.85~1.0 → 아래서 올라옴
    // 유지: progress 0.15~0.85
    // 퇴장: progress 0~0.15 → 아래로 내려감
    const slideOffset = progress > 0.85 ? (1 - (progress - 0.85) / 0.15) * 80 :
                        progress < 0.15 ? (progress / 0.15) * 80 : 0;
    const slideY = GAME_H - 90 + slideOffset;
    ctx.globalAlpha = Math.min(1, progress > 0.85 ? (1 - (progress - 0.85) / 0.15) : progress < 0.15 ? progress / 0.15 : 1);

    const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
    const cardColor = rarityColors[d.rarity] || '#FFFFFF';

    ctx.fillStyle = 'rgba(255,245,228,0.96)';
    ctx.beginPath();
    ctx.roundRect(20, slideY, GAME_W - 40, 75, 10);
    ctx.fill();
    ctx.strokeStyle = cardColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(20, slideY, GAME_W - 40, 75, 10);
    ctx.stroke();

    // 아이콘
    ctx.font = '28px serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.icon, 32, slideY + 27);

    // 이름 + 등급
    const rarityLabel = { common: '일반', rare: '레어', epic: '에픽', legendary: '전설' };
    ctx.font = 'bold 13px Courier New';
    ctx.fillStyle = COLORS.black;
    ctx.textAlign = 'left';
    ctx.fillText(d.name, 68, slideY + 16);
    ctx.font = '9px Courier New';
    ctx.fillStyle = cardColor;
    ctx.fillText(`[${rarityLabel[d.rarity] || ''}] ${d.slot.toUpperCase()}`, 68, slideY + 30);

    // 밈 텍스트 미리보기
    const lorePreview = d.lore.split('\n')[0];
    ctx.font = '9px Courier New';
    ctx.fillStyle = '#8B5E3C';
    ctx.fillText(lorePreview, 68, slideY + 44);

    // 카운트다운 원형 게이지 (카드 우상단)
    const countdownR = 10;
    const countdownX = GAME_W - 38;
    const countdownY = slideY + 14;
    const countdownProgress = this.itemFlashTimer / this.itemFlashDuration;
    // 배경 원
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(countdownX, countdownY, countdownR, 0, Math.PI * 2);
    ctx.stroke();
    // 남은 시간 게이지
    const gaugeColor = countdownProgress < 0.3 ? '#FF6B6B' : '#C8884A';
    ctx.strokeStyle = gaugeColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(countdownX, countdownY, countdownR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * countdownProgress);
    ctx.stroke();
    // 남은 초 숫자
    const secsLeft = Math.ceil(this.itemFlashTimer / 1000);
    ctx.font = 'bold 9px Courier New';
    ctx.fillStyle = gaugeColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(secsLeft, countdownX, countdownY);

    // 탭 안내 (pendingEquip 모드면 교체 안내)
    ctx.font = '8px Courier New';
    ctx.textAlign = 'right';
    if (this._pendingEquip) {
      ctx.fillStyle = '#FF6B6B';
      ctx.fillText('👆 탭하면 교체 장착 / 무시하면 사라짐', GAME_W - 55, slideY + 65);
    } else {
      ctx.fillStyle = '#A09080';
      ctx.fillText('⏸ 탭하면 전체 보기', GAME_W - 55, slideY + 65);
    }

    ctx.globalAlpha = 1;
  }

  drawPauseScreen() {
    const p = this.game.player;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    if (this.pauseViewingItem) {
      this._drawItemDetail(this.pauseViewingItem);
      return;
    }

    // 일시정지 패널
    ctx.fillStyle = COLORS.uiBg;
    ctx.beginPath();
    ctx.roundRect(20, 80, GAME_W - 40, GAME_H - 160, 14);
    ctx.fill();
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(20, 80, GAME_W - 40, GAME_H - 160, 14);
    ctx.stroke();

    Draw.textOutline('⏸ PAUSE', GAME_W / 2, 110, 18, COLORS.black, COLORS.uiBg);

    // 장착 장비 목록
    Draw.text('[ 장착 장비 ]', 35, 140, 11, '#8B5E3C');
    const slots = ['weapon', 'head', 'armor', 'boots'];
    const slotNames = { weapon: '무기', head: '머리', armor: '갑옷', boots: '신발' };
    slots.forEach((slot, i) => {
      const item = p.equipment[slot];
      const y = 158 + i * 44;
      ctx.fillStyle = '#F5EDE0';
      ctx.beginPath();
      ctx.roundRect(30, y, GAME_W - 60, 38, 8);
      ctx.fill();
      ctx.strokeStyle = COLORS.uiBorder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(30, y, GAME_W - 60, 38, 8);
      ctx.stroke();

      if (item) {
        ctx.font = '20px serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.icon, 40, y + 19);
        ctx.font = 'bold 11px Courier New';
        ctx.fillStyle = COLORS.black;
        ctx.fillText(item.name, 68, y + 11);
        ctx.font = '9px Courier New';
        ctx.fillStyle = '#8B5E3C';
        ctx.fillText(item.lore.split('\n')[0], 68, y + 27);
        ctx.font = '9px Courier New';
        ctx.fillStyle = '#A09080';
        ctx.textAlign = 'right';
        ctx.fillText('탭 → 상세', GAME_W - 38, y + 27);
      } else {
        ctx.font = '11px Courier New';
        ctx.fillStyle = '#A09080';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${slotNames[slot]} 비어있음`, GAME_W / 2, y + 19);
      }
    });

    // 계속하기 버튼
    const btnY = GAME_H - 120;
    ctx.fillStyle = '#7BC47F';
    ctx.beginPath();
    ctx.roundRect(GAME_W / 2 - 70, btnY, 140, 38, 10);
    ctx.fill();
    Draw.textOutline('▶ 계속하기', GAME_W / 2, btnY + 19, 14, COLORS.white, '#4A8A4E');
  }

  _drawItemDetail(item) {
    ctx.fillStyle = COLORS.uiBg;
    ctx.beginPath();
    ctx.roundRect(20, 60, GAME_W - 40, GAME_H - 120, 14);
    ctx.fill();
    const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
    ctx.strokeStyle = rarityColors[item.rarity] || COLORS.uiBorder;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(20, 60, GAME_W - 40, GAME_H - 120, 14);
    ctx.stroke();

    ctx.font = '40px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.icon, GAME_W / 2, 120);

    Draw.textOutline(item.name, GAME_W / 2, 160, 16, COLORS.black, COLORS.uiBg);

    const rarityLabel = { common: '일반', rare: '레어', epic: '에픽', legendary: '전설' };
    ctx.font = '10px Courier New';
    ctx.fillStyle = rarityColors[item.rarity];
    ctx.textAlign = 'center';
    ctx.fillText(`★ ${rarityLabel[item.rarity] || ''} ★`, GAME_W / 2, 180);

    // 밈 텍스트 전체
    const lines = item.lore.split('\n');
    ctx.font = '12px Courier New';
    ctx.fillStyle = '#5A3E2B';
    ctx.textAlign = 'center';
    lines.forEach((line, i) => {
      ctx.fillText(line, GAME_W / 2, 210 + i * 22);
    });

    // 스탯
    if (item.stats) {
      let sy = 210 + lines.length * 22 + 20;
      ctx.fillStyle = '#C8884A';
      ctx.font = 'bold 10px Courier New';

  drawGameOverScreen(stats) {

    Draw.harang(GAME_W / 2 - 55, GAME_H * 0.52, 14);
