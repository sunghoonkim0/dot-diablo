// ──────────────────────────────────────────────────────────
// Player
// ──────────────────────────────────────────────────────────
class Player {
  constructor() {
    this.x = GAME_W / 2;
    this.y = GAME_H / 2;
    this.radius = 14;           // 24→48px 기준으로 조정
    this.maxHp = 100;
    this.hp = 100;
    this.baseSpeed = 120;
    this.speed = 120;
    this.level = 1;
    this.xp = 0;
    this.xpToNext = 20;
    this.skillPoints = 0;
    this.facingLeft = false;
    this.invincibleTimer = 0;
    this.hitFlashTimer = 0;     // 피격 흰색 플래시
    this.controlReversed = false;
    this.controlReverseTimer = 0;
    this.dashCooldown = 0;
    this.isDashing = false;
    this.dashTimer = 0;
    this.dashVx = 0;
    this.dashVy = 0;
    this.walkFrame = 0;         // 걷기 애니메이션 프레임
    this.wingFrame = 0;         // 해랑이 날개 프레임

    // 장비
    this.equipment = {
      weapon: ITEMS_DATA.weapon[0],
      head: ITEMS_DATA.head[0],
      armor: null,
      boots: null,
    };

    // 스킬 상태
    this.skillLevels = {};
    this.activeSkillQueue = [];
    Object.keys(SKILLS_DATA).forEach(id => { this.skillLevels[id] = 0; });
    this.skillCooldowns = {};
    Object.keys(SKILLS_DATA).forEach(id => { this.skillCooldowns[id] = 0; });

    // 에너지 실드 위성
    this.shieldOrbs = [];

    this.calcStats();
  }

  get maxActiveSkills() {
    if (!this.equipment.head) return 1;
    return this.equipment.head.skillSlots || 1;
  }

  get weaponType() {
    if (!this.equipment.weapon) return 'fists';
    return this.equipment.weapon.weaponType || 'fists';
  }

  calcStats() {
    this.speed = this.baseSpeed;
    if (this.equipment.armor && this.equipment.armor.stats.moveSpeed) {
      this.speed += this.equipment.armor.stats.moveSpeed;
    }
    if (this.equipment.boots && this.equipment.boots.stats.moveSpeed) {
      this.speed += this.equipment.boots.stats.moveSpeed;
    }
    this.speed = Math.max(60, this.speed);
  }

  equipItem(item) {
    this.equipment[item.slot] = item;
    if (item.slot === 'weapon') {
      this.activeSkillQueue = this.activeSkillQueue.filter(id => {
        const s = SKILLS_DATA[id];
        return !s.requiredWeapon || s.requiredWeapon === item.weaponType;
      });
    }
    this.calcStats();
  }

  toggleSkill(skillId) {
    const skill = SKILLS_DATA[skillId];
    if (!skill) return;
    if (this.skillLevels[skillId] === 0) return;
    if (skill.requiredWeapon && skill.requiredWeapon !== this.weaponType) return;

    const idx = this.activeSkillQueue.indexOf(skillId);
    if (idx !== -1) {
      this.activeSkillQueue.splice(idx, 1);
      return;
    }
    if (this.activeSkillQueue.length >= this.maxActiveSkills) {
      this.activeSkillQueue.shift();
    }
    this.activeSkillQueue.push(skillId);
  }

  upgradeSkill(skillId) {
    const skill = SKILLS_DATA[skillId];
    if (!skill) return false;
    if (this.skillPoints <= 0) return false;
    if (this.skillLevels[skillId] >= skill.maxLevel) return false;
    this.skillPoints--;
    this.skillLevels[skillId]++;
    return true;
  }

  gainXP(amount) {
    const prevLevel = this.level;
    this.xp += amount;
    while (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      this.skillPoints++;
      this.xpToNext = Math.floor(this.xpToNext * 1.3);
      this.maxHp += 10;
      this.hp = Math.min(this.hp + 15, this.maxHp);
    }
    return this.level > prevLevel; // 레벨업 여부 반환
  }

  takeDamage(amount) {
    if (this.invincibleTimer > 0) return;
    this.hp -= amount;
    this.invincibleTimer = 800;
    this.hitFlashTimer = 120;
    if (this.hp < 0) this.hp = 0;
    SFX.playerHit();
  }

  update(dt, joystick) {
    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
    if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;

    if (this.controlReverseTimer > 0) {
      this.controlReverseTimer -= dt;
      if (this.controlReverseTimer <= 0) this.controlReversed = false;
    }

    if (this.dashCooldown > 0) this.dashCooldown -= dt;
    if (this.isDashing) {
      this.dashTimer -= dt;
      if (this.dashTimer <= 0) this.isDashing = false;
    }

    // 이동
    let isMoving = false;
    if (!this.isDashing && joystick.active) {
      let dx = joystick.dx;
      let dy = joystick.dy;
      if (this.controlReversed) { dx = -dx; dy = -dy; }
      const speed = this.speed * (dt / 1000);
      this.x += dx * speed;
      this.y += dy * speed;
      if (dx < 0) this.facingLeft = true;
      else if (dx > 0) this.facingLeft = false;
      isMoving = true;
    } else if (this.isDashing) {
      this.x += this.dashVx * 250 * (dt / 1000);
      this.y += this.dashVy * 250 * (dt / 1000);
      isMoving = true;
    }

    // 걷기 프레임
    if (isMoving) this.walkFrame += dt * 0.1;
    else this.walkFrame = 0;

    // 해랑이 날개 프레임
    this.wingFrame += dt * 0.08;

    this.x = clamp(this.x, this.radius, GAME_W - this.radius);
    this.y = clamp(this.y, 80 + this.radius, GAME_H - this.radius);

    Object.keys(this.skillCooldowns).forEach(id => {
      if (this.skillCooldowns[id] > 0) this.skillCooldowns[id] -= dt;
    });

    this._updateShieldOrbs(dt);
  }

  tryDash() {
    if (!this.equipment.boots || !this.equipment.boots.stats.hasDash) return;
    if (this.dashCooldown > 0) return;
    this.isDashing = true;
    this.dashTimer = 150;
    this.dashCooldown = 2000;
    const jDx = game.joystick.dx || 1;
    const jDy = game.joystick.dy || 0;
    const n = normalize(jDx, jDy);
    this.dashVx = n.x;
    this.dashVy = n.y;
  }

  _updateShieldOrbs(dt) {
    if (!this.activeSkillQueue.includes('energy_shield') || this.skillLevels['energy_shield'] === 0) {
      this.shieldOrbs = [];
      return;
    }
    const count = 2 + this.skillLevels['energy_shield'];
    while (this.shieldOrbs.length < count) this.shieldOrbs.push({ angle: Math.random() * Math.PI * 2, timer: 0 });
    if (this.shieldOrbs.length > count) this.shieldOrbs = this.shieldOrbs.slice(0, count);
    const orbitRadius = 45;
    const rotSpeed = 2.5 * (dt / 1000);
    this.shieldOrbs.forEach(orb => { orb.angle += rotSpeed; });
  }

  getShieldOrbPositions() {
    const count = this.shieldOrbs.length;
    return this.shieldOrbs.map((orb, i) => ({
      x: this.x + Math.cos(orb.angle + (i * Math.PI * 2 / count)) * 45,
      y: this.y + Math.sin(orb.angle + (i * Math.PI * 2 / count)) * 45,
    }));
  }

  draw() {
    // 에너지 실드 오브 (해랑이 위성)
    if (this.activeSkillQueue.includes('energy_shield') && this.skillLevels['energy_shield'] > 0) {
      this.getShieldOrbPositions().forEach(pos => {
        ctx.globalAlpha = 0.9;
        Draw.harang(pos.x, pos.y, 12, this.wingFrame);
        ctx.globalAlpha = 1;
        Draw.pixelOutlineCircle(pos.x, pos.y, 8, '#98FB98', 1.5);
      });
    }

    // 대시 잔상
    if (this.isDashing) {
      ctx.globalAlpha = 0.25;
      Draw.yorang(this.x - this.dashVx * 12, this.y - this.dashVy * 12, this.facingLeft, this.equipment.head?.visualKey);
      ctx.globalAlpha = 0.12;
      Draw.yorang(this.x - this.dashVx * 24, this.y - this.dashVy * 24, this.facingLeft, this.equipment.head?.visualKey);
      ctx.globalAlpha = 1;
    }

    // 무적 깜빡임
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 80) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    // 피격 흰색 플래시
    const isHitFlash = this.hitFlashTimer > 0 && Math.floor(this.hitFlashTimer / 30) % 2 === 0;
    if (isHitFlash) {
      ctx.globalAlpha = 1;
      // 흰색 실루엣 효과
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      Draw.yorang(this.x, this.y, this.facingLeft, this.equipment.head?.visualKey, this.walkFrame);
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillRect(this.x - 24, this.y - 40, 48, 56);
      ctx.restore();
    } else {
      Draw.yorang(this.x, this.y, this.facingLeft, this.equipment.head?.visualKey, this.walkFrame);
    }
    ctx.globalAlpha = 1;

    // 조작 반전 표시
    if (this.controlReversed) {
      Draw.textOutline('⚠️반전', this.x, this.y - 50, 10, '#FF4444', COLORS.black);
    }

    // HP 바 (머리 위)
    const barW = 44;
    const barH = 5;
    const barX = this.x - barW / 2;
    const barY = this.y - 50;
    Draw.pixelRect(barX, barY, barW, barH, COLORS.hpBg);
    // HP 피격 플래시
    const hpColor = this.hitFlashTimer > 0 ? '#FF0000' : COLORS.hpRed;
    Draw.pixelRect(barX, barY, barW * (this.hp / this.maxHp), barH, hpColor);
    ctx.strokeStyle = COLORS.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
  }
}

// ──────────────────────────────────────────────────────────
// Monster
// ──────────────────────────────────────────────────────────
class Monster {
  constructor(data, x, y) {
    this.data = data;
    this.id = data.id;
    this.x = x;
    this.y = y;
    this.hp = data.hp;
    this.maxHp = data.hp;
    this.speed = data.speed;
    this.damage = data.damage;
    this.size = data.size;
    this.color = data.color;
    this.behavior = data.behavior;
    this.alpha = 1;
    this.teleportTimer = randomRange(3000, 6000);
    this.behaviorTimer = 0;
    this.isDead = false;
    this.deathTimer = 0;
    this.groupTarget = null;
    this.flashTimer = 0;
    this.closeButtonOffset = 0; // 광고팝업 닫기버튼 애니메이션
    this.teleportWarning = false;
  }

  takeDamage(amount) {
    this.hp -= amount;
    this.flashTimer = 120;
    if (this.hp <= 0) { this.hp = 0; this.isDead = true; }
  }

  update(dt, player) {
    if (this.isDead) {
      this.deathTimer += dt;
      this.alpha = Math.max(0, 1 - this.deathTimer / 400);
      return;
    }
    if (this.flashTimer > 0) this.flashTimer -= dt;
    if (this.id === 'ad_popup') this.closeButtonOffset += dt * 0.003;

    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.hypot(dx, dy);

    switch (this.behavior) {
      case 'teleport':
        if (d > 5) {
          this.x += (dx / d) * this.speed * 0.4 * (dt / 1000);
          this.y += (dy / d) * this.speed * 0.4 * (dt / 1000);
        }
        this.behaviorTimer += dt;
        // 순간이동 경고 (이동 1초 전)
        if (this.behaviorTimer > 7000 && this.behaviorTimer < 8000) {
          this.teleportWarning = true;
        } else {
          this.teleportWarning = false;
        }
        if (this.behaviorTimer > 8000) {
          this.behaviorTimer = 0;
          this.teleportWarning = false;
          const angle = Math.random() * Math.PI * 2;
          const r = randomRange(60, 100);
          const nx = clamp(player.x + Math.cos(angle) * r, this.size + 5, GAME_W - this.size - 5);
          const ny = clamp(player.y + Math.sin(angle) * r, 90 + this.size, GAME_H - this.size - 5);
          this.x = nx;
          this.y = ny;
        }
        break;
      case 'group_charge':
        if (d > 5) {
          this.x += (dx / d) * this.speed * (dt / 1000);
          this.y += (dy / d) * this.speed * (dt / 1000);
        }
        break;
      case 'block_path':
        if (d > 5) {
          this.x += (dx / d) * this.speed * 0.7 * (dt / 1000);
          this.y += (dy / d) * this.speed * 0.7 * (dt / 1000);
        }
        break;
      default:
        if (d > 5) {
          this.x += (dx / d) * this.speed * (dt / 1000);
          this.y += (dy / d) * this.speed * (dt / 1000);
        }
    }

    this.x = clamp(this.x, this.size, GAME_W - this.size);
    this.y = clamp(this.y, 80 + this.size, GAME_H - this.size);
  }

  draw() {
    ctx.globalAlpha = this.alpha;
    const flash = this.flashTimer > 0 && Math.floor(this.flashTimer / 40) % 2 === 0;

    if (flash) {
      // 피격 흰색 플래시
      ctx.save();
      switch (this.id) {
        case 'buffering_ghost': Draw.bufferingGhost(this.x, this.y, this.size, this.alpha, this.teleportWarning); break;
        case 'bad_comment_slime': Draw.badCommentSlime(this.x, this.y, this.size, this.alpha); break;
        case 'ad_popup': Draw.adPopup(this.x, this.y, this.size, this.alpha, this.closeButtonOffset); break;
        default:
          ctx.fillStyle = this.color;
          Draw.pixelCircle(this.x, this.y, this.size, this.color);
      }
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(this.x - this.size - 2, this.y - this.size - 2, (this.size + 2) * 2, (this.size + 2) * 2);
      ctx.restore();
    } else {
      switch (this.id) {
        case 'buffering_ghost': Draw.bufferingGhost(this.x, this.y, this.size, this.alpha, this.teleportWarning); break;
        case 'bad_comment_slime': Draw.badCommentSlime(this.x, this.y, this.size, this.alpha); break;
        case 'ad_popup': Draw.adPopup(this.x, this.y, this.size, this.alpha, this.closeButtonOffset); break;
        default:
          ctx.fillStyle = this.color;
          Draw.pixelCircle(this.x, this.y, this.size, this.color);
          ctx.globalAlpha = 1;
          return;
      }
    }
    ctx.globalAlpha = 1;

    // HP바 (소형)
    if (!this.isDead && this.hp < this.maxHp) {
      const bw = this.size * 2;
      const bx = this.x - bw / 2;
      const by = this.y - this.size - 5;
      Draw.pixelRect(bx, by, bw, 3, '#FFB3B3');
      Draw.pixelRect(bx, by, bw * (this.hp / this.maxHp), 3, '#FF4444');
    }
  }
}

// ──────────────────────────────────────────────────────────
// Boss
// ──────────────────────────────────────────────────────────
class Boss {
  constructor(bossData, x, y) {
    this.data = bossData;
    this.id = bossData.id;
    this.x = x;
    this.y = y;
    this.hp = bossData.hp;
    this.maxHp = bossData.hp;
    this.speed = bossData.speed;
    this.damage = bossData.damage;
    this.size = bossData.size;
    this.isDead = false;
    this.deathTimer = 0;
    this.alpha = 1;
    this.flashTimer = 0;
    this.behaviorTimer = 0;
    this.spawnTimer = 0;
    this.minions = [];
  }

  takeDamage(amount) {
    this.hp -= amount;
    this.flashTimer = 100;
    if (this.hp <= 0) { this.hp = 0; this.isDead = true; }
  }

  update(dt, player) {
    if (this.isDead) {
      this.deathTimer += dt;
      this.alpha = Math.max(0, 1 - this.deathTimer / 600);
      return;
    }
    if (this.flashTimer > 0) this.flashTimer -= dt;
    this.behaviorTimer += dt;

    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.hypot(dx, dy);

    if (d > 5) {
      this.x += (dx / d) * this.speed * (dt / 1000);
      this.y += (dy / d) * this.speed * (dt / 1000);
    }

    this.x = clamp(this.x, this.size, GAME_W - this.size);
    this.y = clamp(this.y, 80 + this.size, GAME_H - this.size);
  }

  draw() {
    const flash = this.flashTimer > 0 && Math.floor(this.flashTimer / 40) % 2 === 0;

    if (flash) {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      if (this.id === 'mirror') {
        Draw.mirrorBoss(this.x, this.y, this.size, this.hp, this.maxHp);
      } else {
        Draw.tempBoss(this.x, this.y, this.size, this.hp, this.maxHp, this.data);
      }
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(this.x - this.size * 1.2, this.y - this.size * 1.5, this.size * 2.4, this.size * 3);
      ctx.restore();
    } else {
      ctx.globalAlpha = this.alpha;
      if (this.id === 'mirror') {
        Draw.mirrorBoss(this.x, this.y, this.size, this.hp, this.maxHp);
      } else {
        Draw.tempBoss(this.x, this.y, this.size, this.hp, this.maxHp, this.data);
      }
      ctx.globalAlpha = 1;
    }
  }
}

// ──────────────────────────────────────────────────────────
// Projectile
// ──────────────────────────────────────────────────────────
class Projectile {
  constructor(x, y, vx, vy, damage, skillId, color, size = 7, pierce = false) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.skillId = skillId;
    this.color = color;
    this.size = size;
    this.pierce = pierce;
    this.isDead = false;
    this.lifeTimer = 0;
    this.maxLife = 3000;
    this.hitTargets = new Set();
    this.age = 0;
  }

  update(dt) {
    this.x += this.vx * (dt / 1000);
    this.y += this.vy * (dt / 1000);
    this.lifeTimer += dt;
    this.age += dt;
    if (this.lifeTimer > this.maxLife) this.isDead = true;
    if (this.x < -20 || this.x > GAME_W + 20 || this.y < 0 || this.y > GAME_H + 20) this.isDead = true;
  }

  draw() {
    const pulse = 1 + Math.sin(this.age / 80) * 0.15;
    switch (this.skillId) {
      case 'frozen_orb': {
        // 핑크 주사위 구체 (회전)
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.age / 300);
        ctx.fillStyle = '#FF9ECD';
        ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.strokeStyle = '#FF69B4';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-this.size, -this.size, this.size * 2, this.size * 2);
        // 주사위 점
        ctx.fillStyle = COLORS.white;
        const dots = [[0,0],[-3,-3],[3,-3],[-3,3],[3,3]];
        dots.forEach(([dx,dy]) => { ctx.fillRect(dx-1, dy-1, 2, 2); });
        // 글로우
        ctx.shadowColor = '#FF9ECD';
        ctx.shadowBlur = 6;
        ctx.strokeRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.shadowBlur = 0;
        ctx.restore();

        // 공전 파편
        if (this._orbitShards && !this._exploded) {
          const positions = this._getOrbitPositions ? this._getOrbitPositions() : [];
          positions.forEach((pos, idx) => {
            const shard = this._orbitShards[idx];
            if (!shard) return;
            const spawnScale = shard.spawnAge || 0;
            if (spawnScale <= 0) return;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this._orbitAngle * 2);
            ctx.scale(spawnScale, spawnScale);
            const orbFade = Math.max(0, 1 - this.lifeTimer / this.maxLife * 0.5);
            ctx.globalAlpha = orbFade * spawnScale * 0.9;
            ctx.fillStyle = '#87CEEB';
            ctx.beginPath();
            ctx.moveTo(0, -5); ctx.lineTo(3.5, 0); ctx.lineTo(0, 5); ctx.lineTo(-3.5, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.restore();
          });
        }
        break;
      }
      case 'lightning_fury': {
        // 노란 검기 (방향 회전)
        ctx.save();
        ctx.translate(this.x, this.y);
        const angle = Math.atan2(this.vy, this.vx);
        ctx.rotate(angle);
        // 검기 본체
        ctx.fillStyle = '#FFE566';
        ctx.fillRect(-this.size * 1.5, -this.size * 0.4, this.size * 3, this.size * 0.8);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(-this.size * 0.8, -this.size * 0.25, this.size * 1.6, this.size * 0.5);
        // 검기 끝 빛
        ctx.fillStyle = 'rgba(255,255,200,0.8)';
        ctx.fillRect(this.size * 1.0, -this.size * 0.2, this.size * 0.5, this.size * 0.4);
        // 글로우
        ctx.shadowColor = '#FFE566';
        ctx.shadowBlur = 8;
        ctx.fillStyle = 'rgba(255,230,100,0.3)';
        ctx.fillRect(-this.size * 1.5, -this.size * 0.6, this.size * 3, this.size * 1.2);
        ctx.shadowBlur = 0;
        ctx.restore();
        break;
      }
      case 'chain_lightning': {
        // 음표 전기구슬
        ctx.save();
        ctx.translate(this.x, this.y);
        // 글로우
        ctx.shadowColor = '#87CEEB';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // 음표
        ctx.fillStyle = COLORS.white;
        ctx.font = `bold ${this.size * 1.5}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♪', 0, 0);
        // 전기 파티클
        ctx.strokeStyle = 'rgba(135,206,235,0.6)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
          const a = (this.age / 200 + i * Math.PI * 2 / 3);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * this.size * 0.8, Math.sin(a) * this.size * 0.8);
          ctx.lineTo(Math.cos(a + 0.5) * this.size * 1.4, Math.sin(a + 0.5) * this.size * 1.4);
          ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'nova_shard': {
        ctx.save();
        ctx.translate(this.x, this.y);
        // 여우불꽃 느낌 (주황 다이아몬드)
        ctx.fillStyle = '#FFB347';
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(0, -this.size * pulse);
        ctx.lineTo(this.size * 0.6 * pulse, 0);
        ctx.lineTo(0, this.size * pulse);
        ctx.lineTo(-this.size * 0.6 * pulse, 0);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'orb_shard': {
        // 얼음 파편 — 하늘색 다이아몬드
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 4);
        const fade = Math.max(0, this.lifeTimer / this.maxLife);
        ctx.globalAlpha = (1 - fade) * 0.9;
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 1.2);
        ctx.lineTo(this.size * 0.7, 0);
        ctx.lineTo(0, this.size * 1.2);
        ctx.lineTo(-this.size * 0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'fist': {
        // 전완근 펀치 — 주먹 + 반짝이
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = COLORS.yorangSkin;
        ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.strokeStyle = '#C8884A';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.fillStyle = '#C8884A';
        ctx.font = `bold ${this.size}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💪', 0, 0);
        // 반짝이
        if (Math.sin(this.age / 50) > 0.5) {
          ctx.fillStyle = 'rgba(255,220,150,0.7)';
          ctx.font = `${this.size * 0.8}px serif`;
          ctx.fillText('✦', this.size * 1.2, -this.size * 0.8);
        }
        ctx.restore();
        break;
      }
      case 'basic_sword': {
        ctx.save();
        ctx.translate(this.x, this.y);
        const sAngle = Math.atan2(this.vy, this.vx);
        ctx.rotate(sAngle);
        ctx.fillStyle = '#FFE566';
        ctx.fillRect(-this.size * 1.8, -this.size * 0.35, this.size * 3.6, this.size * 0.7);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(-this.size * 0.6, -this.size * 0.2, this.size * 1.2, this.size * 0.4);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.globalAlpha = 0.7;
        ctx.fillRect(this.size * 1.2, -this.size * 0.15, this.size * 0.6, this.size * 0.3);
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'basic_mic': {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#87CEEB';
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'basic_brush': {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#FF9ECD';
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFB6C1';
        ctx.beginPath();
        ctx.arc(this.size * 0.3, -this.size * 0.3, this.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      default:
        ctx.fillStyle = this.color;
        Draw.pixelCircle(this.x, this.y, this.size * pulse, this.color);
    }
  }
}

// ──────────────────────────────────────────────────────────
// Skill (발동 로직)
// ──────────────────────────────────────────────────────────
class SkillSystem {
  constructor(player, projectiles, monsters, bosses) {
    this.player = player;
    this.projectiles = projectiles;
    this.monsters = monsters;
    this.bosses = bosses;
    this.novaEffects = [];
    this.chainEffects = [];
    this.hitEffects = [];
    this._basicCooldown = 0;
  }

  update(dt) {
    const p = this.player;

    this._basicCooldown -= dt;
    if (this._basicCooldown <= 0) {
      const atkSpeed = p.equipment.weapon?.stats?.atkSpeed || 0;
      const baseCd = p.weaponType === 'fists' ? 600 : 800;
      this._basicCooldown = Math.max(200, baseCd - atkSpeed * 5);
      this._fireBasic();
    }

    p.activeSkillQueue.forEach(skillId => {
      if (p.skillCooldowns[skillId] > 0) return;
      const level = p.skillLevels[skillId];
      if (level === 0) return;
      const skill = SKILLS_DATA[skillId];
      const cd = skill.cooldown[level - 1];
      p.skillCooldowns[skillId] = cd;
      this._fire(skillId, level, skill);
    });

    // 프로즌 오브 파편 스폰
    this.projectiles.forEach(proj => {
      if (proj.skillId === 'frozen_orb' && proj._spawnShards) {
        if (proj._orbTimer === undefined) proj._orbTimer = 0;
        proj._orbTimer += dt;
        if (proj._orbTimer >= 600) {
          proj._orbTimer = 0;
          proj._spawnShards();
        }
      }
    });

    // 이펙트 업데이트
    this.novaEffects = this.novaEffects.filter(e => {
      e.r += 300 * (dt / 1000);
      e.alpha -= dt / 400;
      return e.alpha > 0;
    });
    this.chainEffects = this.chainEffects.filter(e => {
      e.timer -= dt;
      return e.timer > 0;
    });
    this.hitEffects = this.hitEffects.filter(e => {
      e.timer -= dt;
      e.r += 60 * (dt / 1000);
      return e.timer > 0;
    });
  }

  _fire(skillId, level, skill) {
    const p = this.player;
    // 스킬 발동 효과음
    switch (skillId) {
      case 'frozen_orb': SFX.frozenOrb(); break;
      case 'nova': SFX.nova(); break;
      case 'lightning_fury': SFX.lightningFury(); break;
      case 'chain_lightning': SFX.chainLightning(); break;
    }
    switch (skillId) {
      case 'frozen_orb': {
        const target = this._nearestTarget();
        const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facingLeft ? Math.PI : 0);
        const speed = 85;
        const dmg = skill.damage[level - 1];
        const proj = new Projectile(p.x, p.y, Math.cos(angle) * speed, Math.sin(angle) * speed,
          dmg, 'frozen_orb', '#FF9ECD', 11, true);
        proj.maxLife = 2400;
        proj._exploded = false;
        proj._orbitAngle = 0;
        proj._orbitSpeed = 4.5;
        proj._orbitRadius = 18;
        proj._orbitShards = [];
        proj._shardCount = 4 + level;
        proj._shardSpawnTimer = 0;
        proj._shardSpawnInterval = 180;

        const origUpdate = proj.update.bind(proj);
        proj.update = function(dt) {
          origUpdate(dt);
          if (this.isDead) return;
          this._orbitAngle += this._orbitSpeed * (dt / 1000);
          if (this._orbitShards.length < this._shardCount) {
            this._shardSpawnTimer += dt;
            if (this._shardSpawnTimer >= this._shardSpawnInterval) {
              this._shardSpawnTimer = 0;
              const idx = this._orbitShards.length;
              this._orbitShards.push({ angleOffset: (Math.PI * 2 / this._shardCount) * idx, spawnAge: 0 });
            }
          }
          this._orbitShards.forEach(s => { s.spawnAge = Math.min(1, (s.spawnAge || 0) + dt / 200); });
          if (!this._exploded && this.lifeTimer >= this.maxLife - 60) {
            this._exploded = true;
            const shardCount = this._shardCount;
            for (let i = 0; i < shardCount; i++) {
              const a = (Math.PI * 2 / shardCount) * i;
              const sp = new Projectile(this.x, this.y,
                Math.cos(a) * 150, Math.sin(a) * 150,
                Math.floor(dmg * 0.6), 'orb_shard', '#87CEEB', 5);
              sp.maxLife = 700;
              game.projectiles.push(sp);
            }
          }
        };
        proj._getOrbitPositions = function() {
          return this._orbitShards.map(s => ({
            x: this.x + Math.cos(this._orbitAngle + s.angleOffset) * this._orbitRadius,
            y: this.y + Math.sin(this._orbitAngle + s.angleOffset) * this._orbitRadius,
          }));
        };
        game.projectiles.push(proj);
        break;
      }
      case 'nova': {
        // 여우 기운 충격파 — 이중 링 + 여우불꽃 파편
        this.novaEffects.push({ x: p.x, y: p.y, r: 10, maxR: 100 + level * 20, alpha: 0.8 });
        this.novaEffects.push({ x: p.x, y: p.y, r: 5, maxR: 70 + level * 15, alpha: 0.5 });
        const targets = [...this.monsters, ...this.bosses].filter(t => !t.isDead);
        targets.forEach(t => {
          const d = dist(p, t);
          const novaR = 100 + level * 20;
          if (d < novaR) {
            t.takeDamage(skill.damage[level - 1]);
            this.hitEffects.push({ x: t.x, y: t.y, r: 4, timer: 250, color: '#FFB347' });
          }
        });
        break;
      }
      case 'lightning_fury': {
        const maxStages = level <= 3 ? 1 : level <= 6 ? 2 : 3;
        const splitCount = 2 + Math.floor(level / 2);
        const baseDmg = skill.damage[level - 1];
        const decay = 0.55;
        const splitRange = 80 + level * 8;

        const fireLightning = (fromX, fromY, dmg, stage, excludeSet) => {
          const available = [...game.monsters, ...game.bosses].filter(t => {
            if (t.isDead || excludeSet.has(t)) return false;
            return Math.hypot(t.x - fromX, t.y - fromY) <= splitRange;
          });
          if (!available.length) return;
          const nearest = available.reduce((a, b) =>
            Math.hypot(a.x - fromX, a.y - fromY) < Math.hypot(b.x - fromX, b.y - fromY) ? a : b);
          const angle = Math.atan2(nearest.y - fromY, nearest.x - fromX);
          const d = Math.hypot(nearest.x - fromX, nearest.y - fromY);
          const spd = clamp(d * 3, 200, 400);
          const proj = new Projectile(fromX, fromY, Math.cos(angle) * spd, Math.sin(angle) * spd,
            Math.floor(dmg), 'lightning_fury', '#FFE566', 7);
          proj.maxLife = (d / spd) * 1000 * 1.15;
          proj.onHit = (hitTarget) => {
            this.chainEffects.push({ x1: fromX, y1: fromY, x2: hitTarget.x, y2: hitTarget.y, timer: 280, color: '#FFE566' });
            this.hitEffects.push({ x: hitTarget.x, y: hitTarget.y, r: 5, timer: 300, color: '#FFE566' });
            if (stage < maxStages) {
              const nextExclude = new Set(excludeSet);
              nextExclude.add(hitTarget);
              const nextDmg = Math.floor(dmg * decay);
              const splitTargets = [...game.monsters, ...game.bosses]
                .filter(t => {
                  if (t.isDead || nextExclude.has(t)) return false;
                  return Math.hypot(t.x - hitTarget.x, t.y - hitTarget.y) <= splitRange;
                })
                .sort((a, b) => Math.hypot(a.x - hitTarget.x, a.y - hitTarget.y) - Math.hypot(b.x - hitTarget.x, b.y - hitTarget.y))
                .slice(0, splitCount);
              splitTargets.forEach(t => {
                nextExclude.add(t);
                setTimeout(() => fireLightning(hitTarget.x, hitTarget.y, nextDmg, stage + 1, new Set(nextExclude)), 50);
              });
            }
          };
          game.projectiles.push(proj);
        };

        const target = this._nearestTarget();
        if (target) fireLightning(p.x, p.y, baseDmg, 1, new Set());
        break;
      }
      case 'chain_lightning': {
        const target = this._nearestTarget();
        if (!target) break;
        target.takeDamage(skill.damage[level - 1]);
        this.hitEffects.push({ x: target.x, y: target.y, r: 6, timer: 300, color: '#87CEEB' });
        let prev = target;
        const jumped = new Set([target]);
        const chainCount = 1 + Math.floor(level * 0.65);
        for (let i = 0; i < chainCount; i++) {
          const next = this._nearestTargetFrom(prev, jumped);
          if (!next) break;
          jumped.add(next);
          next.takeDamage(Math.floor(skill.damage[level - 1] * (0.7 ** (i + 1))));
          this.chainEffects.push({ x1: prev.x, y1: prev.y, x2: next.x, y2: next.y, timer: 300, color: '#87CEEB' });
          this.hitEffects.push({ x: next.x, y: next.y, r: 4, timer: 200, color: '#87CEEB' });
          prev = next;
        }
        break;
      }
      case 'energy_shield':
        break;
    }
  }

  _fireBasic() {
    const p = this.player;
    let dmg = 8;
    if (p.equipment.weapon && p.equipment.weapon.stats) dmg += (p.equipment.weapon.stats.damage || 0);

    if (p.weaponType === 'fists') {
      const punchRadius = 55;
      const targets = [...game.monsters, ...game.bosses].filter(t => !t.isDead);
      targets.forEach(t => {
        if (dist(p, t) < punchRadius + t.size * 0.5) {
          t.takeDamage(dmg);
          this.hitEffects.push({ x: t.x, y: t.y, r: 5, timer: 250, color: COLORS.yorangSkin });
        }
      });
      const target = this._nearestTarget();
      const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facingLeft ? Math.PI : 0);
      this.hitEffects.push({ x: p.x + Math.cos(angle) * 35, y: p.y + Math.sin(angle) * 35, r: 10, timer: 180, color: '#C8884A' });
    } else {
      const target = this._nearestTarget();
      const angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facingLeft ? Math.PI : 0);
      let skillId = 'basic_shot';
      let color = COLORS.yorangSkin;
      if (p.weaponType === 'sword') { skillId = 'basic_sword'; color = '#FFE566'; }
      else if (p.weaponType === 'mic') { skillId = 'basic_mic'; color = '#87CEEB'; }
      else if (p.weaponType === 'brush') { skillId = 'basic_brush'; color = '#FF9ECD'; }
      const proj = new Projectile(p.x, p.y, Math.cos(angle) * 240, Math.sin(angle) * 240, dmg, skillId, color, 7);
      game.projectiles.push(proj);
    }
  }

  _nearestTarget() {
    const all = [...game.monsters, ...game.bosses].filter(t => !t.isDead);
    if (!all.length) return null;
    return all.reduce((a, b) => dist(this.player, a) < dist(this.player, b) ? a : b);
  }

  _nearestTargetFrom(from, exclude) {
    const all = [...game.monsters, ...game.bosses].filter(t => !t.isDead && !exclude.has(t));
    if (!all.length) return null;
    return all.reduce((a, b) => dist(from, a) < dist(from, b) ? a : b);
  }

  drawHitEffectsOnly() {
    this.hitEffects.forEach(e => {
      ctx.globalAlpha = Math.max(0, e.timer / 300);
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  drawEffects() {
    // 노바 이펙트 (여우 기운 — 주황 이중 링)
    this.novaEffects.forEach(e => {
      ctx.strokeStyle = `rgba(255,179,71,${e.alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,230,100,${e.alpha * 0.5})`;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    });

    // 체인 이펙트 (지그재그 번개)
    this.chainEffects.forEach(e => {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = e.timer / 300;
      ctx.beginPath();
      ctx.moveTo(e.x1, e.y1);
      const mx = (e.x1 + e.x2) / 2 + randomRange(-10, 10);
      const my = (e.y1 + e.y2) / 2 + randomRange(-10, 10);
      ctx.quadraticCurveTo(mx, my, e.x2, e.y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // 히트 이펙트
    this.hitEffects.forEach(e => {
      ctx.globalAlpha = e.timer / 300;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }
}

// ──────────────────────────────────────────────────────────
// Item (드롭 아이템)
// ──────────────────────────────────────────────────────────
class DroppedItem {
  constructor(itemData, x, y) {
    this.data = itemData;
    this.x = x;
    this.y = y;
    this.radius = 14;
    this.bobTimer = Math.random() * Math.PI * 2;
    this.glowTimer = 0;
    this.isPicked = false;
    this.spawnTimer = 0; // 드롭 등장 애니메이션
    this.arrowTimer = 0; // 화살표 애니메이션
  }

  update(dt) {
    this.bobTimer += dt / 600;
    this.glowTimer += dt;
    this.arrowTimer += dt;
    if (this.spawnTimer < 300) this.spawnTimer += dt;
  }

  draw() {
    const bobY = Math.sin(this.bobTimer) * 3;
    const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
    const glowColor = rarityColors[this.data.rarity] || '#FFFFFF';

    // 등장 스케일 애니메이션
    const spawnScale = Math.min(1, this.spawnTimer / 200);
    ctx.save();
    ctx.translate(this.x, this.y + bobY);
    ctx.scale(spawnScale, spawnScale);

    // 레전더리 빛기둥
    if (this.data.rarity === 'legendary') {
      const glowPulse = 0.5 + Math.sin(this.glowTimer / 200) * 0.3;
      ctx.globalAlpha = glowPulse * 0.3;
      ctx.fillStyle = glowColor;
      ctx.fillRect(-4, -60, 8, 60);
      ctx.globalAlpha = 1;
    }

    // 발광 효과
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 8 + Math.sin(this.glowTimer / 300) * 4;

    // 아이템 배경
    ctx.fillStyle = glowColor;
    Draw.pixelCircle(0, 0, this.radius, glowColor);
    ctx.fillStyle = COLORS.white;
    Draw.pixelCircle(0, 0, this.radius - 3, COLORS.white);

    ctx.shadowBlur = 0;

    // 아이템 아이콘
    ctx.font = `${this.radius}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.data.icon, 0, 0);

    // 등급 테두리
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    // 드롭 직후 화살표 (1.5초간)
    if (this.spawnTimer < 1500) {
      const arrowAlpha = Math.max(0, 1 - this.spawnTimer / 1500);
      const arrowBob = Math.sin(this.arrowTimer / 150) * 3;
      ctx.globalAlpha = arrowAlpha;
      ctx.fillStyle = glowColor;
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('▼', this.x, this.y + bobY - this.radius - 10 + arrowBob);
      ctx.globalAlpha = 1;
    }
  }
}

// ──────────────────────────────────────────────────────────
// SpawnPad (보스 소환 발판)
// ──────────────────────────────────────────────────────────
class SpawnPad {
  constructor(data) {
    this.data = data;
    this.x = data.x;
    this.y = data.y;
    this.bossId = data.bossId;
    this.chargeTimer = 0;
    this.chargeRequired = 2000;
    this.isCharged = false;
    this.isActive = true;
    this.pulseTimer = 0;
    this.radius = 22;
    this.isSummoned = false;
  }

  update(dt, playerX, playerY) {
    if (this.isSummoned || !this.isActive) return;
    this.pulseTimer += dt;
    const d = Math.hypot(playerX - this.x, playerY - this.y);
    if (d < this.radius) {
      this.chargeTimer += dt;
      if (this.chargeTimer >= this.chargeRequired) this.isCharged = true;
    } else {
      this.chargeTimer = Math.max(0, this.chargeTimer - dt * 1.5);
      this.isCharged = false;
    }
  }

  draw() {
    if (this.isSummoned) return;
    const pulse = 1 + Math.sin(this.pulseTimer / 400) * 0.1;
    const progress = this.chargeTimer / this.chargeRequired;

    // 발판 바닥 (방향별 테마 색상)
    ctx.fillStyle = this.data.color + '55';
    Draw.pixelCircle(this.x, this.y, this.radius * pulse, this.data.color + '55');

    // 발판 테두리 (충전 중이면 밝아짐)
    ctx.strokeStyle = progress > 0 ? this.data.color : this.data.color + 'AA';
    ctx.lineWidth = progress > 0 ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
    ctx.stroke();

    // 충전 게이지 (원형 — 금색)
    if (progress > 0) {
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }

    // 보스 라벨
    ctx.font = `bold 14px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.data.color;
    ctx.fillText(this.data.label, this.x, this.y);

    // 방향 힌트
    ctx.font = `9px Courier New`;
    ctx.fillStyle = COLORS.black;
    ctx.fillText(
      this.data.id === 'north' ? '↑' : this.data.id === 'south' ? '↓' : this.data.id === 'east' ? '→' : '←',
      this.x, this.y + this.radius + 8
    );
  }
}

// ──────────────────────────────────────────────────────────
// UI
// ──────────────────────────────────────────────────────────
class UISystem {
  constructor(game) {
    this.game = game;
    this.itemQueue = [];
    this.itemFlashData = null;
    this.itemFlashTimer = 0;
    this.itemFlashDuration = 10000;
    this._pendingEquip = false;
    this._fadeInTimer = 0;
    this._fadeInDuration = 200;
    this.pauseViewingItem = null;

    // 레벨업 알림
    this.levelUpTimer = 0;
    this.levelUpText = '';

    // 킬카운트 펀치 애니메이션
    this.killCountPunch = 0;
  }

  showItemFlash(itemData, pendingEquip = false) {
    this.itemQueue.push({ data: itemData, pendingEquip });
    if (!this.itemFlashData) this._dequeueNext();
  }

  _dequeueNext() {
    if (this.itemQueue.length === 0) {
      this.itemFlashData = null;
      this.itemFlashTimer = 0;
      this._fadeInTimer = 0;
      return;
    }
    const next = this.itemQueue.shift();
    this.itemFlashData = next.data;
    this._pendingEquip = next.pendingEquip;
    this.itemFlashTimer = this.itemFlashDuration;
    this._fadeInTimer = 0;
  }

  dismissCurrent() { this._dequeueNext(); }

  equipCurrent() {
    if (!this.itemFlashData) return;
    this.game.player.equipItem(this.itemFlashData);
    this._dequeueNext();
  }

  showLevelUp(level) {
    this.levelUpTimer = 900;
    this.levelUpText = `LEVEL ${level}!`;
  }

  onKill() {
    this.killCountPunch = 200;
  }

  update(dt) {
    if (this.itemFlashTimer > 0) {
      this.itemFlashTimer -= dt;
      this._fadeInTimer = Math.min(this._fadeInDuration, this._fadeInTimer + dt);
      if (this.itemFlashTimer <= 0) this._dequeueNext();
    }
    if (this.levelUpTimer > 0) this.levelUpTimer -= dt;
    if (this.killCountPunch > 0) this.killCountPunch -= dt;
  }

  drawHUD() {
    const g = this.game;
    const p = g.player;

    // EXP 바 (최상단 — 얇은 풀바)
    const expProgress = p.xp / p.xpToNext;
    Draw.pixelRect(0, 0, GAME_W, 5, COLORS.expBarBg);
    Draw.pixelRect(0, 0, GAME_W * expProgress, 5, COLORS.expBar);

    // 스킬바 배경
    ctx.fillStyle = 'rgba(255,245,228,0.92)';
    ctx.fillRect(0, 5, GAME_W - 40, 50);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 5, GAME_W - 40, 50);

    // 스킬 아이콘
    const skillIds = Object.keys(SKILLS_DATA);
    const iconW = (GAME_W - 40) / skillIds.length;
    skillIds.forEach((id, i) => {
      const skill = SKILLS_DATA[id];
      const level = p.skillLevels[id];
      const isActive = p.activeSkillQueue.includes(id);
      const isLocked = level === 0;
      const cdPercent = p.skillCooldowns[id] > 0 && level > 0 ?
        p.skillCooldowns[id] / skill.cooldown[Math.max(0, level - 1)] : 0;
      const weaponOk = !skill.requiredWeapon || skill.requiredWeapon === p.weaponType;

      const sx = i * iconW + 2;
      const sy = 7;
      const sw = iconW - 4;
      const sh = 46;

      // 배경
      let bgColor = isLocked ? '#D8D0C8' : (isActive ? '#FFF0A0' : '#F5EDE0');
      if (!weaponOk && !isLocked) bgColor = '#E0D5C8';
      ctx.fillStyle = bgColor;
      ctx.fillRect(sx, sy, sw, sh);

      // 활성화 테두리 (금색 글로우)
      if (isActive) {
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 4;
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, sy, sw, sh);
        ctx.shadowBlur = 0;
      }

      // 아이콘
      ctx.globalAlpha = isLocked || (!weaponOk && !isLocked) ? 0.4 : 1;
      ctx.font = '18px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(skill.icon, sx + sw / 2, sy + 14);
      ctx.globalAlpha = 1;

      // 레벨 표시
      if (level > 0) {
        ctx.fillStyle = '#8B5E3C';
        ctx.font = 'bold 8px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`Lv.${level}`, sx + sw / 2, sy + 27);
      } else {
        ctx.fillStyle = '#A09080';
        ctx.font = '7px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('LOCKED', sx + sw / 2, sy + 27);
      }

      // 쿨다운 오버레이 (파이 차트형 — 박스 클리핑)
      if (cdPercent > 0) {
        ctx.save();
        // 스킬 박스 영역으로 클리핑 (박스 밖 노출 방지)
        ctx.beginPath();
        ctx.rect(sx, sy, sw, sh);
        ctx.clip();
        // 반지름 = 대각선 절반 (박스를 꽉 채우는 최소 반지름)
        const r = Math.hypot(sw, sh) / 2;
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.moveTo(sx + sw / 2, sy + sh / 2);
        ctx.arc(sx + sw / 2, sy + sh / 2, r,
          -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * cdPercent);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 장비 불일치
      if (!weaponOk && !isLocked) {
        ctx.fillStyle = 'rgba(80,80,80,0.5)';
        ctx.fillRect(sx, sy, sw, sh);
        ctx.font = '9px Courier New';
        ctx.fillStyle = '#FF6B6B';
        ctx.textAlign = 'center';
        ctx.fillText('⚔️필요', sx + sw / 2, sy + sh / 2);
      }

      // + 버튼
      if (p.skillPoints > 0 && level < skill.maxLevel && weaponOk) {
        ctx.fillStyle = '#7BC47F';
        ctx.fillRect(sx + sw - 12, sy + sh - 12, 11, 11);
        ctx.fillStyle = COLORS.white;
        ctx.font = 'bold 9px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', sx + sw - 6.5, sy + sh - 6.5);
      }
    });

    // 일시정지 버튼
    ctx.fillStyle = COLORS.uiBg;
    ctx.fillRect(GAME_W - 38, 5, 36, 50);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(GAME_W - 38, 5, 36, 50);
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸', GAME_W - 20, 30);

    // 스킬 포인트 뱃지
    if (p.skillPoints > 0) {
      Draw.pixelCircle(GAME_W - 42, 8, 9, '#FF6B6B');
      ctx.fillStyle = COLORS.white;
      ctx.font = 'bold 9px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.skillPoints, GAME_W - 42, 8);
    }

    // 타이머
    const elapsed = Math.floor(g.gameTimer / 1000);
    const minutes = Math.floor(elapsed / 60);
    const seconds = elapsed % 60;
    const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    ctx.fillStyle = COLORS.uiBg;
    ctx.fillRect(GAME_W / 2 - 28, 57, 56, 18);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(GAME_W / 2 - 28, 57, 56, 18);
    Draw.textOutline(timeStr, GAME_W / 2, 66, 10, COLORS.black, COLORS.uiBg);

    // 킬 카운트 (펀치 애니메이션)
    const killScale = this.killCountPunch > 0 ? 1 + (this.killCountPunch / 200) * 0.3 : 1;
    ctx.save();
    ctx.translate(32, 66);
    ctx.scale(killScale, killScale);
    ctx.fillStyle = 'rgba(255,245,228,0.85)';
    ctx.fillRect(-27, -9, 54, 18);
    Draw.text(`💀 ${g.killCount}`, -22, 0, 9, COLORS.black);
    ctx.restore();

    // 아이템 플래시
    if (this.itemFlashTimer > 0 && this.itemFlashData) this._drawItemFlash();

    // 레벨업 알림
    if (this.levelUpTimer > 0) {
      const t = this.levelUpTimer / 900;
      const scale = t > 0.8 ? 1 + (1 - t) / 0.2 * 0.3 : 1;
      ctx.globalAlpha = Math.min(1, t * 3);
      ctx.save();
      ctx.translate(GAME_W / 2, GAME_H / 2 - 60);
      ctx.scale(scale, scale);
      Draw.textOutline('LEVEL UP!', 0, 0, 20, '#FFD700', '#8B5E3C');
      ctx.font = '11px Courier New';
      ctx.fillStyle = '#C8884A';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.levelUpText, 0, 22);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  _drawItemFlash() {
    const d = this.itemFlashData;
    const fadeInAlpha  = Math.min(1, this._fadeInTimer / this._fadeInDuration);
    const fadeOutAlpha = Math.min(1, this.itemFlashTimer / 500);
    const alpha = Math.min(fadeInAlpha, fadeOutAlpha);
    ctx.globalAlpha = alpha;

    const CARD_Y  = GAME_H - 165;
    const CARD_H  = 150;
    const CARD_X  = 20;
    const CARD_W  = GAME_W - 40;

    const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
    const cardColor = rarityColors[d.rarity] || '#FFFFFF';
    const rarityLabel = { common: '일반', rare: '레어', epic: '에픽', legendary: '전설' };

    // 카드 배경
    ctx.fillStyle = 'rgba(255,250,240,1.0)';
    ctx.beginPath();
    ctx.roundRect(CARD_X, CARD_Y, CARD_W, CARD_H, 12);
    ctx.fill();

    // 등급 색상 헤더 바
    ctx.fillStyle = cardColor;
    ctx.beginPath();
    ctx.roundRect(CARD_X, CARD_Y, CARD_W, 4, [12, 12, 0, 0]);
    ctx.fill();

    // 카드 테두리
    ctx.strokeStyle = cardColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(CARD_X, CARD_Y, CARD_W, CARD_H, 12);
    ctx.stroke();

    // 아이콘
    ctx.font = '32px serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLORS.black;
    ctx.fillText(d.icon, CARD_X + 12, CARD_Y + 30);

    // 아이템 이름
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(255,250,240,0.9)';
    ctx.lineWidth = 3;
    ctx.strokeText(d.name, CARD_X + 56, CARD_Y + 18);
    ctx.fillStyle = '#1A0A00';
    ctx.fillText(d.name, CARD_X + 56, CARD_Y + 18);

    // 등급 + 슬롯
    ctx.font = 'bold 11px Courier New';
    ctx.fillStyle = cardColor;
    ctx.textAlign = 'left';
    ctx.fillText(`[${rarityLabel[d.rarity] || ''}] ${d.slot.toUpperCase()}`, CARD_X + 56, CARD_Y + 34);

    // 구분선
    ctx.strokeStyle = 'rgba(200,136,74,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(CARD_X + 12, CARD_Y + 46);
    ctx.lineTo(CARD_X + CARD_W - 12, CARD_Y + 46);
    ctx.stroke();

    // 로어 미리보기
    const lorePreview = d.lore.split('\n')[0];
    ctx.font = '11px Courier New';
    ctx.fillStyle = '#5A3010';
    ctx.textAlign = 'left';
    ctx.fillText(lorePreview, CARD_X + 12, CARD_Y + 58);

    // 카운트다운 원형 게이지
    const countdownR = 11;
    const countdownX = CARD_X + CARD_W - 18;
    const countdownY = CARD_Y + 20;
    const countdownProgress = this.itemFlashTimer / this.itemFlashDuration;
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(countdownX, countdownY, countdownR, 0, Math.PI * 2);
    ctx.stroke();
    const gaugeColor = countdownProgress < 0.3 ? '#FF6B6B' : '#C8884A';
    ctx.strokeStyle = gaugeColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(countdownX, countdownY, countdownR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * countdownProgress);
    ctx.stroke();
    const secsLeft = Math.ceil(this.itemFlashTimer / 1000);
    ctx.font = 'bold 10px Courier New';
    ctx.fillStyle = gaugeColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(secsLeft, countdownX, countdownY);

    // 큐 대기 수
    if (this.itemQueue.length > 0) {
      ctx.font = 'bold 10px Courier New';
      ctx.fillStyle = '#6B5040';
      ctx.textAlign = 'left';
      ctx.fillText(`+${this.itemQueue.length}개 대기`, CARD_X + 12, CARD_Y + 74);
    }

    // 버튼 영역
    const BTN_Y   = CARD_Y + 84;
    const BTN_H   = 34;
    const BTN_GAP = 8;

    if (this._pendingEquip) {
      const btnW = (CARD_W - BTN_GAP * 3) / 2;
      ctx.fillStyle = '#4A9E50';
      ctx.beginPath();
      ctx.roundRect(CARD_X + BTN_GAP, BTN_Y, btnW, BTN_H, 8);
      ctx.fill();
      ctx.font = 'bold 13px Courier New';
      ctx.fillStyle = COLORS.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✅ 장착하기', CARD_X + BTN_GAP + btnW / 2, BTN_Y + BTN_H / 2);

      ctx.fillStyle = '#8B7355';
      ctx.beginPath();
      ctx.roundRect(CARD_X + BTN_GAP * 2 + btnW, BTN_Y, btnW, BTN_H, 8);
      ctx.fill();
      ctx.font = 'bold 13px Courier New';
      ctx.fillStyle = COLORS.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('❌ 버리기', CARD_X + BTN_GAP * 2 + btnW + btnW / 2, BTN_Y + BTN_H / 2);
    } else {
      const btnW = (CARD_W - BTN_GAP * 3) / 2;
      ctx.fillStyle = '#C8884A';
      ctx.beginPath();
      ctx.roundRect(CARD_X + BTN_GAP, BTN_Y, btnW, BTN_H, 8);
      ctx.fill();
      ctx.font = 'bold 12px Courier New';
      ctx.fillStyle = COLORS.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔍 상세 보기', CARD_X + BTN_GAP + btnW / 2, BTN_Y + BTN_H / 2);

      ctx.fillStyle = '#8B7355';
      ctx.beginPath();
      ctx.roundRect(CARD_X + BTN_GAP * 2 + btnW, BTN_Y, btnW, BTN_H, 8);
      ctx.fill();
      ctx.font = 'bold 13px Courier New';
      ctx.fillStyle = COLORS.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✕ 닫기', CARD_X + BTN_GAP * 2 + btnW + btnW / 2, BTN_Y + BTN_H / 2);
    }

    ctx.globalAlpha = 1;
  }

    ctx.strokeStyle = COLORS.uiBorder;

    ctx.stroke();

    ctx.textBaseline = 'middle';

    Draw.textOutline(item.name, GAME_W / 2, 160, 16, COLORS.black, COLORS.uiBg);

    ctx.font = '10px Courier New';
    ctx.fillStyle = rarityColors[item.rarity];

    ctx.fillText(`★ ${rarityLabel[item.rarity] || ''} ★`, GAME_W / 2, 180);

    const lines = item.lore.split('\n');
    ctx.font = '12px Courier New';

      });

    ctx.roundRect(GAME_W / 2 - 50, GAME_H - 100, 100, 32, 8);

  drawClearScreen(stats) {
