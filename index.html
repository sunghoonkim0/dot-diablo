// 🔧 유틸리티
// ============================================================
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}
function normalize(dx, dy) {
  const len = Math.hypot(dx, dy);
  if (len === 0) return { x: 0, y: 0 };
  return { x: dx / len, y: dy / len };
}
function randomRange(min, max) {
  return Math.random() * (max - min) + min;
}
function randomInt(min, max) {
  return Math.floor(randomRange(min, max + 1));
}
function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}
// 색상 보간 (hex)
function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16);
  const bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl2 = Math.round(ab + (bb - ab) * t);
  return `#${((r << 16) | (g << 8) | bl2).toString(16).padStart(6, '0')}`;
}

// ============================================================
const Draw = {
  pixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
  },
  pixelCircle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(Math.floor(x), Math.floor(y), r, 0, Math.PI * 2);
    ctx.fill();
  },
  pixelOutlineCircle(x, y, r, color, lineWidth = 2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.arc(Math.floor(x), Math.floor(y), r, 0, Math.PI * 2);
    ctx.stroke();
  },
  text(str, x, y, size, color, align = 'left', font = 'Courier New') {
    ctx.font = `bold ${size}px '${font}'`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  },
  textOutline(str, x, y, size, fillColor, strokeColor, align = 'center') {
    ctx.font = `bold ${size}px 'Courier New'`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fillColor;
    ctx.fillText(str, x, y);
  },

  // ─────────────────────────────────────────────────────────
  // 요랑 픽셀 캐릭터 (48×48 기반 — 업스케일)
  // ─────────────────────────────────────────────────────────
  yorang(x, y, facingLeft, equippedHead, walkFrame = 0, hitFlash = false) {
    const S = 2;          // 픽셀 스케일 (24→48)
    const bx = Math.floor(x - 12 * S);
    const by = Math.floor(y - 20 * S);

    ctx.save();
    if (hitFlash) {
      ctx.globalCompositeOperation = 'source-atop';
    }

    // 걷기 다리 오프셋
    const legSwing = Math.sin(walkFrame * 0.18) * 2;

    // 꼬리
    ctx.fillStyle = COLORS.yorangHair;
    ctx.beginPath();
    ctx.ellipse(
      bx + (facingLeft ? 20 : 4) * S,
      by + 20 * S,
      7 * S, 5 * S,
      facingLeft ? 0.5 : -0.5,
      0, Math.PI * 2
    );
    ctx.fill();
    // 꼬리 끝 흰털
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.ellipse(
      bx + (facingLeft ? 22 : 2) * S,
      by + 19 * S,
      3 * S, 2.5 * S,
      facingLeft ? 0.3 : -0.3,
      0, Math.PI * 2
    );
    ctx.fill();

    // 몸통 (옷)
    ctx.fillStyle = '#B8D4E8';
    this.pixelRect(bx + 4 * S, by + 12 * S, 16 * S, 12 * S, '#B8D4E8');
    // 옷 주름 디테일
    ctx.fillStyle = 'rgba(150,180,210,0.4)';
    this.pixelRect(bx + 8 * S, by + 13 * S, 2 * S, 9 * S, 'rgba(150,180,210,0.4)');
    this.pixelRect(bx + 14 * S, by + 13 * S, 2 * S, 9 * S, 'rgba(150,180,210,0.4)');

    // 팔
    ctx.fillStyle = COLORS.yorangSkin;
    this.pixelRect(bx + 1 * S, by + 13 * S, 4 * S, 8 * S, COLORS.yorangSkin);
    this.pixelRect(bx + 19 * S, by + 13 * S, 4 * S, 8 * S, COLORS.yorangSkin);
    // 팔 아웃라인
    ctx.strokeStyle = 'rgba(180,120,60,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 1 * S, by + 13 * S, 4 * S, 8 * S);
    ctx.strokeRect(bx + 19 * S, by + 13 * S, 4 * S, 8 * S);

    // 다리 (걷기 애니메이션)
    const lLegOff = legSwing;
    const rLegOff = -legSwing;
    this.pixelRect(bx + 5 * S, by + 22 * S + lLegOff, 5 * S, 5 * S, '#404060');
    this.pixelRect(bx + 14 * S, by + 22 * S + rLegOff, 5 * S, 5 * S, '#404060');
    // 신발 끝 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    this.pixelRect(bx + 5 * S, by + 22 * S + lLegOff, 5 * S, 1 * S, 'rgba(255,255,255,0.2)');
    this.pixelRect(bx + 14 * S, by + 22 * S + rLegOff, 5 * S, 1 * S, 'rgba(255,255,255,0.2)');

    // 얼굴
    this.pixelRect(bx + 4 * S, by + 4 * S, 16 * S, 10 * S, COLORS.yorangSkin);
    // 얼굴 아웃라인
    ctx.strokeStyle = 'rgba(180,120,60,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 4 * S, by + 4 * S, 16 * S, 10 * S);

    // 눈 (보라 눈동자 + 하이라이트)
    this.pixelCircle(bx + 8 * S, by + 8 * S, 2.5 * S, COLORS.yorangEye);
    this.pixelCircle(bx + 16 * S, by + 8 * S, 2.5 * S, COLORS.yorangEye);
    // 눈동자 어두운 부분
    this.pixelCircle(bx + 8 * S, by + 8.5 * S, 1.5 * S, '#6B5E9A');
    this.pixelCircle(bx + 16 * S, by + 8.5 * S, 1.5 * S, '#6B5E9A');
    // 하이라이트
    this.pixelCircle(bx + 7 * S, by + 7 * S, 1 * S, COLORS.white);
    this.pixelCircle(bx + 15 * S, by + 7 * S, 1 * S, COLORS.white);

    // 볼터치
    ctx.fillStyle = 'rgba(255,182,193,0.55)';
    this.pixelCircle(bx + 6 * S, by + 10 * S, 2.5 * S, 'rgba(255,182,193,0.55)');
    this.pixelCircle(bx + 18 * S, by + 10 * S, 2.5 * S, 'rgba(255,182,193,0.55)');

    // 머리카락
    ctx.fillStyle = COLORS.yorangHair;
    this.pixelRect(bx + 3 * S, by + 2 * S, 18 * S, 6 * S, COLORS.yorangHair);
    this.pixelRect(bx + 2 * S, by + 6 * S, 4 * S, 6 * S, COLORS.yorangHair);
    this.pixelRect(bx + 18 * S, by + 6 * S, 4 * S, 6 * S, COLORS.yorangHair);
    // 머리카락 하이라이트
    ctx.fillStyle = 'rgba(255,220,160,0.4)';
    this.pixelRect(bx + 6 * S, by + 2 * S, 8 * S, 2 * S, 'rgba(255,220,160,0.4)');

    // 여우귀 (기본)
    this._drawFoxEars(bx, by, S);

    // 머리 장비 오버레이
    if (equippedHead) this._drawHeadEquip(bx, by, S, equippedHead);

    ctx.restore();
  },

  _drawFoxEars(bx, by, S) {
    // 귀 외곽 (갈색)
    ctx.fillStyle = COLORS.yorangHair;
    ctx.beginPath();
    ctx.moveTo(bx + 4 * S, by + 4 * S);
    ctx.lineTo(bx + 1 * S, by - 5 * S);
    ctx.lineTo(bx + 9 * S, by + 1 * S);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + 20 * S, by + 4 * S);
    ctx.lineTo(bx + 23 * S, by - 5 * S);
    ctx.lineTo(bx + 15 * S, by + 1 * S);
    ctx.fill();
    // 귀 안쪽 흰털
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.moveTo(bx + 5 * S, by + 2 * S);
    ctx.lineTo(bx + 3 * S, by - 3 * S);
    ctx.lineTo(bx + 8 * S, by + 1 * S);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + 19 * S, by + 2 * S);
    ctx.lineTo(bx + 21 * S, by - 3 * S);
    ctx.lineTo(bx + 16 * S, by + 1 * S);
    ctx.fill();
    // 귀 안쪽 분홍 (살색)
    ctx.fillStyle = 'rgba(255,200,200,0.4)';
    ctx.beginPath();
    ctx.moveTo(bx + 5.5 * S, by + 1.5 * S);
    ctx.lineTo(bx + 3.5 * S, by - 2 * S);
    ctx.lineTo(bx + 7.5 * S, by + 0.5 * S);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + 18.5 * S, by + 1.5 * S);
    ctx.lineTo(bx + 20.5 * S, by - 2 * S);
    ctx.lineTo(bx + 16.5 * S, by + 0.5 * S);
    ctx.fill();
  },

  _drawHeadEquip(bx, by, S, headId) {
    switch (headId) {
      case 'postit':
      case 'babu_postit': {
        // 포스트잇 (노란 사각형 + 핑크 글씨)
        ctx.fillStyle = '#FFE566';
        this.pixelRect(bx + 7 * S, by + 3 * S, 10 * S, 8 * S, '#FFE566');
        // 포스트잇 테두리
        ctx.strokeStyle = '#E8C800';
        ctx.lineWidth = 1;
        ctx.strokeRect(bx + 7 * S, by + 3 * S, 10 * S, 8 * S);
        // 바부바부 텍스트 (픽셀 선)
        ctx.fillStyle = '#FF69B4';
        this.pixelRect(bx + 9 * S, by + 5 * S, 6 * S, 1 * S, '#FF69B4');
        this.pixelRect(bx + 9 * S, by + 7 * S, 4 * S, 1 * S, '#FF69B4');
        // 하트
        ctx.font = `${5 * S}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FF69B4';
        ctx.fillText('♥', bx + 14 * S, by + 7 * S);
        break;
      }
      case 'harang_hat': {
        // 해랑이탈 (병아리 머리 모양)
        ctx.fillStyle = COLORS.harangYellow;
        this.pixelCircle(bx + 12 * S, by - 2 * S, 8 * S, COLORS.harangYellow);
        // 부리
        ctx.fillStyle = '#FF8C00';
        this.pixelRect(bx + 10 * S, by + 2 * S, 4 * S, 3 * S, '#FF8C00');
        // 눈
        ctx.fillStyle = COLORS.black;
        this.pixelCircle(bx + 9 * S, by - 2 * S, 1.5 * S, COLORS.black);
        this.pixelCircle(bx + 15 * S, by - 2 * S, 1.5 * S, COLORS.black);
        // 눈 하이라이트
        ctx.fillStyle = COLORS.white;
        this.pixelCircle(bx + 8.5 * S, by - 2.5 * S, 0.7 * S, COLORS.white);
        this.pixelCircle(bx + 14.5 * S, by - 2.5 * S, 0.7 * S, COLORS.white);
        break;
      }
      case 'bunny_tiara': {
        // 토끼귀 (여우귀 위에 추가)
        ctx.fillStyle = '#FFB6C1';
        this.pixelRect(bx + 5 * S, by - 8 * S, 3 * S, 8 * S, '#FFB6C1');
        this.pixelRect(bx + 16 * S, by - 8 * S, 3 * S, 8 * S, '#FFB6C1');
        // 귀 안쪽
        ctx.fillStyle = '#FFD0DC';
        this.pixelRect(bx + 6 * S, by - 7 * S, 1 * S, 6 * S, '#FFD0DC');
        this.pixelRect(bx + 17 * S, by - 7 * S, 1 * S, 6 * S, '#FFD0DC');
        // 티아라 밴드
        ctx.fillStyle = '#FFB6C1';
        this.pixelRect(bx + 3 * S, by + 1 * S, 18 * S, 2 * S, '#FFB6C1');
        // 티아라 보석
        ctx.fillStyle = '#FF69B4';
        this.pixelCircle(bx + 12 * S, by + 1 * S, 2 * S, '#FF69B4');
        break;
      }
      case 'cup_crown': {
        // 왕관 (보라)
        ctx.fillStyle = '#DDA0DD';
        this.pixelRect(bx + 4 * S, by - 4 * S, 16 * S, 5 * S, '#DDA0DD');
        ctx.fillStyle = '#B87CC4';
        for (let i = 0; i < 3; i++) {
          this.pixelRect(bx + (5 + i * 5) * S, by - 7 * S, 3 * S, 4 * S, '#B87CC4');
        }
        // 술잔 (왕관 위)
        ctx.fillStyle = '#87CEEB';
        this.pixelCircle(bx + 12 * S, by - 3 * S, 2.5 * S, '#87CEEB');
        ctx.fillStyle = '#6BB8D8';
        this.pixelRect(bx + 11 * S, by - 1 * S, 2 * S, 2 * S, '#6BB8D8');
        // 왕관 보석
        ctx.fillStyle = '#FF69B4';
        this.pixelCircle(bx + 7 * S, by - 5 * S, 1.5 * S, '#FF69B4');
        this.pixelCircle(bx + 17 * S, by - 5 * S, 1.5 * S, '#FF69B4');
        break;
      }
      case 'yr_crown': {
        // 왕관 (금색)
        ctx.fillStyle = '#FFD700';
        this.pixelRect(bx + 4 * S, by - 4 * S, 16 * S, 5 * S, '#FFD700');
        ctx.fillStyle = '#FFA500';
        for (let i = 0; i < 3; i++) {
          this.pixelRect(bx + (5 + i * 5) * S, by - 8 * S, 3 * S, 5 * S, '#FFA500');
        }
        // 왕관 하이라이트
        ctx.fillStyle = 'rgba(255,255,200,0.5)';
        this.pixelRect(bx + 4 * S, by - 4 * S, 16 * S, 1 * S, 'rgba(255,255,200,0.5)');
        // 보석
        ctx.fillStyle = '#FF4500';
        this.pixelCircle(bx + 7 * S, by - 6 * S, 2 * S, '#FF4500');
        this.pixelCircle(bx + 12 * S, by - 7 * S, 2 * S, '#FF4500');
        this.pixelCircle(bx + 17 * S, by - 6 * S, 2 * S, '#FF4500');
        // 보석 하이라이트
        ctx.fillStyle = 'rgba(255,200,150,0.7)';
        this.pixelCircle(bx + 6.5 * S, by - 6.5 * S, 0.8 * S, 'rgba(255,200,150,0.7)');
        this.pixelCircle(bx + 11.5 * S, by - 7.5 * S, 0.8 * S, 'rgba(255,200,150,0.7)');
        this.pixelCircle(bx + 16.5 * S, by - 6.5 * S, 0.8 * S, 'rgba(255,200,150,0.7)');
        break;
      }
    }
  },

  // ─────────────────────────────────────────────────────────
  // 해랑이 픽셀 (16px 기반 — 업스케일)
  // ─────────────────────────────────────────────────────────
  harang(x, y, size = 16, wingFrame = 0) {
    const wf = Math.sin(wingFrame * 0.15) * 0.3; // 날개 퍼덕임
    const bx = Math.floor(x - size / 2);
    const by = Math.floor(y - size / 2);

    // 몸통 (노란 원형)
    ctx.fillStyle = COLORS.harangYellow;
    this.pixelCircle(x, y + 1, size * 0.55, COLORS.harangYellow);
    // 몸통 하이라이트
    ctx.fillStyle = 'rgba(255,255,200,0.4)';
    this.pixelCircle(x - size * 0.1, y - size * 0.1, size * 0.25, 'rgba(255,255,200,0.4)');

    // 날개 (퍼덕임)
    ctx.fillStyle = 'rgba(255,230,100,0.7)';
    ctx.save();
    ctx.translate(x - size * 0.45, y);
    ctx.rotate(-0.3 + wf);
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.3, size * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(x + size * 0.45, y);
    ctx.rotate(0.3 - wf);
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.3, size * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 부리
    ctx.fillStyle = '#FF8C00';
    this.pixelRect(bx + size * 0.35, by + size * 0.55, size * 0.3, size * 0.2, '#FF8C00');

    // 눈
    ctx.fillStyle = COLORS.black;
    this.pixelCircle(x - size * 0.2, y - size * 0.05, size * 0.13, COLORS.black);
    this.pixelCircle(x + size * 0.2, y - size * 0.05, size * 0.13, COLORS.black);
    // 눈 하이라이트
    ctx.fillStyle = COLORS.white;
    this.pixelCircle(x - size * 0.23, y - size * 0.1, size * 0.06, COLORS.white);
    this.pixelCircle(x + size * 0.17, y - size * 0.1, size * 0.06, COLORS.white);

    // 볼
    ctx.fillStyle = 'rgba(255,182,193,0.55)';
    this.pixelCircle(x - size * 0.3, y + size * 0.1, size * 0.11, 'rgba(255,182,193,0.55)');
    this.pixelCircle(x + size * 0.3, y + size * 0.1, size * 0.11, 'rgba(255,182,193,0.55)');
  },

  // ─────────────────────────────────────────────────────────
  // 버퍼링 유령 (개선)
  // ─────────────────────────────────────────────────────────
  bufferingGhost(x, y, size, alpha, teleportWarning = false) {
    ctx.globalAlpha = alpha * (teleportWarning ? 0.4 + Math.sin(Date.now() / 80) * 0.3 : 1);
    // 몸통
    ctx.fillStyle = '#B0C4DE';
    this.pixelCircle(x, y - size * 0.2, size * 0.7, '#B0C4DE');
    this.pixelRect(x - size * 0.7, y - size * 0.2, size * 1.4, size * 0.8, '#B0C4DE');
    // 하단 물결
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = COLORS.bg;
      this.pixelCircle(x - size * 0.4 + i * size * 0.4, y + size * 0.5, size * 0.22, COLORS.bg);
    }
    // 눈
    ctx.fillStyle = COLORS.black;
    this.pixelCircle(x - size * 0.3, y - size * 0.15, size * 0.16, COLORS.black);
    this.pixelCircle(x + size * 0.3, y - size * 0.15, size * 0.16, COLORS.black);
    // 눈 하이라이트
    ctx.fillStyle = COLORS.white;
    this.pixelCircle(x - size * 0.35, y - size * 0.2, size * 0.07, COLORS.white);
    this.pixelCircle(x + size * 0.25, y - size * 0.2, size * 0.07, COLORS.white);
    // 로딩 표시
    ctx.fillStyle = '#4169E1';
    ctx.font = `bold ${size * 0.6}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('...', x, y + size * 0.1);
    // 순간이동 경고 시 빨간 눈
    if (teleportWarning) {
      ctx.fillStyle = '#FF4444';
      this.pixelCircle(x - size * 0.3, y - size * 0.15, size * 0.16, '#FF4444');
      this.pixelCircle(x + size * 0.3, y - size * 0.15, size * 0.16, '#FF4444');
    }
    ctx.globalAlpha = 1;
  },

  // ─────────────────────────────────────────────────────────
  // 악성댓글 슬라임 (개선)
  // ─────────────────────────────────────────────────────────
  badCommentSlime(x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    // 몸통
    ctx.fillStyle = '#9370DB';
    this.pixelCircle(x, y, size * 0.65, '#9370DB');
    // 하단 방울
    ctx.fillStyle = '#7B52AB';
    this.pixelCircle(x - size * 0.2, y + size * 0.3, size * 0.3, '#7B52AB');
    this.pixelCircle(x + size * 0.2, y + size * 0.3, size * 0.3, '#7B52AB');
    // 몸통 하이라이트
    ctx.fillStyle = 'rgba(200,170,255,0.35)';
    this.pixelCircle(x - size * 0.15, y - size * 0.2, size * 0.25, 'rgba(200,170,255,0.35)');
    // 글자 (흘러내리는 느낌)
    ctx.fillStyle = COLORS.white;
    ctx.font = `bold ${size * 0.45}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ㅋ', x, y);
    // 작은 글자 파편
    ctx.globalAlpha = alpha * 0.5;
    ctx.font = `${size * 0.28}px Courier New`;
    ctx.fillText('ㅋ', x - size * 0.4, y + size * 0.15);
    ctx.fillText('ㅋ', x + size * 0.35, y + size * 0.2);
    ctx.globalAlpha = 1;
  },

  // ─────────────────────────────────────────────────────────
  // 광고팝업 (개선 — 닫기 버튼 위치 변동)
  // ─────────────────────────────────────────────────────────
  adPopup(x, y, size, alpha, closeButtonOffset = 0) {
    ctx.globalAlpha = alpha;
    // 팝업 배경
    ctx.fillStyle = '#FF6347';
    this.pixelRect(x - size, y - size * 0.7, size * 2, size * 1.4, '#FF6347');
    // 팝업 테두리
    ctx.strokeStyle = '#CC3300';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - size, y - size * 0.7, size * 2, size * 1.4);
    // 상단 바
    ctx.fillStyle = '#CC3300';
    this.pixelRect(x - size, y - size * 0.7, size * 2, size * 0.3, '#CC3300');
    // 텍스트
    ctx.fillStyle = COLORS.white;
    ctx.font = `bold ${size * 0.5}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('광고', x, y - size * 0.1);
    // 닫기 버튼 (위치가 계속 바뀜)
    const btnX = x + size * 0.5 + Math.sin(closeButtonOffset) * size * 0.3;
    const btnY = y - size * 0.55 + Math.cos(closeButtonOffset * 1.3) * size * 0.1;
    ctx.fillStyle = '#FF9999';
    this.pixelRect(btnX - size * 0.2, btnY - size * 0.12, size * 0.4, size * 0.24, '#FF9999');
    ctx.fillStyle = '#CC0000';
    ctx.font = `${size * 0.25}px Courier New`;
    ctx.fillText('✕', btnX, btnY);
    ctx.globalAlpha = 1;
  },

  // ─────────────────────────────────────────────────────────
  // 전신거울 보스 (HP 단계별 균열 추가)
  // ─────────────────────────────────────────────────────────
  mirrorBoss(x, y, size, hp, maxHp) {
    const hpRatio = hp / maxHp;

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(x, y + size * 0.9, size * 0.7, size * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // 거울 프레임
    ctx.fillStyle = '#C8B89A';
    this.pixelRect(x - size * 0.55, y - size * 1.1, size * 1.1, size * 2, '#C8B89A');
    // 프레임 장식
    ctx.fillStyle = '#A89070';
    this.pixelRect(x - size * 0.55, y - size * 1.1, size * 1.1, size * 0.08, '#A89070');
    this.pixelRect(x - size * 0.55, y + size * 0.82, size * 1.1, size * 0.08, '#A89070');

    // 거울 면 (반사 그라디언트)
    const grad = ctx.createLinearGradient(x - size * 0.45, y - size, x + size * 0.45, y + size * 0.8);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.3, 'rgba(200,220,255,0.7)');
    grad.addColorStop(0.7, 'rgba(180,200,240,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0.6)');
    this.pixelRect(x - size * 0.45, y - size * 0.95, size * 0.9, size * 1.7, '#E0E8FF');
    ctx.fillStyle = grad;
    ctx.fillRect(x - size * 0.45, y - size * 0.95, size * 0.9, size * 1.7);

    // 반사된 요랑 실루엣
    ctx.globalAlpha = 0.25;
    this.pixelCircle(x, y - size * 0.3, size * 0.25, COLORS.yorangHair);
    this.pixelRect(x - size * 0.15, y - size * 0.15, size * 0.3, size * 0.4, '#B8D4E8');
    ctx.globalAlpha = 1;

    // 균열 (HP에 따라 증가)
    ctx.strokeStyle = 'rgba(100,120,180,0.5)';
    ctx.lineWidth = 1;
    // 1단계 균열 (항상)
    ctx.beginPath();
    ctx.moveTo(x - size * 0.2, y - size * 0.5);
    ctx.lineTo(x + size * 0.1, y + size * 0.2);
    ctx.lineTo(x + size * 0.3, y - size * 0.1);
    ctx.stroke();
    // 2단계 균열 (HP 70% 이하)
    if (hpRatio < 0.7) {
      ctx.strokeStyle = 'rgba(100,120,180,0.65)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + size * 0.1, y - size * 0.7);
      ctx.lineTo(x - size * 0.15, y - size * 0.1);
      ctx.lineTo(x + size * 0.2, y + size * 0.4);
      ctx.stroke();
    }
    // 3단계 균열 (HP 40% 이하)
    if (hpRatio < 0.4) {
      ctx.strokeStyle = 'rgba(100,120,180,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.35, y - size * 0.3);
      ctx.lineTo(x + size * 0.05, y + size * 0.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + size * 0.3, y - size * 0.6);
      ctx.lineTo(x - size * 0.1, y + size * 0.3);
      ctx.stroke();
      // 빨간 균열 (위험 상태)
      ctx.strokeStyle = 'rgba(255,80,80,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.1, y - size * 0.8);
      ctx.lineTo(x + size * 0.25, y + size * 0.1);
      ctx.stroke();
    }
    // 4단계 (HP 10% 이하) — 거울 면 붉게 물듦
    if (hpRatio < 0.1) {
      ctx.fillStyle = 'rgba(255,50,50,0.15)';
      ctx.fillRect(x - size * 0.45, y - size * 0.95, size * 0.9, size * 1.7);
    }

    // HP바
    const barW = size * 1.4;
    const barH = 6;
    const barX = x - barW / 2;
    const barY = y - size * 1.3;
    this.pixelRect(barX, barY, barW, barH, '#FFB3B3');
    // HP 색상 (HP에 따라 변화)
    const hpColor = hpRatio > 0.5 ? '#FF4444' : hpRatio > 0.25 ? '#FF8800' : '#FF0000';
    this.pixelRect(barX, barY, barW * hpRatio, barH, hpColor);
    ctx.strokeStyle = COLORS.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);

    // 이름 태그
    this.textOutline('전신거울', x, barY - 8, 9, COLORS.white, COLORS.black);
  },

  // 임시 보스
  tempBoss(x, y, size, hp, maxHp, bossData) {
    const hpRatio = hp / maxHp;
    ctx.fillStyle = bossData.color;
    this.pixelCircle(x, y, size * 0.8, bossData.color);
    this.pixelCircle(x, y, size * 0.5, bossData.color + 'AA');
    ctx.fillStyle = COLORS.white;
    ctx.font = `bold ${size * 0.5}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x, y);

    const barW = size * 1.8;
    const barH = 6;
    const barX = x - barW / 2;
    const barY = y - size * 1.2;
    this.pixelRect(barX, barY, barW, barH, '#FFB3B3');
    const hpColor = hpRatio > 0.5 ? '#FF4444' : hpRatio > 0.25 ? '#FF8800' : '#FF0000';
    this.pixelRect(barX, barY, barW * hpRatio, barH, hpColor);
    ctx.strokeStyle = COLORS.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    this.textOutline(bossData.name, x, barY - 8, 9, COLORS.white, COLORS.black);
  },

  // ─────────────────────────────────────────────────────────
  // 배경 타일 (격자 + 소품)
  // ─────────────────────────────────────────────────────────
  drawBackground(bgColor, gameTimer) {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // 격자 (픽셀 느낌 — 배경 색에 맞게 조정)
    const isChzzk = bgColor === COLORS.bgChzzk;
    const isTwitch = bgColor === COLORS.bgTwitch;
    const gridAlpha = isTwitch ? 0.15 : isChzzk ? 0.2 : 0.18;
    const gridColor = isTwitch ? 'rgba(255,255,255,' + gridAlpha + ')' :
                      isChzzk  ? 'rgba(0,150,50,' + gridAlpha + ')' :
                                 'rgba(200,185,170,' + gridAlpha + ')';
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 0.5;
    for (let x = 0; x < GAME_W; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, 55); ctx.lineTo(x, GAME_H); ctx.stroke();
    }
    for (let y = 55; y < GAME_H; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_W, y); ctx.stroke();
    }

    // 치지직 배경 파티클 (작은 별/하트)
    if (isChzzk) {
      const t = gameTimer / 1000;
      for (let i = 0; i < 8; i++) {
        const px = ((i * 53 + t * 15) % GAME_W);
        const py = 60 + ((i * 79 + t * 8) % (GAME_H - 80));
        ctx.globalAlpha = 0.15 + (i % 3) * 0.08;
        ctx.fillStyle = '#2D8C3E';
        ctx.font = `${8 + (i % 3) * 4}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i % 2 === 0 ? '✦' : '♥', px, py);
        ctx.globalAlpha = 1;
      }
    }
    // 트위치 배경 파티클
    if (isTwitch) {
      const t = gameTimer / 1000;
      for (let i = 0; i < 6; i++) {
        const px = ((i * 67 + t * 10) % GAME_W);
        const py = 60 + ((i * 91 + t * 6) % (GAME_H - 80));
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `${6 + (i % 3) * 3}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦', px, py);
        ctx.globalAlpha = 1;
      }
    }
  },
};

// ============================================================
// ✨ 파티클 시스템
// ============================================================
class ParticleSystem {
  constructor() {
    this.particles = [];
    this.damageNumbers = [];
    this.levelUpEffects = [];
    this.equipEffects = [];
  }

  // 적 처치 파티클
  spawnDeathParticles(x, y, color, count = 5) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + randomRange(-0.3, 0.3);
      const speed = randomRange(40, 100);
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: randomRange(3, 6),
        color,
        alpha: 1,
        life: randomRange(300, 500),
        maxLife: 0,
        type: 'death',
      });
    }
  }

  // 장착 파티클 (별 모양)
  spawnEquipParticles(x, y, rarityColor) {
    for (let i = 0; i < 8; i++) {
      const angle = (Math.PI * 2 / 8) * i;
      const speed = randomRange(60, 120);
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 30,
        r: randomRange(2, 4),
        color: rarityColor,
        alpha: 1,
        life: randomRange(400, 700),
        maxLife: 0,
        type: 'equip',
        shape: 'star',
      });
    }
    this.equipEffects.push({ x, y, r: 0, maxR: 40, alpha: 0.8, color: rarityColor, timer: 300 });
  }

  // 대시 잔상
  spawnDashTrail(x, y) {
    this.particles.push({
      x, y,
      vx: 0, vy: 0,
      r: 10,
      color: COLORS.yorangHair,
      alpha: 0.5,
      life: 150,
      maxLife: 0,
      type: 'trail',
    });
  }

  // 데미지 숫자
  spawnDamageNumber(x, y, damage, color = '#FF4444') {
    this.damageNumbers.push({
      x: x + randomRange(-8, 8),
      y,
      vy: -60,
      text: String(Math.floor(damage)),
      color,
      alpha: 1,
      life: 700,
      size: damage >= 50 ? 13 : damage >= 20 ? 11 : 9,
    });
  }

  // 레벨업 이펙트
  spawnLevelUp(x, y) {
    this.levelUpEffects.push({ x, y, r: 0, alpha: 1, timer: 800 });
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 / 12) * i;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * 80,
        vy: Math.sin(angle) * 80 - 20,
        r: 3,
        color: COLORS.expBar,
        alpha: 1,
        life: 600,
        maxLife: 0,
        type: 'levelup',
      });
    }
  }

  update(dt) {
    // 파티클
    this.particles = this.particles.filter(p => {
      if (p.maxLife === 0) p.maxLife = p.life;
      p.life -= dt;
      p.x += p.vx * (dt / 1000);
      p.y += p.vy * (dt / 1000);
      p.vy += 120 * (dt / 1000); // 중력
      p.alpha = Math.max(0, p.life / p.maxLife);
      return p.life > 0;
    });

    // 데미지 숫자
    this.damageNumbers = this.damageNumbers.filter(d => {
      d.life -= dt;
      d.y += d.vy * (dt / 1000);
      d.vy += 30 * (dt / 1000);
      d.alpha = Math.max(0, d.life / 700);
      return d.life > 0;
    });

    // 레벨업 링
    this.levelUpEffects = this.levelUpEffects.filter(e => {
      e.timer -= dt;
      e.r += 150 * (dt / 1000);
      e.alpha = Math.max(0, e.timer / 800);
      return e.timer > 0;
    });

    // 장착 링
    this.equipEffects = this.equipEffects.filter(e => {
      e.timer -= dt;
      e.r += 100 * (dt / 1000);
      e.alpha = Math.max(0, e.timer / 300);
      return e.timer > 0;
    });
  }

  draw() {
    // 파티클
    this.particles.forEach(p => {
      ctx.globalAlpha = p.alpha;
      if (p.shape === 'star') {
        ctx.fillStyle = p.color;
        ctx.font = `${p.r * 2}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦', p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });

    // 레벨업 링
    this.levelUpEffects.forEach(e => {
      ctx.globalAlpha = e.alpha;
      ctx.strokeStyle = COLORS.expBar;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // 장착 링
    this.equipEffects.forEach(e => {
      ctx.globalAlpha = e.alpha;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // 데미지 숫자
    this.damageNumbers.forEach(d => {
      ctx.globalAlpha = d.alpha;
      ctx.font = `bold ${d.size}px 'Courier New'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeText(d.text, d.x, d.y);
      ctx.fillStyle = d.color;
      ctx.fillText(d.text, d.x, d.y);
      ctx.globalAlpha = 1;
    });
  }
}
