  drawTitleScreen(titleTimer) {
    // 배경
    ctx.fillStyle = '#FFF5E4';
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // 배경 격자
    ctx.strokeStyle = 'rgba(200,185,170,0.18)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < GAME_W; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GAME_H); ctx.stroke();
    }
    for (let y = 0; y < GAME_H; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_W, y); ctx.stroke();
    }

    // 별 장식 (부유)
    for (let i = 0; i < 20; i++) {
      const tx = (i * 73 + 30) % GAME_W;
      const ty = ((i * 97 + 50) % (GAME_H * 0.6)) + Math.sin(titleTimer / 1500 + i) * 4;
      ctx.fillStyle = `rgba(255,180,100,${0.2 + (i % 3) * 0.15})`;
      ctx.font = `${8 + (i % 3) * 4}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦', tx, ty);
    }

    // 타이틀 로고
    ctx.save();
    const titleScale = 1 + Math.sin(titleTimer / 1200) * 0.02;
    ctx.translate(GAME_W / 2, GAME_H * 0.22);
    ctx.scale(titleScale, titleScale);
    Draw.textOutline('요랑이의 모험', 0, 0, 26, '#C8884A', '#8B5E3C');
    ctx.restore();
    ctx.font = '11px Courier New';
    ctx.fillStyle = '#A09080';
    ctx.textAlign = 'center';
    ctx.fillText('치지직 버튜버 요랑 팬게임', GAME_W / 2, GAME_H * 0.22 + 28);

    // 요랑 캐릭터 (타이틀 전용 — 살짝 큰 사이즈)
    const yorangY = GAME_H * 0.48 + Math.sin(titleTimer / 800) * 3;
    Draw.yorang(GAME_W / 2, yorangY, false, null, titleTimer * 0.05);

    // 해랑이들 (주변 공전)
    const orbitR = 60;
    const orbitSpeed = titleTimer / 2000;
    for (let i = 0; i < 4; i++) {
      const angle = orbitSpeed + (Math.PI * 2 / 4) * i;
      const hx = GAME_W / 2 + Math.cos(angle) * orbitR;
      const hy = yorangY + Math.sin(angle) * orbitR * 0.4;
      const hSize = 10 + Math.sin(angle) * 2;
      Draw.harang(hx, hy, hSize, titleTimer * 0.08);
    }

    // 시작 버튼 (펄스)
    const btnPulse = 1 + Math.sin(titleTimer / 400) * 0.03;
    ctx.save();
    ctx.translate(GAME_W / 2, GAME_H * 0.7 + 23);
    ctx.scale(btnPulse, btnPulse);
    ctx.fillStyle = '#C8884A';
    ctx.beginPath();
    ctx.roundRect(-80, -23, 160, 46, 12);
    ctx.fill();
    ctx.strokeStyle = '#8B5E3C';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-80, -23, 160, 46, 12);
    ctx.stroke();
    Draw.textOutline('▶ 모험 시작!', 0, 0, 16, COLORS.white, '#8B5E3C');
    ctx.restore();

    // 비공식 안내
    ctx.font = '8px Courier New';
    ctx.fillStyle = '#C0B0A0';
    ctx.textAlign = 'center';
    ctx.fillText('비공식 팬게임 · 상업적 이용 없음', GAME_W / 2, GAME_H - 20);
    ctx.fillText('치지직 버튜버 요랑 (YoRang)', GAME_W / 2, GAME_H - 8);
  }
}

// ──────────────────────────────────────────────────────────
// Joystick
// ──────────────────────────────────────────────────────────
class Joystick {
  constructor() {
    this.active = false;
    this.baseX = 0;
    this.baseY = 0;
    this.stickX = 0;
    this.stickY = 0;
    this.dx = 0;
    this.dy = 0;
    this.maxRadius = 50;
    this.touchId = null;
  }

  draw() {
    if (!this.active) return;
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.baseX, this.baseY, this.maxRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = COLORS.uiBorder;
    ctx.beginPath();
    ctx.arc(this.stickX, this.stickY, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// 🎮 메인 게임 클래스
// ============================================================
class Game {
  constructor() {
    this.state = GameState.TITLE;
    this.player = null;
    this.monsters = [];
    this.bosses = [];
    this.projectiles = [];
    this.droppedItems = [];
    this.spawnPads = [];
    this.skillSystem = null;
    this.particles = new ParticleSystem();
    this.ui = new UISystem(this);
    this.joystick = new Joystick();
    this.gameTimer = 0;
    this.killCount = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 2500;
    this.bgColor = COLORS.bg;
    this.bgTransitionTimer = 0;
    this.bgTransitionFrom = COLORS.bg;
    this.bgTransitionTo = COLORS.bg;
    this.twitchEventDone = false;
    this.turkeyHarangTimer = 0;
    this.showTurkeyHarang = false;
    this.finalBossSpawned = false;
    this.clearStats = null;
    this.titleTimer = 0;

    this._bindEvents();
    this._loop();
  }

  _bindEvents() {
    canvas.addEventListener('touchstart', e => { e.preventDefault(); this._onTouchStart(e); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); this._onTouchMove(e); }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); this._onTouchEnd(e); }, { passive: false });
    canvas.addEventListener('mousedown', e => { this._onMouseDown(e); });
    canvas.addEventListener('mousemove', e => { this._onMouseMove(e); });
    canvas.addEventListener('mouseup', e => { this._onMouseUp(e); });

    this._keys = {};
    window.addEventListener('keydown', e => {
      this._keys[e.code] = true;
      if ((e.code === 'Escape' || e.code === 'KeyP') && this.state === GameState.PLAYING) {
        this.state = GameState.PAUSED;
        this.ui.pauseViewingItem = null;
      } else if ((e.code === 'Escape' || e.code === 'KeyP') && this.state === GameState.PAUSED) {
        this.state = GameState.PLAYING;
      }
      if (e.code === 'Enter' && this.state === GameState.TITLE) this.startGame();
      if (e.code === 'KeyR' && (this.state === GameState.CLEAR || this.state === GameState.GAMEOVER)) {
        this.state = GameState.TITLE;
      }
    });
    window.addEventListener('keyup', e => { this._keys[e.code] = false; });
  }

  _updateKeyboardJoystick() {
    if (this.state !== GameState.PLAYING) return;
    if (this.joystick.touchId !== null) return;

    const left  = this._keys['KeyA'] || this._keys['ArrowLeft'];
    const right = this._keys['KeyD'] || this._keys['ArrowRight'];
    const up    = this._keys['KeyW'] || this._keys['ArrowUp'];
    const down  = this._keys['KeyS'] || this._keys['ArrowDown'];

    let dx = 0, dy = 0;
    if (left)  dx -= 1;
    if (right) dx += 1;
    if (up)    dy -= 1;
    if (down)  dy += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      this.joystick.active = true;
      this.joystick.dx = dx / len;
      this.joystick.dy = dy / len;
    } else {
      if (this.joystick.touchId === null) {
        this.joystick.active = false;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
    }
  }

  _getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = GAME_W / rect.width;
    const scaleY = GAME_H / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  _onTouchStart(e) {
    for (const t of e.changedTouches) {
      const pos = this._getCanvasPos(t.clientX, t.clientY);
      this._handleTap(pos.x, pos.y, t.identifier);
    }
    for (const t of e.changedTouches) {
      const pos = this._getCanvasPos(t.clientX, t.clientY);
      if (pos.y > GAME_H / 2 && this.joystick.touchId === null && this.state === GameState.PLAYING) {
        this.joystick.touchId = t.identifier;
        this.joystick.active = true;
        this.joystick.baseX = pos.x;
        this.joystick.baseY = pos.y;
        this.joystick.stickX = pos.x;
        this.joystick.stickY = pos.y;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
    }
  }

  _onTouchMove(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === this.joystick.touchId) {
        const pos = this._getCanvasPos(t.clientX, t.clientY);
        const rawDx = pos.x - this.joystick.baseX;
        const rawDy = pos.y - this.joystick.baseY;
        const d = Math.hypot(rawDx, rawDy);
        if (d > this.joystick.maxRadius) {
          this.joystick.stickX = this.joystick.baseX + (rawDx / d) * this.joystick.maxRadius;
          this.joystick.stickY = this.joystick.baseY + (rawDy / d) * this.joystick.maxRadius;
          this.joystick.dx = rawDx / d;
          this.joystick.dy = rawDy / d;
        } else {
          this.joystick.stickX = pos.x;
          this.joystick.stickY = pos.y;
          this.joystick.dx = rawDx / this.joystick.maxRadius;
          this.joystick.dy = rawDy / this.joystick.maxRadius;
        }
      }
    }
  }

  _onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === this.joystick.touchId) {
        this.joystick.active = false;
        this.joystick.touchId = null;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
    }
  }

  _onMouseDown(e) {
    const pos = this._getCanvasPos(e.clientX, e.clientY);
    this._handleTap(pos.x, pos.y, 'mouse');
    if (pos.y > GAME_H / 2 && this.state === GameState.PLAYING) {
      this.joystick.touchId = 'mouse';
      this.joystick.active = true;
      this.joystick.baseX = pos.x;
      this.joystick.baseY = pos.y;
      this.joystick.stickX = pos.x;
      this.joystick.stickY = pos.y;
      this.joystick.dx = 0;
      this.joystick.dy = 0;
    }
  }

  _onMouseMove(e) {
    if (this.joystick.touchId === 'mouse') {
      const pos = this._getCanvasPos(e.clientX, e.clientY);
      const rawDx = pos.x - this.joystick.baseX;
      const rawDy = pos.y - this.joystick.baseY;
      const d = Math.hypot(rawDx, rawDy);
      if (d > this.joystick.maxRadius) {
        this.joystick.stickX = this.joystick.baseX + (rawDx / d) * this.joystick.maxRadius;
        this.joystick.stickY = this.joystick.baseY + (rawDy / d) * this.joystick.maxRadius;
        this.joystick.dx = rawDx / d;
        this.joystick.dy = rawDy / d;
      } else {
        this.joystick.stickX = pos.x;
        this.joystick.stickY = pos.y;
        this.joystick.dx = rawDx / this.joystick.maxRadius;
        this.joystick.dy = rawDy / this.joystick.maxRadius;
      }
    }
  }

  _onMouseUp(e) {
    if (this.joystick.touchId === 'mouse') {
      this.joystick.active = false;
      this.joystick.touchId = null;
      this.joystick.dx = 0;
      this.joystick.dy = 0;
    }
  }

  _handleTap(x, y, touchId) {
    switch (this.state) {
      case GameState.TITLE:
        if (x > GAME_W / 2 - 80 && x < GAME_W / 2 + 80 && y > GAME_H * 0.7 && y < GAME_H * 0.7 + 46) {
          this.startGame();
        }
        break;

      case GameState.PLAYING:
        if (x > GAME_W - 38 && x < GAME_W && y > 5 && y < 55) {
          this.state = GameState.PAUSED;
          this.ui.pauseViewingItem = null;
          return;
        }
        if (y > 5 && y < 55 && x < GAME_W - 40) {
          const skillIds = Object.keys(SKILLS_DATA);
          const iconW = (GAME_W - 40) / skillIds.length;
          const idx = Math.floor(x / iconW);
          if (idx >= 0 && idx < skillIds.length) {
            const skillId = skillIds[idx];
            const skill = SKILLS_DATA[skillId];
            const p = this.player;
            const sx = idx * iconW + 2;
            const sy = 7;
            const sw = iconW - 4;
            const sh = 46;
            if (x > sx + sw - 12 && x < sx + sw && y > sy + sh - 12 && y < sy + sh) {
              p.upgradeSkill(skillId);
            } else {
              p.toggleSkill(skillId);
            }
          }
        }
        if (this.ui.itemFlashTimer > 0 && this.ui.itemFlashData) {
          const CARD_Y  = GAME_H - 165;
          const CARD_H  = 150;
          const CARD_X  = 20;
          const CARD_W  = GAME_W - 40;
          const BTN_Y   = CARD_Y + 84;
          const BTN_H   = 34;
          const BTN_GAP = 8;
          const btnW    = (CARD_W - BTN_GAP * 3) / 2;

          if (x >= CARD_X && x <= CARD_X + CARD_W && y >= CARD_Y && y <= CARD_Y + CARD_H) {
            if (y >= BTN_Y && y <= BTN_Y + BTN_H) {
              if (x >= CARD_X + BTN_GAP && x <= CARD_X + BTN_GAP + btnW) {
                if (this.ui._pendingEquip) {
                  this.ui.equipCurrent();
                  // 장착 파티클
                  const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
                  this.particles.spawnEquipParticles(this.player.x, this.player.y, rarityColors[this.ui.itemFlashData?.rarity] || '#FFFFFF');
                } else {
                  this.state = GameState.PAUSED;
                  this.ui.pauseViewingItem = this.ui.itemFlashData;
                }
                return;
              }
              if (x >= CARD_X + BTN_GAP * 2 + btnW && x <= CARD_X + BTN_GAP * 2 + btnW * 2) {
                this.ui.dismissCurrent();
                return;
              }
            }
            return;
          }
        }
        break;

      case GameState.PAUSED:
        if (this.ui.pauseViewingItem) {
          if (x > GAME_W / 2 - 50 && x < GAME_W / 2 + 50 && y > GAME_H - 100 && y < GAME_H - 68) {
            this.ui.pauseViewingItem = null;
          }
        } else {
          const slots = ['weapon', 'head', 'armor', 'boots'];
          slots.forEach((slot, i) => {
            const iy = 158 + i * 44;
            if (x > 30 && x < GAME_W - 30 && y > iy && y < iy + 38) {
              const item = this.player.equipment[slot];
              if (item) this.ui.pauseViewingItem = item;
            }
          });
          const btnY = GAME_H - 120;
          if (x > GAME_W / 2 - 70 && x < GAME_W / 2 + 70 && y > btnY && y < btnY + 38) {
            this.state = GameState.PLAYING;
          }
        }
        break;

      case GameState.CLEAR:
      case GameState.GAMEOVER:
        if (x > GAME_W / 2 - 70 && x < GAME_W / 2 + 70 && y > GAME_H - 120 && y < GAME_H - 80) {
          this.state = GameState.TITLE;
        }
        break;
    }
  }

  startGame() {
    this.player = new Player();
    this.monsters = [];
    this.bosses = [];
    this.projectiles = [];
    this.droppedItems = [];
    this.spawnPads = SPAWN_PADS.map(d => new SpawnPad(d));
    this.skillSystem = new SkillSystem(this.player, this.projectiles, this.monsters, this.bosses);
    this.particles = new ParticleSystem();
    this.gameTimer = 0;
    this.killCount = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 2500;
    this.bgColor = COLORS.bg;
    this.bgTransitionTimer = 0;
    this.twitchEventDone = false;
    this.turkeyHarangTimer = 0;
    this.showTurkeyHarang = false;
    this.finalBossSpawned = false;
    this.clearStats = null;
    this.state = GameState.PLAYING;
    SFX.gameStart();
  }

  update(dt) {
    switch (this.state) {
      case GameState.TITLE:
        this.titleTimer += dt;
        break;
      case GameState.PLAYING:
        this._updatePlaying(dt);
        break;
      case GameState.PAUSED:
        this.ui.update(dt);
        break;
    }
  }

  _updatePlaying(dt) {
    this.gameTimer += dt;
    this.ui.update(dt);
    this.particles.update(dt);

    // 배경 전환 타이머
    if (this.bgTransitionTimer > 0) {
      this.bgTransitionTimer -= dt;
      // 부드러운 색상 전환
      const t = 1 - this.bgTransitionTimer / 3000;
      if (t < 0.5) {
        this.bgColor = lerpColor(COLORS.bg, COLORS.bgTwitch, t * 2);
      } else {
        this.bgColor = lerpColor(COLORS.bgTwitch, COLORS.bgChzzk, (t - 0.5) * 2);
      }
    }

    // 터키 해랑이 타이머
    if (this.showTurkeyHarang) {
      this.turkeyHarangTimer -= dt;
      if (this.turkeyHarangTimer <= 0) this.showTurkeyHarang = false;
    }

    // 트위치 이벤트 (90초)
    if (!this.twitchEventDone && this.gameTimer >= 90000) {
      this.twitchEventDone = true;
      this._spawnTwitchEvent();
    }

    // 최종 보스 (240초)
    if (!this.finalBossSpawned && this.gameTimer >= 240000) {
      this._spawnFinalBoss();
    }

    this._updateKeyboardJoystick();
    this.player.update(dt, this.joystick);
    this.skillSystem.update(dt);

    // 몬스터 스폰
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer = 0;
      const elapsed = this.gameTimer / 1000;
      const batchCount = 1 + Math.floor(elapsed / 60);
      for (let i = 0; i < batchCount; i++) this._spawnMonster();
      this.spawnInterval = Math.max(500, 2500 - elapsed * 16);
    }

    this.monsters.forEach(m => m.update(dt, this.player));

    // 몬스터 간 겹침 방지
    for (let i = 0; i < this.monsters.length; i++) {
      const a = this.monsters[i];
      if (a.isDead) continue;
      for (let j = i + 1; j < this.monsters.length; j++) {
        const b = this.monsters[j];
        if (b.isDead) continue;
        const minDist = (a.size + b.size) * 0.7;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minDist) {
          const push = (minDist - d) * 0.3;
          const nx = dx / d;
          const ny = dy / d;
          a.x -= nx * push * 0.5;
          a.y -= ny * push * 0.5;
          b.x += nx * push * 0.5;
          b.y += ny * push * 0.5;
          a.x = clamp(a.x, a.size, GAME_W - a.size);
          a.y = clamp(a.y, 80 + a.size, GAME_H - a.size);
          b.x = clamp(b.x, b.size, GAME_W - b.size);
          b.y = clamp(b.y, 80 + b.size, GAME_H - b.size);
        }
      }
    }

    this.monsters = this.monsters.filter(m => {
      if (m.isDead && m.deathTimer > 400) {
        // 처치 파티클
        this.particles.spawnDeathParticles(m.x, m.y, m.color, 4);
        SFX.kill();
        const leveledUp = this.player.gainXP(m.data.xp);
        if (leveledUp) {
          this.particles.spawnLevelUp(this.player.x, this.player.y);
          this.ui.showLevelUp(this.player.level);
          SFX.levelUp();
        }
        this.killCount++;
        this.ui.onKill();
        // 데미지 숫자 (처치 시 XP 표시)
        this.particles.spawnDamageNumber(m.x, m.y - 10, m.data.xp, '#7BC47F');
        return false;
      }
      return true;
    });

    // 보스-몬스터 간 겹침 방지
    for (const boss of this.bosses) {
      if (boss.isDead) continue;
      for (const m of this.monsters) {
        if (m.isDead) continue;
        const minD = (boss.size + m.size) * 0.75;
        const dx = m.x - boss.x;
        const dy = m.y - boss.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minD) {
          const push = (minD - d) * 0.4;
          const nx = dx / d;
          const ny = dy / d;
          m.x += nx * push;
          m.y += ny * push;
          m.x = clamp(m.x, m.size, GAME_W - m.size);
          m.y = clamp(m.y, 80 + m.size, GAME_H - m.size);
        }
      }
      for (const other of this.bosses) {
        if (other === boss || other.isDead) continue;
        const minD = (boss.size + other.size) * 0.8;
        const dx = other.x - boss.x;
        const dy = other.y - boss.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minD) {
          const push = (minD - d) * 0.25;
          const nx = dx / d;
          const ny = dy / d;
          boss.x -= nx * push * 0.5;
          boss.y -= ny * push * 0.5;
          other.x += nx * push * 0.5;
          other.y += ny * push * 0.5;
        }
      }
    }

    this.bosses.forEach(b => b.update(dt, this.player));
    this.bosses = this.bosses.filter(b => {
      if (b.isDead && b.deathTimer > 600) {
        // 보스 처치 파티클 (더 화려하게)
        this.particles.spawnDeathParticles(b.x, b.y, b.data.color, 12);
        SFX.bossKill();
        const leveledUp = this.player.gainXP(b.data.xp);
        if (leveledUp) {
          this.particles.spawnLevelUp(this.player.x, this.player.y);
          this.ui.showLevelUp(this.player.level);
          SFX.levelUp();
        }
        this.killCount++;
        this.ui.onKill();
        this._dropBossLoot(b);
        const pad = this.spawnPads.find(p => p.bossId === b.id);
        if (pad) { pad.isSummoned = false; pad.chargeTimer = 0; }
        if (b.id === 'final_boss') this._triggerClear();
        return false;
      }
      return true;
    });

    this.projectiles.forEach(p => p.update(dt));
    this.projectiles = this.projectiles.filter(p => !p.isDead);

    this._checkProjectileCollisions();
    this._checkOrbShardCollisions();
    this._checkShieldCollisions();
    this._checkPlayerCollisions();

    this.spawnPads.forEach(pad => {
      pad.update(dt, this.player.x, this.player.y);
      if (pad.isCharged && !pad.isSummoned) {
        pad.isSummoned = true;
        pad.chargeTimer = 0;
        pad.isCharged = false;
        this._spawnBoss(pad.bossId, pad.x, pad.y);
      }
    });

    this.droppedItems.forEach(item => item.update(dt));
    this.droppedItems = this.droppedItems.filter(item => {
      if (item.isPicked) return false;
      if (dist(this.player, item) < item.radius + this.player.radius - 4) {
        this._pickupItem(item.data);
        item.isPicked = true;
        return false;
      }
      return true;
    });

    if (this.player.hp <= 0) this._triggerGameOver();
  }

  _spawnMonster() {
    const elapsed = this.gameTimer / 1000;
    const available = MONSTERS_DATA.filter(d => d.spawnFrom <= elapsed);
    if (!available.length) return;

    const totalWeight = available.reduce((s, d) => s + d.spawnWeight, 0);
    let rand = Math.random() * totalWeight;
    let chosen = available[0];
    for (const d of available) {
      rand -= d.spawnWeight;
      if (rand <= 0) { chosen = d; break; }
    }

    const edge = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 20;
    switch (edge) {
      case 0: x = randomRange(margin, GAME_W - margin); y = 80 + margin; break;
      case 1: x = GAME_W - margin; y = randomRange(80 + margin, GAME_H - margin); break;
      case 2: x = randomRange(margin, GAME_W - margin); y = GAME_H - margin; break;
      case 3: x = margin; y = randomRange(80 + margin, GAME_H - margin); break;
    }

    const count = chosen.behavior === 'group_charge' ? randomInt(2, 4) : 1;
    for (let i = 0; i < count; i++) {
      this.monsters.push(new Monster(chosen, x + randomRange(-20, 20), y + randomRange(-20, 20)));
    }
  }

  _spawnBoss(bossId, padX, padY) {
    const data = BOSSES_DATA[bossId];
    if (!data) return;
    const cx = clamp(padX, data.size + 10, GAME_W - data.size - 10);
    const cy = clamp(padY, 80 + data.size + 10, GAME_H - data.size - 10);
    const level = this.player.level;
    const hpScale = Math.min(3.0, 1.0 + (level - 1) * 0.08);
    const scaledData = { ...data, hp: Math.floor(data.hp * hpScale) };
    this.bosses.push(new Boss(scaledData, cx, cy));
  }

  _spawnFinalBoss() {
    if (this.finalBossSpawned) return;
    this.finalBossSpawned = true;
    this.bosses.push(new Boss(BOSSES_DATA.final_boss, GAME_W / 2, GAME_H / 2 - 60));
  }

  _spawnTwitchEvent() {
    const twitchData = {
      ...MONSTERS_DATA.find(d => d.id === 'ad_popup'),
      id: 'twitch_popup',
      name: '트위치 서비스 종료',
      hp: 150,
      color: '#9147FF',
      lore: '트위치가 한국에서 철수합니다.',
    };
    this.monsters.push(new Monster(twitchData, GAME_W / 2, 100));
  }

  _checkProjectileCollisions() {
    const targets = [...this.monsters, ...this.bosses];
    this.projectiles.forEach(proj => {
      if (proj.isDead) return;
      targets.forEach(target => {
        if (target.isDead) return;
        if (proj.hitTargets.has(target)) return;
        if (dist(proj, target) < proj.size + target.size * 0.8) {
          const dmg = proj.damage;
          target.takeDamage(dmg);
          // 데미지 숫자
          this.particles.spawnDamageNumber(target.x, target.y - target.size, dmg);
          this.skillSystem.hitEffects.push({ x: target.x, y: target.y, r: 3, timer: 200, color: proj.color });
          if (proj.onHit) {
            proj.onHit(target);
            proj.isDead = true;
            return;
          }
          if (!proj.pierce) {
            proj.isDead = true;
          } else {
            proj.hitTargets.add(target);
          }
          if (target.isDead && target.id === 'twitch_popup') {
            this._triggerBgTransition();
          }
        }
      });
    });
    this.projectiles = this.projectiles.filter(p => !p.isDead);
  }

  _checkOrbShardCollisions() {
    const targets = [...this.monsters, ...this.bosses];
    this.projectiles.forEach(proj => {
      if (proj.skillId !== 'frozen_orb' || proj.isDead || proj._exploded) return;
      if (!proj._getOrbitPositions) return;
      const positions = proj._getOrbitPositions();
      positions.forEach(pos => {
        targets.forEach(target => {
          if (target.isDead) return;
          if (dist(pos, target) < 6 + target.size * 0.6) {
            const dmg = proj.damage * 0.3;
            target.takeDamage(dmg);
            this.skillSystem.hitEffects.push({ x: target.x, y: target.y, r: 3, timer: 150, color: '#87CEEB' });
          }
        });
      });
    });
  }

  _checkShieldCollisions() {
    if (!this.player.activeSkillQueue.includes('energy_shield')) return;
    const orbPositions = this.player.getShieldOrbPositions();
    const targets = [...this.monsters, ...this.bosses];
    const skillLevel = this.player.skillLevels['energy_shield'];
    const dmg = SKILLS_DATA.energy_shield.damage[Math.max(0, skillLevel - 1)];

    orbPositions.forEach(orb => {
      targets.forEach(target => {
        if (target.isDead) return;
        if (dist(orb, target) < 12 + target.size * 0.7) {
          const dx = target.x - this.player.x;
          const dy = target.y - this.player.y;
          const d = Math.hypot(dx, dy) || 1;
          target.x += (dx / d) * 30;
          target.y += (dy / d) * 30;
          target.takeDamage(dmg * 0.1);
        }
      });
    });
  }

  _checkPlayerCollisions() {
    const targets = [...this.monsters, ...this.bosses];
    targets.forEach(target => {
      if (target.isDead) return;
      if (dist(this.player, target) < this.player.radius + target.size * 0.7) {
        this.player.takeDamage(target.damage * 0.016);
      }
    });
  }

  _pickupItem(itemData) {
    const currentItem = this.player.equipment[itemData.slot];
    SFX.itemPickup(itemData.rarity);
    if (!currentItem) {
      this.player.equipItem(itemData);
      this.ui.showItemFlash(itemData);
      SFX.itemEquip();
      // 자동 장착 파티클
      const rarityColors = { common: '#98FB98', rare: '#87CEEB', epic: '#DDA0DD', legendary: '#FFD700' };
      this.particles.spawnEquipParticles(this.player.x, this.player.y, rarityColors[itemData.rarity] || '#FFFFFF');
    } else {
      this.ui.showItemFlash(itemData, true);
    }
  }

  _dropBossLoot(boss) {
    const table = boss.data.dropTable;
    if (!table || !table.length) return;
    const dropCount = 2;
    const shuffled = [...table].sort(() => Math.random() - 0.5);
    for (let i = 0; i < Math.min(dropCount, shuffled.length); i++) {
      const itemId = shuffled[i];
      let itemData = null;
      for (const slot of Object.values(ITEMS_DATA)) {
        const found = slot.find(item => item.id === itemId);
        if (found) { itemData = found; break; }
      }
      if (itemData) {
        const angle = (Math.PI * 2 / dropCount) * i;
        const r = 40;
        this.droppedItems.push(new DroppedItem(
          itemData,
          boss.x + Math.cos(angle) * r,
          boss.y + Math.sin(angle) * r
        ));
      }
    }
  }

  _triggerBgTransition() {
    this.bgTransitionTimer = 3000;
    this.showTurkeyHarang = true;
    this.turkeyHarangTimer = 3500;
  }

  _triggerClear() {
    const elapsed = Math.floor(this.gameTimer / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    const eq = this.player.equipment;
    this.clearStats = {
      time: `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      kills: this.killCount,
      level: this.player.level,
      equipment: [eq.weapon, eq.head, eq.armor, eq.boots].filter(Boolean),
    };
    this.state = GameState.CLEAR;
    SFX.clear();
  }

  _triggerGameOver() {
    const elapsed = Math.floor(this.gameTimer / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    this.clearStats = {
      time: `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      kills: this.killCount,
    };
    this.state = GameState.GAMEOVER;
    SFX.gameOver();
  }

  draw() {
    ctx.clearRect(0, 0, GAME_W, GAME_H);

    switch (this.state) {
      case GameState.TITLE:
        this.ui.drawTitleScreen(this.titleTimer);
        break;
      case GameState.PLAYING:
      case GameState.PAUSED:
        this._drawWorld();
        this.ui.drawHUD();
        if (this.state === GameState.PAUSED) this.ui.drawPauseScreen();
        break;
      case GameState.CLEAR:
        this._drawWorld();
        this.ui.drawClearScreen(this.clearStats);
        break;
      case GameState.GAMEOVER:
        this._drawWorld();
        this.ui.drawGameOverScreen(this.clearStats);
        break;
    }
  }

  _drawWorld() {
    // 배경 (개선된 타일 + 파티클)
    Draw.drawBackground(this.bgColor, this.gameTimer);

    // 배경 전환 텍스트
    if (this.bgTransitionTimer > 0) {
      const t = this.bgTransitionTimer / 3000;
      ctx.globalAlpha = Math.min(1, t > 0.7 ? (t - 0.7) / 0.3 : t < 0.2 ? t / 0.2 : 1) * 0.85;
      if (t > 0.5) {
        Draw.textOutline('트위치 서비스가 종료됩니다...', GAME_W / 2, GAME_H / 2 - 20, 12, '#FFFFFF', '#6441A4');
      } else {
        Draw.textOutline('치지직으로 이전합니다! 🌿', GAME_W / 2, GAME_H / 2 - 20, 12, '#2D8C3E', '#FFFFFF');
      }
      ctx.globalAlpha = 1;
    }

    // 터키 해랑이
    if (this.showTurkeyHarang) {
      const t = this.turkeyHarangTimer / 3500;
      const ty = GAME_H * 0.6;
      const tx = t > 0.5 ? GAME_W * 0.75 : GAME_W * 0.75 + (0.5 - t) / 0.5 * 60;
      ctx.globalAlpha = Math.min(1, t > 0.8 ? (t - 0.8) / 0.2 : t < 0.15 ? t / 0.15 : 1);
      Draw.harang(tx, ty, 20, this.gameTimer * 0.08);
      if (t > 0.2 && t < 0.8) {
        ctx.fillStyle = COLORS.white;
        ctx.beginPath();
        ctx.roundRect(tx - 55, ty - 55, 110, 30, 8);
        ctx.fill();
        ctx.strokeStyle = COLORS.harangYellow;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(tx - 55, ty - 55, 110, 30, 8);
        ctx.stroke();
        ctx.font = '8px Courier New';
        ctx.fillStyle = COLORS.black;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('드디어 볼 수 있어요! 🌍', tx, ty - 40);
      }
      ctx.globalAlpha = 1;
    }

    // 발판
    this.spawnPads.forEach(pad => pad.draw());

    // 드롭 아이템
    this.droppedItems.forEach(item => item.draw());

    // 스킬 이펙트 (하단)
    this.skillSystem.drawEffects();

    // 투사체
    this.projectiles.forEach(p => p.draw());

    // 파티클 (몬스터 아래)
    this.particles.draw();

    // 몬스터
    this.monsters.forEach(m => m.draw());

    // 보스
    this.bosses.forEach(b => b.draw());

    // 히트 이펙트
    this.skillSystem.drawHitEffectsOnly();

    // 플레이어
    this.player.draw();

    // 조이스틱
    this.joystick.draw();
  }

  _loop() {
    let lastTime = 0;
    const tick = (timestamp) => {
      const dt = Math.min(timestamp - lastTime, 50);
      lastTime = timestamp;
      this.update(dt);
      this.draw();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

// ============================================================
// 🔧 터치 포지션 헬퍼
// ============================================================
function getTouchPos(touch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = GAME_W / rect.width;
  const scaleY = GAME_H / rect.height;
  return {
    x: (touch.clientX - rect.left) * scaleX,
    y: (touch.clientY - rect.top) * scaleY,
    identifier: touch.identifier,
  };
}

// ============================================================
// 🔊 효과음 시스템 (Web Audio API — 프로시저럴)
// ============================================================
const SFX = (() => {
  let _ctx = null;
  let _enabled = true;

  function _getCtx() {
    if (!_ctx) {
      try { _ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    // 브라우저 자동재생 정책: 첫 인터랙션 후 resume
    if (_ctx && _ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  }

  // 기본 오실레이터 재생 헬퍼
  function _play(opts) {
    if (!_enabled) return;
    const ac = _getCtx();
    if (!ac) return;

    const {
      type = 'square',       // 파형
      freq = 440,            // 시작 주파수
      freqEnd,               // 끝 주파수 (슬라이드)
      duration = 0.12,       // 재생 시간(초)
      volume = 0.18,         // 볼륨 (0~1)
      attack = 0.005,        // 어택
      decay = 0.08,          // 디케이
      detune = 0,            // 디튠
      filterFreq,            // 로우패스 필터 주파수
    } = opts;

    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== undefined) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), now + duration);
    }
    if (detune) osc.detune.setValueAtTime(detune, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume, now + attack);
    gain.gain.exponentialRampToValueAtTime(0.001, now + attack + decay);

    let node = osc;

    if (filterFreq) {
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      osc.connect(filter);
      filter.connect(gain);
    } else {
      osc.connect(gain);
    }

    gain.connect(ac.destination);
    osc.start(now);
    osc.stop(now + duration + 0.05);
  }

  // 노이즈 버스트 (피격, 폭발 등)
  function _noise(opts) {
    if (!_enabled) return;
    const ac = _getCtx();
    if (!ac) return;

    const { duration = 0.08, volume = 0.12, filterFreq = 800 } = opts;
    const bufSize = Math.floor(ac.sampleRate * duration);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const src = ac.createBufferSource();
    src.buffer = buf;

    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, ac.currentTime);
    filter.Q.setValueAtTime(1.5, ac.currentTime);

    const gain = ac.createGain();
    const now = ac.currentTime;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    src.start(now);
  }

  return {
    enable()  { _enabled = true; },
    disable() { _enabled = false; },
    toggle()  { _enabled = !_enabled; return _enabled; },
    get enabled() { return _enabled; },

    // ── 전투 ──────────────────────────────────────────────

    // 기본 공격 (전완근 펀치)
    punch() {
      _play({ type: 'square', freq: 180, freqEnd: 80, duration: 0.08, volume: 0.14, decay: 0.06 });
      _noise({ duration: 0.05, volume: 0.08, filterFreq: 600 });
    },

    // 기본 투사체 발사 (검/마이크/브러시)
    shoot(weaponType = 'sword') {
      const map = {
        sword:  { freq: 520, freqEnd: 280, type: 'sawtooth', volume: 0.12, duration: 0.09 },
        mic:    { freq: 660, freqEnd: 440, type: 'sine',     volume: 0.10, duration: 0.10 },
        brush:  { freq: 440, freqEnd: 330, type: 'triangle', volume: 0.10, duration: 0.09 },
      };
      _play(map[weaponType] || map.sword);
    },

    // 적 피격
    hit() {
      _noise({ duration: 0.06, volume: 0.15, filterFreq: 1200 });
      _play({ type: 'square', freq: 220, freqEnd: 110, duration: 0.06, volume: 0.08, decay: 0.05 });
    },

    // 적 처치
    kill() {
      _play({ type: 'square', freq: 330, freqEnd: 110, duration: 0.12, volume: 0.16, decay: 0.10 });
      _noise({ duration: 0.08, volume: 0.10, filterFreq: 900 });
    },

    // 플레이어 피격
    playerHit() {
      _noise({ duration: 0.12, volume: 0.22, filterFreq: 400 });
      _play({ type: 'sawtooth', freq: 160, freqEnd: 60, duration: 0.15, volume: 0.18, decay: 0.12 });
    },

    // 프로즌 오브 발사
    frozenOrb() {
      _play({ type: 'sine', freq: 880, freqEnd: 440, duration: 0.18, volume: 0.13, decay: 0.15, filterFreq: 2000 });
      _play({ type: 'triangle', freq: 660, freqEnd: 330, duration: 0.14, volume: 0.08, decay: 0.12, detune: 7 });
    },

    // 프로즌 오브 폭발
    frozenOrbExplode() {
      _noise({ duration: 0.18, volume: 0.18, filterFreq: 1800 });
      _play({ type: 'sine', freq: 440, freqEnd: 110, duration: 0.22, volume: 0.14, decay: 0.18 });
    },

    // 노바 (여우 기운 폭발)
    nova() {
      _noise({ duration: 0.25, volume: 0.20, filterFreq: 600 });
      _play({ type: 'sine', freq: 220, freqEnd: 55, duration: 0.30, volume: 0.16, decay: 0.25 });
      _play({ type: 'triangle', freq: 440, freqEnd: 110, duration: 0.20, volume: 0.10, decay: 0.18, detune: -5 });
    },

    // 체인 라이트닝 발사
    chainLightning() {
      _play({ type: 'sawtooth', freq: 1200, freqEnd: 600, duration: 0.10, volume: 0.12, decay: 0.08 });
      _play({ type: 'square',   freq: 800,  freqEnd: 400, duration: 0.08, volume: 0.08, decay: 0.06, detune: 12 });
    },

    // 체인 연쇄 점프
    chainJump() {
      _play({ type: 'sawtooth', freq: 900, freqEnd: 450, duration: 0.07, volume: 0.09, decay: 0.05 });
    },

    // 라이트닝 퓨리 발사
    lightningFury() {
      _play({ type: 'sawtooth', freq: 660, freqEnd: 330, duration: 0.12, volume: 0.13, decay: 0.09 });
      _noise({ duration: 0.06, volume: 0.08, filterFreq: 2000 });
    },

    // 번개 분열
    lightningFurySplit() {
      _play({ type: 'square', freq: 550, freqEnd: 275, duration: 0.08, volume: 0.09, decay: 0.06 });
    },

    // ── UI / 시스템 ────────────────────────────────────────

    // 레벨업
    levelUp() {
      const ac = _getCtx();
      if (!ac || !_enabled) return;
      const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        setTimeout(() => {
          _play({ type: 'triangle', freq, duration: 0.18, volume: 0.16, decay: 0.14, attack: 0.01 });
        }, i * 80);
      });
    },

    // 아이템 획득
    itemPickup(rarity = 'common') {
      const map = {
        common:    { freq: 660, freqEnd: 880, duration: 0.12, volume: 0.13 },
        rare:      { freq: 784, freqEnd: 1047, duration: 0.14, volume: 0.14 },
        epic:      { freq: 880, freqEnd: 1175, duration: 0.16, volume: 0.15 },
        legendary: { freq: 1047, freqEnd: 1568, duration: 0.20, volume: 0.17 },
      };
      const opt = map[rarity] || map.common;
      _play({ type: 'triangle', ...opt, decay: 0.15, attack: 0.01 });
      if (rarity === 'legendary') {
        setTimeout(() => _play({ type: 'sine', freq: 1568, freqEnd: 2093, duration: 0.18, volume: 0.12, decay: 0.14 }), 120);
      }
    },

    // 아이템 장착
    itemEquip() {
      _play({ type: 'triangle', freq: 880, freqEnd: 1175, duration: 0.10, volume: 0.14, decay: 0.08 });
      _play({ type: 'sine',     freq: 1047, freqEnd: 1319, duration: 0.12, volume: 0.10, decay: 0.10, detune: 5 });
    },

    // 스킬 업그레이드
    skillUpgrade() {
      _play({ type: 'triangle', freq: 784, freqEnd: 1047, duration: 0.14, volume: 0.14, decay: 0.12 });
      _play({ type: 'sine',     freq: 523, freqEnd: 784,  duration: 0.16, volume: 0.10, decay: 0.14, detune: -3 });
    },

    // 보스 소환 발판 충전 완료
    bossSpawn() {
      _noise({ duration: 0.30, volume: 0.22, filterFreq: 300 });
      _play({ type: 'sawtooth', freq: 110, freqEnd: 55, duration: 0.40, volume: 0.20, decay: 0.35 });
      _play({ type: 'square',   freq: 220, freqEnd: 110, duration: 0.30, volume: 0.12, decay: 0.25, detune: -7 });
    },

    // 보스 처치
    bossKill() {
      const ac = _getCtx();
      if (!ac || !_enabled) return;
      _noise({ duration: 0.35, volume: 0.25, filterFreq: 500 });
      const notes = [523, 659, 784, 659, 1047];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          _play({ type: 'triangle', freq, duration: 0.20, volume: 0.18, decay: 0.16 });
        }, i * 60);
      });
    },

    // 게임 오버
    gameOver() {
      const notes = [440, 392, 349, 294, 262];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          _play({ type: 'sawtooth', freq, duration: 0.25, volume: 0.16, decay: 0.22 });
        }, i * 120);
      });
    },

    // 클리어 팡파레
    clear() {
      const notes = [523, 659, 784, 1047, 784, 1047, 1319];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          _play({ type: 'triangle', freq, duration: 0.22, volume: 0.18, decay: 0.18 });
        }, i * 90);
      });
    },

    // 발판 충전 틱 (짧은 삐)
    padChargeTick() {
      _play({ type: 'sine', freq: 880, freqEnd: 1100, duration: 0.05, volume: 0.07, decay: 0.04 });
    },

    // 대시
    dash() {
      _play({ type: 'triangle', freq: 660, freqEnd: 1320, duration: 0.08, volume: 0.12, decay: 0.06 });
      _noise({ duration: 0.05, volume: 0.07, filterFreq: 2000 });
    },

    // 타이틀 → 게임 시작
    gameStart() {
      const notes = [523, 784, 1047];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          _play({ type: 'triangle', freq, duration: 0.15, volume: 0.15, decay: 0.12 });
        }, i * 70);
      });
    },
  };
})();
